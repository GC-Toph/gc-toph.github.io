<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多人决策系统</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--text:#17202a;--muted:#66717e;--line:#dce2e8;--primary:#2457d6;--primary-soft:#edf2ff;--success:#087a4b;--success-soft:#eaf9f1;--warn:#7a5200;--warn-soft:#fff7dc;--danger:#b42318;--danger-soft:#fff0ef;--shadow:0 12px 34px rgba(20,31,45,.08);--radius:16px}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}.shell{width:min(1180px,calc(100% - 28px));margin:18px auto 40px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}.brand h1{margin:0;font-size:clamp(23px,3vw,32px)}.toolbar{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px}.save-state{font-size:13px;color:var(--muted);white-space:nowrap}.save-state:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);margin-right:7px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 13px}.btn:hover:not(:disabled){border-color:#9ea9b5}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:#efb7b3}.stepper{display:flex;gap:8px;overflow-x:auto;padding:7px 2px 12px}.step{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 12px;color:var(--muted);white-space:nowrap}.step.active{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);font-weight:750}.step.done{border-color:#9ad5bb;color:var(--success);background:var(--success-soft)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.panel-head h2{margin:0;font-size:22px}.panel-head p{margin:5px 0 0;color:var(--muted);overflow-wrap:anywhere}.panel-body{padding:22px;min-width:0}.nav{padding:15px 22px;border-top:1px solid var(--line);background:#fbfcfd;display:flex;justify-content:space-between;align-items:center;gap:12px}.nav-note{color:var(--muted);font-size:13px;text-align:center}.card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px;min-width:0}.card.accent{border-color:#c7d5ff;background:linear-gradient(135deg,#edf3ff,#fff)}.card h3{margin:0 0 8px}.rule-list{margin:8px 0 0;padding-left:22px}.rule-list li{margin:8px 0}.section-title{margin:26px 0 12px;font-size:18px}.config-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:14px;font-weight:750}.field small,.muted{color:var(--muted)}input[type=text],input[type=number],input[type=password],select,textarea{width:100%;min-width:0;border:1px solid #cbd3dc;background:#fff;color:var(--text);border-radius:10px;padding:10px 11px;outline:none}textarea{min-height:92px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(36,87,214,.12)}.editor-list{display:grid;gap:9px}.editor-row{display:grid;grid-template-columns:42px minmax(0,1fr) 150px;gap:9px;align-items:center}.index{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#f0f3f7;color:var(--muted);font-weight:750}.status{font-size:12px;color:var(--muted);text-align:right}.status.set{color:var(--success)}.notice{border:1px solid #c9d7ff;background:var(--primary-soft);color:#29477f;padding:12px 14px;border-radius:12px;margin:14px 0;overflow-wrap:anywhere}.notice.warning{border-color:#ecd07b;background:var(--warn-soft);color:var(--warn)}.notice.success{border-color:#9bd8ba;background:var(--success-soft);color:var(--success)}.notice.danger{border-color:#efb7b3;background:var(--danger-soft);color:var(--danger)}.gate{max-width:680px;margin:30px auto;text-align:center}.gate-icon{width:70px;height:70px;margin:0 auto 16px;border-radius:22px;display:grid;place-items:center;font-size:34px;background:var(--primary-soft)}.gate h3{margin:0 0 8px;font-size:23px}.gate p{color:var(--muted)}.pin-display{margin:20px auto 12px;width:min(100%,330px);padding:18px;border:2px dashed var(--primary);border-radius:14px;background:#f7f9ff;font-size:38px;letter-spacing:.34em;text-indent:.34em;font-weight:850;font-variant-numeric:tabular-nums}.pin-input{max-width:260px;margin:12px auto;text-align:center;font-size:25px;letter-spacing:.22em;font-variant-numeric:tabular-nums}.gate-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:14px}.error-text{min-height:24px;color:var(--danger);font-size:14px}.busy{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}.busy:before{content:"";width:15px;height:15px;border:2px solid #cbd3dc;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.ballot-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.sticky{position:sticky;top:14px}.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{border:1px solid var(--line);background:#fafbfc;border-radius:10px;padding:10px}.metric .label{color:var(--muted);font-size:12px}.metric .value{margin-top:2px;font-size:19px;font-weight:800}.table-wrap{max-width:100%;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}.table-wrap table{width:100%;border-collapse:collapse}.standard-table{min-width:620px}.bid-table{min-width:480px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;overflow-wrap:anywhere}th{background:#f8fafc;color:#4d5966;font-size:13px}tr:last-child td{border-bottom:0}th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}.vote-input,.bid-input{width:130px!important;text-align:right}.unlock-grid{display:grid;gap:10px;max-width:760px;margin:18px auto;text-align:left}.unlock-row{display:grid;grid-template-columns:minmax(100px,.8fr) minmax(160px,1fr) 90px;gap:10px;align-items:center}.unlock-status{color:var(--muted);font-size:13px}.unlock-status.ok{color:var(--success);font-weight:750}.unlock-status.bad{color:var(--danger);font-weight:750}.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:750}.tag.good{background:var(--success-soft);color:var(--success)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.result-stack{display:grid;gap:14px}.winner{border:1px solid #9bd8ba;background:linear-gradient(135deg,#edf9f3,#fff);border-radius:14px;padding:18px}.winner h3{color:var(--success);margin:0 0 6px}.winner p{margin:0;font-size:17px}.auction-result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:13px}.auction-result-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px;min-width:0}.auction-result-card.sold{border-color:#9bd8ba;background:linear-gradient(135deg,#edf9f3,#fff)}.auction-result-card h3{margin:0 0 10px}.auction-main{font-size:18px;font-weight:850;margin:10px 0}.result-lines{display:grid;gap:7px;margin-top:12px}.result-line{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding-top:7px}.result-line span:first-child{color:var(--muted)}.bid-list{display:grid;gap:7px;margin-top:12px}.bid-row{display:flex;justify-content:space-between;gap:12px;background:#f8fafc;border-radius:9px;padding:9px 10px}.bid-row.winner-bid{background:var(--success-soft);color:var(--success);font-weight:750}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.person-card,.transfer-card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:14px}.person-card h4{margin:0 0 10px}.person-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.person-metric{background:#f8fafc;border-radius:9px;padding:9px}.person-metric .label{display:block;color:var(--muted);font-size:12px}.person-metric .value{display:block;font-weight:800;margin-top:2px}.transfer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.transfer-route{font-weight:750}.transfer-amount{font-size:20px;font-weight:900;color:var(--primary);margin-top:5px}.dag-wrap{margin:14px 0;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fbfcff}.dag-svg{display:block;width:100%;min-width:680px;height:auto}.dag-edge{stroke:#7d8aa0;stroke-width:2;fill:none}.dag-node-payer{fill:#fff4f1;stroke:#c84b3f;stroke-width:1.5}.dag-node-recipient{fill:#edf9f3;stroke:#23845a;stroke-width:1.5}.dag-label{font-size:13px;fill:#24303c}.dag-amount{font-size:12px;font-weight:700;fill:#2457d6}.audit-list{display:grid;gap:7px;padding:0;list-style:none}.audit-list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:7px 0}.fatal{margin:30px auto;max-width:780px;padding:22px;border:1px solid #efb7b3;border-radius:14px;background:var(--danger-soft);color:var(--danger);white-space:pre-wrap}.hidden{display:none!important}#importFile{display:none}.boot-message{padding:28px}.section-note{color:var(--muted);font-size:13px}
@media(max-width:900px){.ballot-layout{grid-template-columns:1fr}.sticky{position:static}}
@media(max-width:700px){.shell{width:min(100% - 16px,1180px);margin-top:8px}.topbar{flex-direction:column}.toolbar{justify-content:flex-start}.config-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel-head,.panel-body{padding-left:16px;padding-right:16px}.nav{padding-left:16px;padding-right:16px}.nav-note{display:none}.editor-row{grid-template-columns:36px minmax(0,1fr)}.editor-row .status{grid-column:2;text-align:left}.unlock-row{grid-template-columns:1fr}.metric-grid,.person-metrics{grid-template-columns:1fr}.auction-result-grid{grid-template-columns:1fr}.result-line,.bid-row{align-items:flex-start}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
<div class="brand"><h1>多人决策系统</h1></div>
<div class="toolbar"><span class="save-state" id="saveStatus">尚未初始化</span><button class="btn" id="exportBtn" type="button">导出完整状态 JSON</button><button class="btn" id="importBtn" type="button">导入 JSON</button><input id="importFile" type="file" accept="application/json,.json"><button class="btn danger" id="resetBtn" type="button">清空全部状态</button></div>
</header>
<div class="stepper" id="stepper" aria-label="流程步骤"></div>
<main class="panel">
<div id="view"><div class="boot-message"><h2>正在初始化应用</h2><p>若此提示持续不消失，请使用当前版本的 Chrome、Edge、Firefox 或 Safari。</p></div></div>
<footer class="nav"><button class="btn" id="prevBtn" type="button">← 上一步</button><div class="nav-note" id="pageHint">初始化中</div><button class="btn primary" id="nextBtn" type="button">下一步 →</button></footer>
</main>
</div>
<noscript><div style="max-width:900px;margin:24px auto;padding:20px;border:1px solid #efb7b3;background:#fff0ef;color:#b42318">此应用需要启用 JavaScript。</div></noscript>
<script>
(function(){
'use strict';
var STORAGE_KEY='group-decision-secure-state';
var PBKDF2_ITERATIONS=210000;
var TASK_LABELS={single:'最终选择一个选项',multi:'最终选择多个选项',assignment:'密封二价拍卖',custom:'按总分排序'};
var els={view:document.getElementById('view'),stepper:document.getElementById('stepper'),prevBtn:document.getElementById('prevBtn'),nextBtn:document.getElementById('nextBtn'),pageHint:document.getElementById('pageHint'),saveStatus:document.getElementById('saveStatus'),exportBtn:document.getElementById('exportBtn'),importBtn:document.getElementById('importBtn'),importFile:document.getElementById('importFile'),resetBtn:document.getElementById('resetBtn')};
var state=null,activeSession=null,activeSavePromise=Promise.resolve(),resultUnlocked=false,resultBallots=null;

function esc(value){return String(value==null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function num(value,fallback){var n=Number(value);return isFinite(n)?n:(fallback||0)}
function intNum(value,fallback){return Math.trunc?Math.trunc(num(value,fallback)):parseInt(num(value,fallback),10)}
function clamp(value,min,max){return Math.min(max,Math.max(min,value))}
function money(value){return num(value,0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})+' 元'}
function uid(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10)}
function utf8Bytes(text){var s=unescape(encodeURIComponent(String(text))),out=new Uint8Array(s.length);for(var i=0;i<s.length;i++)out[i]=s.charCodeAt(i);return out}
function bytesToB64(bytes){var s='';for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
function b64ToBytes(b64){var s=atob(b64),out=new Uint8Array(s.length);for(var i=0;i<s.length;i++)out[i]=s.charCodeAt(i);return out}
function bytesToHex(bytes){var out='';for(var i=0;i<bytes.length;i++){var h=bytes[i].toString(16);out+=(h.length<2?'0':'')+h}return out}
function randomBytes(length){var out=new Uint8Array(length);window.crypto.getRandomValues(out);return out}
function randomPin(){var a=new Uint32Array(1);window.crypto.getRandomValues(a);var value=String(a[0]%10000);while(value.length<4)value='0'+value;return value}
function constantTimeEqual(a,b){a=String(a);b=String(b);var diff=a.length^b.length,len=Math.max(a.length,b.length);for(var i=0;i<len;i++)diff|=(a.charCodeAt(i%a.length)||0)^(b.charCodeAt(i%b.length)||0);return diff===0}
function cents(value){return Math.max(0,Math.round(num(value,0)*100))}

function defaultState(){var people=[],names=['A','B','C','D'],options=[];for(var i=0;i<names.length;i++)people.push({id:uid('p'),name:names[i],auth:null,sealedBallot:null,sealedAuctionBid:null});for(var j=1;j<=3;j++)options.push({id:uid('o'),name:'选项'+j});return{updatedAt:new Date().toISOString(),currentStep:0,settings:{topic:'请选择一个最适合大家的方案',participants:people,options:options,taskType:'single',winnerCount:2,initialCredits:100,creditPrice:3,maxVote:10,customRule:'按总分从高到低排序。'}}}
function readState(){try{var raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultState();var parsed=JSON.parse(raw);return parsed&&typeof parsed==='object'?parsed:defaultState()}catch(e){return defaultState()}}
function validAuth(a){return !!(a&&a.scheme==='PBKDF2-SHA-256-512'&&typeof a.salt==='string'&&typeof a.verifier==='string'&&num(a.iterations,0)>=100000)}
function validSealed(s){return !!(s&&s.scheme==='AES-GCM-256'&&typeof s.iv==='string'&&typeof s.ciphertext==='string')}
function normalizeState(candidate){var fallback=defaultState();if(!candidate||typeof candidate!=='object'||!candidate.settings)candidate=fallback;var next=candidate;next.settings=Object.assign({},fallback.settings,next.settings||{});if(!Array.isArray(next.settings.participants)||!next.settings.participants.length)next.settings.participants=fallback.settings.participants;if(!Array.isArray(next.settings.options)||!next.settings.options.length)next.settings.options=fallback.settings.options;var people=[];for(var i=0;i<next.settings.participants.length;i++){var p=next.settings.participants[i]||{};people.push({id:p.id||uid('p'),name:String(p.name||('参与者'+(i+1))),auth:validAuth(p.auth)?p.auth:null,sealedBallot:validSealed(p.sealedBallot)?p.sealedBallot:null,sealedAuctionBid:validSealed(p.sealedAuctionBid)?p.sealedAuctionBid:null})}next.settings.participants=people;var options=[];for(var j=0;j<next.settings.options.length;j++){var o=next.settings.options[j]||{};options.push({id:o.id||uid('o'),name:String(o.name||('选项'+(j+1)))})}next.settings.options=options;if(!TASK_LABELS[next.settings.taskType])next.settings.taskType='single';next.settings.winnerCount=clamp(intNum(next.settings.winnerCount,2),1,options.length);next.settings.initialCredits=Math.max(0,num(next.settings.initialCredits,100));next.settings.creditPrice=Math.max(0,num(next.settings.creditPrice,3));next.settings.maxVote=Math.max(1,intNum(next.settings.maxVote,10));next.settings.topic=String(next.settings.topic||fallback.settings.topic);next.settings.customRule=String(next.settings.customRule||fallback.settings.customRule);delete next.auctions;delete next.auctionBids;delete next.version;state=next;state.currentStep=clamp(intNum(state.currentStep,0),0,totalSteps()-1)}
function totalSteps(){return state.settings.participants.length+2}
function saveState(){state.updatedAt=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));els.saveStatus.textContent='已自动保存 '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}catch(e){els.saveStatus.textContent='本地保存不可用，请导出 JSON'}}

function deriveMaterial(pin,auth){var salt=b64ToBytes(auth.salt);return window.crypto.subtle.importKey('raw',utf8Bytes(pin),{name:'PBKDF2'},false,['deriveBits']).then(function(baseKey){return window.crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:auth.iterations,hash:'SHA-256'},baseKey,512)}).then(function(bits){var all=new Uint8Array(bits),verifier=bytesToHex(all.slice(0,32));return window.crypto.subtle.importKey('raw',all.slice(32,64),{name:'AES-GCM'},false,['encrypt','decrypt']).then(function(aesKey){all.fill(0);return{verifier:verifier,aesKey:aesKey}})})}
function newAuthAndKey(pin){var auth={scheme:'PBKDF2-SHA-256-512',salt:bytesToB64(randomBytes(16)),iterations:PBKDF2_ITERATIONS,verifier:''};return deriveMaterial(pin,auth).then(function(material){auth.verifier=material.verifier;return{auth:auth,aesKey:material.aesKey}})}
function aadFor(personId,kind){return utf8Bytes('quadratic-group-decision|'+kind+'|'+personId)}
function encryptPayload(personId,aesKey,payload,kind){var iv=randomBytes(12),plain=utf8Bytes(JSON.stringify(payload));return window.crypto.subtle.encrypt({name:'AES-GCM',iv:iv,additionalData:aadFor(personId,kind),tagLength:128},aesKey,plain).then(function(cipher){plain.fill(0);return{scheme:'AES-GCM-256',kind:kind,iv:bytesToB64(iv),ciphertext:bytesToB64(new Uint8Array(cipher)),updatedAt:new Date().toISOString()}})}
function encryptBallot(personId,aesKey,payload){return encryptPayload(personId,aesKey,payload,'ballot')}
function encryptAuctionBid(personId,aesKey,payload){return encryptPayload(personId,aesKey,payload,'auction-bid')}
function decryptPayload(personId,aesKey,sealed,kind,emptyFactory,normalizer){if(!sealed)return Promise.resolve(normalizer(emptyFactory()));return window.crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(sealed.iv),additionalData:aadFor(personId,kind),tagLength:128},aesKey,b64ToBytes(sealed.ciphertext)).then(function(plain){var text=decodeURIComponent(escape(String.fromCharCode.apply(null,new Uint8Array(plain))));return normalizer(JSON.parse(text))})}
function decryptBallot(personId,aesKey,sealed){return decryptPayload(personId,aesKey,sealed,'ballot',defaultBallotPayload,normalizeBallotPayload)}
function decryptAuctionBid(personId,aesKey,sealed){return decryptPayload(personId,aesKey,sealed,'auction-bid',defaultAuctionBidPayload,normalizeAuctionBidPayload)}
function defaultBallotPayload(){return{version:1,modes:{single:{},multi:{},custom:{}}}}
function normalizeBallotPayload(payload){var p=payload&&typeof payload==='object'?payload:defaultBallotPayload();if(!p.modes||typeof p.modes!=='object')p.modes={};var names=['single','multi','custom'];for(var i=0;i<names.length;i++)if(!p.modes[names[i]]||typeof p.modes[names[i]]!=='object')p.modes[names[i]]={};return p}
function defaultAuctionBidPayload(){return{version:1,bids:{}}}
function normalizeAuctionBidPayload(payload){var p=payload&&typeof payload==='object'?payload:defaultAuctionBidPayload();if(!p.bids||typeof p.bids!=='object')p.bids={};return p}
function normalizeAuctionBidsForCurrentConfig(payload){payload=normalizeAuctionBidPayload(payload);for(var i=0;i<state.settings.options.length;i++){var o=state.settings.options[i];payload.bids[o.id]=safeBid(payload.bids[o.id])}return payload}
function safeVote(value){return clamp(intNum(value,0),0,state.settings.maxVote)}
function safeBid(value){var v=Math.round(Math.max(0,num(value,0))*100)/100;return isFinite(v)?v:0}
function normalizeVotesForCurrentConfig(payload){payload=normalizeBallotPayload(payload);var opts=state.settings.options,modes=['single','multi','custom'];for(var m=0;m<modes.length;m++){var map=payload.modes[modes[m]];for(var i=0;i<opts.length;i++)map[opts[i].id]=safeVote(map[opts[i].id])}return payload}
function findPerson(id){for(var i=0;i<state.settings.participants.length;i++)if(state.settings.participants[i].id===id)return state.settings.participants[i];return null}
function currentPerson(){return state.settings.participants[state.currentStep-1]||null}
function currentMode(){return state.settings.taskType}
function clearSensitiveMemory(){activeSession=null;resultBallots=null;resultUnlocked=false}
function flushActiveSession(){return activeSavePromise.catch(function(){return null})}
function sealActiveSession(){if(!activeSession)return Promise.resolve();var person=findPerson(activeSession.personId);if(!person)return Promise.resolve();var isAuction=activeSession.kind==='auction',snapshot=JSON.parse(JSON.stringify(activeSession.data));activeSavePromise=activeSavePromise.then(function(){return isAuction?encryptAuctionBid(person.id,activeSession.aesKey,snapshot):encryptBallot(person.id,activeSession.aesKey,snapshot)}).then(function(sealed){if(isAuction)person.sealedAuctionBid=sealed;else person.sealedBallot=sealed;saveState()}).catch(function(err){showError('加密保存失败：'+err.message)});return activeSavePromise}
function navigateTo(step){flushActiveSession().then(function(){clearSensitiveMemory();state.currentStep=clamp(intNum(step,0),0,totalSteps()-1);saveState();render()})}

function setNav(prevDisabled,nextDisabled,nextText){els.prevBtn.disabled=!!prevDisabled;els.nextBtn.disabled=!!nextDisabled;els.nextBtn.textContent=nextText||'下一步 →'}

function renderSetup(){var s=state.settings,isAuction=s.taskType==='assignment';setNav(true,false,'进入第 1 位参与者 →');var peopleHtml='';for(var i=0;i<s.participants.length;i++){var p=s.participants[i],statusText=isAuction?(p.sealedAuctionBid?'密封报价已保存':(p.auth?'密码已建立，尚未报价':'尚未建立密码')):(p.sealedBallot?'加密选票已保存':(p.auth?'密码已建立，尚未投票':'尚未建立密码')),statusSet=isAuction?!!p.sealedAuctionBid:!!p.sealedBallot;peopleHtml+='<div class="editor-row"><span class="index">'+(i+1)+'</span><input type="text" data-person-name="'+esc(p.id)+'" value="'+esc(p.name)+'"><span class="status '+(statusSet?'set':'')+'">'+statusText+'</span></div>'}var optionsHtml='';for(var j=0;j<s.options.length;j++){var o=s.options[j];optionsHtml+='<div class="editor-row"><span class="index">'+(j+1)+'</span><input type="text" data-option-name="'+esc(o.id)+'" value="'+esc(o.name)+'"><span class="status set">'+(isAuction?'密封竞价':'已设置')+'</span></div>'}var ruleHtml=isAuction?'<div class="card accent"><h3>密封二价拍卖规则</h3><ol class="rule-list"><li><strong>投标阶段：</strong>每位竞标者使用自己的密码，在个人页面一次填写对所有物品的密封报价；0 元表示不参与该物品。</li><li><strong>开标阶段：</strong>所有人提交后，在结果页输入全员密码，系统一次性解密并公布全部报价。</li><li><strong>分配阶段：</strong>每件物品由唯一最高报价者获得。</li><li><strong>支付阶段：</strong>获胜者支付该物品的第二高报价。</li><li>系统不设置卖家和起拍价。无人提交正报价时不分配；最高报价并列时不自动分配；只有一人提交正报价时，第二高报价为 0 元。</li></ol></div>':'<div class="card accent"><h3>使用规则</h3><ol class="rule-list"><li>每人对每项填写 0 到最高分。</li><li>给某项填写 x 分，消耗 x² 积分。超出免费积分的部分按每分价格购买，购买款均分给其他参与者。</li><li>最终结果确定后，系统按落选选项的未实现平方价值补偿落选者；每位落选者的补偿总额由其余 n−1 人均摊，因此每条结果付款边为该补偿总额 ÷ (n−1)。结果付款边与购买款边一起净额化。</li></ol></div>';var standardFields=isAuction?'':'<div class="field '+(s.taskType==='multi'?'':'hidden')+'"><label for="winnerCount">最终选择数量</label><input id="winnerCount" type="number" min="1" max="'+s.options.length+'" value="'+s.winnerCount+'"></div><div class="field"><label for="initialCredits">每人免费积分</label><input id="initialCredits" type="number" min="0" step="1" value="'+s.initialCredits+'"></div><div class="field"><label for="creditPrice">每分价格（元）</label><input id="creditPrice" type="number" min="0" step="0.01" value="'+s.creditPrice+'"></div><div class="field"><label for="maxVote">单个选项最高分</label><input id="maxVote" type="number" min="1" max="100" value="'+s.maxVote+'"></div><div class="field '+(s.taskType==='custom'?'':'hidden')+'"><label for="customRule">结果说明</label><input id="customRule" type="text" value="'+esc(s.customRule)+'"></div>';els.view.innerHTML='<div class="panel-head"><div><h2>规则与配置</h2></div></div><div class="panel-body">'+ruleHtml+'<h3 class="section-title">基本设置</h3><div class="config-grid"><div class="field full"><label for="topicInput">主题</label><textarea id="topicInput">'+esc(s.topic)+'</textarea></div><div class="field"><label for="participantCount">参与人数</label><input id="participantCount" type="number" min="1" max="30" value="'+s.participants.length+'"><small>删除参与者会同时删除其加密选票和密封报价。</small></div><div class="field"><label for="optionCount">'+(isAuction?'物品数量':'选项数量')+'</label><input id="optionCount" type="number" min="1" max="50" value="'+s.options.length+'"></div><div class="field"><label for="taskType">任务类型</label><select id="taskType"><option value="single" '+(s.taskType==='single'?'selected':'')+'>最终选择一个选项</option><option value="multi" '+(s.taskType==='multi'?'selected':'')+'>最终选择多个选项</option><option value="assignment" '+(s.taskType==='assignment'?'selected':'')+'>密封二价拍卖</option><option value="custom" '+(s.taskType==='custom'?'selected':'')+'>按总分排序</option></select></div>'+standardFields+'</div><h3 class="section-title">参与者</h3><div class="editor-list">'+peopleHtml+'</div><h3 class="section-title">'+(isAuction?'拍卖物品':'选项')+'</h3><div class="editor-list">'+optionsHtml+'</div><div class="notice warning">每人的四位密码只显示一次，无法重置。忘记任何一人的密码，都无法开标或查看最终结果。</div></div>';bindSetup()}
function bindSetup(){function id(x){return document.getElementById(x)}id('topicInput').addEventListener('input',function(){state.settings.topic=this.value;saveState()});id('participantCount').addEventListener('change',function(){resizeParticipants(this.value)});id('optionCount').addEventListener('change',function(){resizeOptions(this.value)});id('taskType').addEventListener('change',function(){var previous=state.settings.taskType;state.settings.taskType=this.value;if(this.value==='assignment'){if(state.settings.topic==='请选择一个最适合大家的方案')state.settings.topic='密封拍卖以下物品';for(var i=0;i<state.settings.options.length;i++)if(/^选项\d+$/.test(state.settings.options[i].name))state.settings.options[i].name='物品'+(i+1)}else if(previous==='assignment'&&state.settings.topic==='密封拍卖以下物品')state.settings.topic='请选择一个最适合大家的方案';state.currentStep=0;clearSensitiveMemory();saveState();render()});var wc=id('winnerCount');if(wc)wc.addEventListener('change',function(){state.settings.winnerCount=clamp(intNum(this.value,1),1,state.settings.options.length);saveState();render()});var ic=id('initialCredits');if(ic)ic.addEventListener('change',function(){state.settings.initialCredits=Math.max(0,num(this.value,100));saveState()});var cp=id('creditPrice');if(cp)cp.addEventListener('change',function(){state.settings.creditPrice=Math.max(0,num(this.value,3));saveState()});var mv=id('maxVote');if(mv)mv.addEventListener('change',function(){state.settings.maxVote=Math.max(1,intNum(this.value,10));saveState()});var cr=id('customRule');if(cr)cr.addEventListener('input',function(){state.settings.customRule=this.value;saveState()});var personInputs=els.view.querySelectorAll('[data-person-name]');for(var i=0;i<personInputs.length;i++)personInputs[i].addEventListener('change',function(){var p=findPerson(this.getAttribute('data-person-name'));if(p)p.name=this.value.trim()||'未命名参与者';this.value=p.name;saveState();renderStepper()});var optionInputs=els.view.querySelectorAll('[data-option-name]');for(var j=0;j<optionInputs.length;j++)optionInputs[j].addEventListener('change',function(){var o=findOption(this.getAttribute('data-option-name'));if(o)o.name=this.value.trim()||'未命名选项';this.value=o.name;saveState()})}
function findOption(id){for(var i=0;i<state.settings.options.length;i++)if(state.settings.options[i].id===id)return state.settings.options[i];return null}
function resizeParticipants(value){var target=clamp(intNum(value,1),1,30),old=state.settings.participants,next=[];for(var i=0;i<target;i++)next.push(old[i]||{id:uid('p'),name:'参与者'+(i+1),auth:null,sealedBallot:null,sealedAuctionBid:null});state.settings.participants=next;state.currentStep=clamp(state.currentStep,0,totalSteps()-1);clearSensitiveMemory();saveState();render()}
function resizeOptions(value){var target=clamp(intNum(value,1),1,50),old=state.settings.options,next=[];for(var i=0;i<target;i++)next.push(old[i]||{id:uid('o'),name:(currentMode()==='assignment'?'物品':'选项')+(i+1)});state.settings.options=next;state.settings.winnerCount=clamp(state.settings.winnerCount,1,target);state.currentStep=clamp(state.currentStep,0,totalSteps()-1);clearSensitiveMemory();saveState();render()}

function renderParticipantEntry(person){if(!person)return;if(activeSession&&activeSession.personId===person.id)renderBallot(person);else renderParticipantGate(person)}
function renderParticipantGate(person){var isAuction=currentMode()==='assignment',hasSaved=!!(person.auth&&(isAuction?person.sealedAuctionBid:person.sealedBallot)),nextText=state.currentStep===state.settings.participants.length?(isAuction?'进入开标与结果 →':'进入结果解锁 →'):'下一位参与者 →';setNav(false,!hasSaved,hasSaved?nextText:'请先建立密码并加密保存');var hasAuth=!!person.auth,noun=isAuction?'密封报价':'选票';els.view.innerHTML='<div class="panel-head"><div><h2>'+esc(person.name)+'：个人加密页面</h2><p>只有本人密码可以解密、查看或修改本人的'+noun+'。</p></div><span class="tag">第 '+state.currentStep+' 位参与者</span></div><div class="panel-body"><section class="gate"><div class="gate-icon">🔒</div><h3>'+(hasAuth?'请输入你的四位密码':'生成只显示一次的四位密码')+'</h3><p>'+(hasAuth?'验证成功后进入 '+esc(person.name)+' 的独立'+noun+'页。离开页面后，解密密钥会从内存中清除。':'密码只显示一次。系统仅保存加盐校验值和 AES-GCM 密文，不保存明文密码或明文报价。')+'</p><div id="gateContent">'+(hasAuth?'<input id="pinInput" class="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" placeholder="••••"><div class="error-text" id="pinError"></div><div class="gate-actions"><button class="btn primary" id="verifyPinBtn" type="button">验证并解密我的'+noun+'</button></div>':'<div class="gate-actions"><button class="btn primary" id="revealPinBtn" type="button">生成密码并建立加密记录</button></div>')+'</div></section><div class="notice warning">请确保屏幕当前只由 '+esc(person.name)+' 查看。忘记密码后，密文无法恢复。</div></div>';
function enterWith(material){if(isAuction){var source=person.sealedAuctionBid?decryptAuctionBid(person.id,material.aesKey,person.sealedAuctionBid):Promise.resolve(defaultAuctionBidPayload());return source.then(function(data){activeSession={personId:person.id,aesKey:material.aesKey,kind:'auction',data:normalizeAuctionBidsForCurrentConfig(data)};renderBallot(person)})}return decryptBallot(person.id,material.aesKey,person.sealedBallot).then(function(data){activeSession={personId:person.id,aesKey:material.aesKey,kind:'ballot',data:normalizeVotesForCurrentConfig(data)};renderBallot(person)})}
if(hasAuth){var input=document.getElementById('pinInput');var verify=function(){var pin=input.value.trim();if(!/^\d{4}$/.test(pin)){document.getElementById('pinError').textContent='请输入完整的四位数字。';return}setGateBusy('正在验证密码并解密个人数据…');deriveMaterial(pin,person.auth).then(function(material){input.value='';if(!constantTimeEqual(material.verifier,person.auth.verifier))throw new Error('密码不匹配。');return enterWith(material)}).catch(function(err){renderParticipantGate(person);var e=document.getElementById('pinError');if(e)e.textContent=err.message})};document.getElementById('verifyPinBtn').addEventListener('click',verify);input.addEventListener('keydown',function(e){if(e.key==='Enter')verify()});input.focus()}else document.getElementById('revealPinBtn').addEventListener('click',function(){var pin=randomPin();setGateBusy('正在建立密码校验值与 AES-GCM 加密密钥…');newAuthAndKey(pin).then(function(bundle){person.auth=bundle.auth;var data=isAuction?normalizeAuctionBidsForCurrentConfig(defaultAuctionBidPayload()):normalizeVotesForCurrentConfig(defaultBallotPayload());return(isAuction?encryptAuctionBid(person.id,bundle.aesKey,data):encryptBallot(person.id,bundle.aesKey,data)).then(function(sealed){if(isAuction)person.sealedAuctionBid=sealed;else person.sealedBallot=sealed;saveState();activeSession={personId:person.id,aesKey:bundle.aesKey,kind:isAuction?'auction':'ballot',data:data};var gate=document.getElementById('gateContent');gate.innerHTML='<div class="pin-display" aria-label="一次性显示的四位密码">'+pin+'</div><p><strong>请立即记住。</strong>离开、刷新或关闭后不会再次显示。</p><div class="gate-actions"><button class="btn primary" id="continueAfterPin" type="button">我已记住，进入个人页面</button></div>';pin='';document.getElementById('continueAfterPin').addEventListener('click',function(){renderBallot(person)})})}).catch(function(err){renderParticipantGate(person);var e=document.getElementById('pinError');if(e)e.textContent='建立加密记录失败：'+err.message})})}
function setGateBusy(text){var gate=document.getElementById('gateContent');if(gate)gate.innerHTML='<div class="busy">'+esc(text)+'</div><div class="error-text" id="pinError"></div>'}

function ballotVotes(payload,mode){var values=[],opts=state.settings.options;for(var i=0;i<opts.length;i++)values.push(safeVote(payload.modes[mode][opts[i].id]));return values}
function financeForPayload(payload){var vals=ballotVotes(payload,currentMode()),cost=0;for(var i=0;i<vals.length;i++)cost+=vals[i]*vals[i];var bought=Math.max(0,cost-state.settings.initialCredits);return{cost:cost,freeRemaining:Math.max(0,state.settings.initialCredits-cost),purchasedCredits:bought,purchaseAmount:bought*state.settings.creditPrice}}
function valueForScore(score){var v=safeVote(score);return v*v*state.settings.creditPrice}

function standardBallotHtml(payload,mode){var rows='';for(var i=0;i<state.settings.options.length;i++){var o=state.settings.options[i],v=safeVote(payload.modes[mode][o.id]);rows+='<tr><td><strong>'+esc(o.name)+'</strong></td><td class="num"><input class="vote-input" data-vote-option="'+esc(o.id)+'" type="number" min="0" max="'+state.settings.maxVote+'" step="1" value="'+v+'"></td><td class="num" data-cost-option="'+esc(o.id)+'">'+(v*v)+'</td><td class="num" data-value-option="'+esc(o.id)+'">'+money(valueForScore(v))+'</td></tr>'}return'<div class="notice">分数和积分成本会加密保存，其他参与者在开锁前无法查看。</div><div class="table-wrap"><table class="standard-table"><thead><tr><th>选项</th><th class="num">分数</th><th class="num">积分成本</th><th class="num">平方价值</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}
function renderAuctionBidForm(person){var rows='';for(var i=0;i<state.settings.options.length;i++){var o=state.settings.options[i],bid=safeBid(activeSession.data.bids[o.id]);rows+='<tr><td><strong>'+esc(o.name)+'</strong></td><td class="num"><input class="bid-input" data-auction-bid="'+esc(o.id)+'" type="number" min="0" step="0.01" value="'+bid+'" aria-label="'+esc(person.name)+' 对 '+esc(o.name)+' 的密封报价"></td></tr>'}els.view.innerHTML='<div class="panel-head"><div><h2>'+esc(person.name)+'：我的密封报价</h2><p>在同一个个人页面中填写对所有物品的最高愿付价格。</p></div><button class="btn" id="lockBallotBtn" type="button">加密保存并锁定</button></div><div class="panel-body"><div class="notice"><strong>报价保密：</strong>全部金额会一起写入 '+esc(person.name)+' 的独立 AES-GCM 密文。其他参与者在统一开标前无法查看。0 元表示不参与该物品。</div><div class="table-wrap"><table class="bid-table"><thead><tr><th>物品</th><th class="num">我的密封报价</th></tr></thead><tbody>'+rows+'</tbody></table></div><div id="saveBallotStatus" class="status" style="margin-top:10px">密文将在修改后自动更新</div></div>';bindBallotLock(person);var inputs=els.view.querySelectorAll('[data-auction-bid]');for(var j=0;j<inputs.length;j++)inputs[j].addEventListener('change',function(){var v=safeBid(this.value),oid=this.getAttribute('data-auction-bid');this.value=v;activeSession.data.bids[oid]=v;markAndSeal()})}

function updateMetrics(){if(!activeSession||currentMode()==='assignment')return;var f=financeForPayload(activeSession.data);document.getElementById('metricCost').textContent=f.cost;document.getElementById('metricFree').textContent=f.freeRemaining;document.getElementById('metricBought').textContent=f.purchasedCredits;document.getElementById('metricMoney').textContent=money(f.purchaseAmount)}

function renderResultsGate(){var isAuction=currentMode()==='assignment';setNav(false,true,isAuction?'开标需要全员密码':'结果需要全员密码');var rows='',missing=0;for(var i=0;i<state.settings.participants.length;i++){var p=state.settings.participants[i],sealed=isAuction?p.sealedAuctionBid:p.sealedBallot;if(!p.auth||!sealed)missing++;rows+='<div class="unlock-row"><strong>'+esc(p.name)+'</strong><input type="password" inputmode="numeric" maxlength="4" autocomplete="off" data-result-pin="'+esc(p.id)+'" placeholder="输入四位密码" '+(!p.auth?'disabled':'')+'><span class="unlock-status" data-result-status="'+esc(p.id)+'">'+(p.auth?(sealed?'待验证':'尚未提交'):'尚未建立')+'</span></div>'}els.view.innerHTML='<div class="panel-head"><div><h2>'+(isAuction?'全员密码统一开标':'全员密码解锁结果')+'</h2><p>'+(isAuction?'系统将分别解密每位参与者的独立报价密文，然后一次性公布所有物品的全部报价。':'只有所有参与者的密码都匹配并成功解密选票，系统才会计算结果。')+'</p></div><span class="tag">AES-GCM 密封数据</span></div><div class="panel-body"><section class="gate" style="max-width:800px"><div class="gate-icon">🔐</div><h3>请每位参与者依次输入自己的密码</h3><div class="unlock-grid">'+rows+'</div><div class="error-text" id="resultPinError"></div><div class="gate-actions"><button class="btn primary" id="unlockResultsBtn" type="button" '+(missing?'disabled':'')+'>'+(isAuction?'验证全员密码并统一开标':'验证全部密码并解密结果')+'</button></div></section>'+(missing?'<div class="notice danger">仍有 '+missing+' 位参与者尚未完成加密'+(isAuction?'报价':'投票')+'。每个人必须先进入自己的个人页面并保存。</div>':'')+'<div class="notice warning">明文报价、密码和解密密钥只保留在内存中；刷新、离开结果页或重新锁定后会清除。</div></div>';var btn=document.getElementById('unlockResultsBtn');if(btn&&!btn.disabled)btn.addEventListener('click',unlockAllResults)}
function unlockAllResults(){var isAuction=currentMode()==='assignment',btn=document.getElementById('unlockResultsBtn');btn.disabled=true;btn.textContent=isAuction?'正在验证并解密全部密封报价…':'正在验证并解密…';var tasks=[];for(var i=0;i<state.settings.participants.length;i++){(function(person){var input=els.view.querySelector('[data-result-pin="'+person.id+'"]'),status=els.view.querySelector('[data-result-status="'+person.id+'"]'),pin=input.value.trim();if(!/^\d{4}$/.test(pin)){status.textContent='格式错误';status.className='unlock-status bad';tasks.push(Promise.reject(new Error(person.name+' 的密码格式错误')));return}tasks.push(deriveMaterial(pin,person.auth).then(function(material){input.value='';if(!constantTimeEqual(material.verifier,person.auth.verifier))throw new Error(person.name+' 的密码不匹配');var promise=isAuction?decryptAuctionBid(person.id,material.aesKey,person.sealedAuctionBid):decryptBallot(person.id,material.aesKey,person.sealedBallot);return promise.then(function(data){status.textContent='已解密';status.className='unlock-status ok';return{personId:person.id,data:isAuction?normalizeAuctionBidsForCurrentConfig(data):normalizeVotesForCurrentConfig(data)}})}).catch(function(err){status.textContent='解密失败';status.className='unlock-status bad';throw err}))})(state.settings.participants[i])}Promise.all(tasks).then(function(rows){resultBallots={};for(var j=0;j<rows.length;j++)resultBallots[rows[j].personId]=rows[j].data;resultUnlocked=true;renderResults()}).catch(function(err){document.getElementById('resultPinError').textContent=err.message+'。结果仍保持锁定。';btn.disabled=false;btn.textContent='重新验证全部密码'})}
function payloadFor(personId){return resultBallots[personId]}
function renderResults(){if(currentMode()==='assignment')renderAuctionResults();else renderVotingResults()}

function auctionResultFor(option){var bids=[];for(var i=0;i<state.settings.participants.length;i++){var p=state.settings.participants[i],payload=payloadFor(p.id),bid=safeBid(payload&&payload.bids?payload.bids[option.id]:0);bids.push({person:p,bid:bid})}bids.sort(function(a,b){return b.bid-a.bid||a.person.name.localeCompare(b.person.name,'zh-CN')});var positive=bids.filter(function(x){return x.bid>0});if(!positive.length)return{status:'unsold',reason:'无人提交正报价',bids:bids,winner:null,payment:0,highest:0,second:0};var top=positive[0].bid,ties=positive.filter(function(x){return x.bid===top});if(ties.length>1)return{status:'tie',reason:'最高报价并列',bids:bids,winner:null,payment:0,highest:top,second:top};var winner=positive[0],second=bids.length>1?bids[1].bid:0;return{status:'sold',reason:'成交',bids:bids,winner:winner.person,payment:second,highest:winner.bid,second:second}}
function renderAuctionResults(){setNav(false,true,'开标完成');var cards='';for(var i=0;i<state.settings.options.length;i++){var o=state.settings.options[i],r=auctionResultFor(o),bidRows='';for(var j=0;j<r.bids.length;j++){var b=r.bids[j],cls=r.winner&&r.winner.id===b.person.id?' winner-bid':'';bidRows+='<div class="bid-row'+cls+'"><span>'+esc(b.person.name)+(r.winner&&r.winner.id===b.person.id?' · 赢家':'')+'</span><strong>'+money(b.bid)+'</strong></div>'}if(!bidRows)bidRows='<div class="muted">没有竞标者。</div>';var sold=r.status==='sold',tagClass=sold?'good':(r.status==='tie'?'warn':''),main=sold?('赢家：'+r.winner.name):r.reason;cards+='<article class="auction-result-card '+(sold?'sold':'')+'"><h3>'+esc(o.name)+'</h3><span class="tag '+tagClass+'">'+esc(sold?'成交':(r.status==='tie'?'并列':'未分配'))+'</span><div class="auction-main">'+esc(main)+'</div><div class="result-lines"><div class="result-line"><span>最高报价</span><strong>'+money(r.highest)+'</strong></div><div class="result-line"><span>第二高报价</span><strong>'+money(r.second)+'</strong></div><div class="result-line"><span>赢家支付</span><strong>'+money(r.payment)+'</strong></div></div><h4 style="margin:16px 0 8px">开标后的全部报价</h4><div class="bid-list">'+bidRows+'</div></article>'}els.view.innerHTML='<div class="panel-head"><div><h2>密封二价拍卖结果</h2><p>'+esc(state.settings.topic)+'</p></div><button class="btn" id="lockResultsBtn" type="button">清除内存并重新锁定</button></div><div class="panel-body"><div class="notice"><strong>结算规则：</strong>唯一最高报价者获得物品，并支付第二高报价。系统不设置卖家或起拍价；只有一人提交正报价时，第二高报价为 0 元；最高报价并列时不自动分配。</div><div class="auction-result-grid">'+cards+'</div></div>';document.getElementById('lockResultsBtn').addEventListener('click',function(){resultUnlocked=false;resultBallots=null;renderResultsGate()})}

function aggregateStandard(){var mode=currentMode(),out=[];for(var i=0;i<state.settings.options.length;i++){var o=state.settings.options[i],score=0;for(var j=0;j<state.settings.participants.length;j++){var p=state.settings.participants[j];score+=num(payloadFor(p.id).modes[mode][o.id],0)}out.push({option:o,score:score})}out.sort(function(a,b){return b.score-a.score||a.option.name.localeCompare(b.option.name,'zh-CN')});return out}
function decisionSummary(){var mode=currentMode(),ranked=aggregateStandard();if(mode==='single'){var best=ranked.length?ranked[0].score:0,ties=ranked.filter(function(x){return x.score===best});return ties.length===1?{title:'最终选择',text:ties[0].option.name+'（总分 '+best+'）'}:{title:'最高分并列',text:ties.map(function(x){return x.option.name}).join('、')+'（总分 '+best+'）'}}if(mode==='multi'){var k=clamp(state.settings.winnerCount,1,ranked.length),cutoff=ranked[k-1].score,certain=ranked.filter(function(x){return x.score>cutoff}),tied=ranked.filter(function(x){return x.score===cutoff}),text=tied.length>k-certain.length?'确定入选：'+(certain.map(function(x){return x.option.name}).join('、')||'无')+'；截止位并列：'+tied.map(function(x){return x.option.name}).join('、'):ranked.slice(0,k).map(function(x){return x.option.name}).join('、');return{title:'入选结果',text:text}}return{title:'总分排序',text:ranked.map(function(x){return x.option.name+'（'+x.score+'）'}).join(' > ')}}
function allFinance(){var out={};for(var i=0;i<state.settings.participants.length;i++){var p=state.settings.participants[i];out[p.id]=financeForPayload(payloadFor(p.id))}return out}
function splitPurchasePayments(finances){var people=state.settings.participants,out=[];if(people.length<=1)return out;for(var i=0;i<people.length;i++){var payer=people[i],total=cents(finances[payer.id].purchaseAmount),recipients=[];for(var j=0;j<people.length;j++)if(j!==i)recipients.push(people[j]);var base=Math.floor(total/recipients.length),remainder=total%recipients.length;for(var k=0;k<recipients.length;k++){var amount=base+(k<remainder?1:0);if(amount>0)out.push({payer:payer,recipient:recipients[k],cents:amount,amount:amount/100,reason:'额外积分购买款'})}}return out}
function resolvedOutcome(){var mode=currentMode(),ranked=aggregateStandard(),selected={};if(!ranked.length)return{resolved:false,selected:selected,note:'没有可结算的选项。'};if(mode==='multi'){var k=clamp(state.settings.winnerCount,1,ranked.length),cutoff=ranked[k-1].score,certain=ranked.filter(function(x){return x.score>cutoff}),tied=ranked.filter(function(x){return x.score===cutoff});if(tied.length>k-certain.length)return{resolved:false,selected:selected,note:'截止位并列，本轮不产生结果付款边。'};for(var i=0;i<k;i++)selected[ranked[i].option.id]=true}else{var best=ranked[0].score,ties=ranked.filter(function(x){return x.score===best});if(ties.length!==1)return{resolved:false,selected:selected,note:'最高分并列，本轮不产生结果付款边。'};selected[ranked[0].option.id]=true}return{resolved:true,selected:selected,note:'最终结果已确定。'}}
function netTransfersFromGross(people,gross){var balances={},i;for(i=0;i<people.length;i++)balances[people[i].id]=0;for(i=0;i<gross.length;i++){balances[gross[i].payer.id]-=gross[i].cents;balances[gross[i].recipient.id]+=gross[i].cents}var debtors=[],creditors=[];for(i=0;i<people.length;i++){var b=balances[people[i].id];if(b<0)debtors.push({person:people[i],remaining:-b});else if(b>0)creditors.push({person:people[i],remaining:b})}debtors.sort(function(a,b){return b.remaining-a.remaining});creditors.sort(function(a,b){return b.remaining-a.remaining});var d=0,c=0,net=[];while(d<debtors.length&&c<creditors.length){var paid=Math.min(debtors[d].remaining,creditors[c].remaining);if(paid>0)net.push({payer:debtors[d].person,recipient:creditors[c].person,cents:paid,amount:paid/100});debtors[d].remaining-=paid;creditors[c].remaining-=paid;if(!debtors[d].remaining)d++;if(!creditors[c].remaining)c++}return{balances:balances,net:net}}
function settlementData(){var people=state.settings.participants,finances=allFinance(),purchase=splitPurchasePayments(finances),outcome=resolvedOutcome(),outcomeTransfers=[];if(outcome.resolved&&people.length>1){for(var i=0;i<people.length;i++){var recipient=people[i],payload=payloadFor(recipient.id),square=0;for(var j=0;j<state.settings.options.length;j++){var o=state.settings.options[j];if(!outcome.selected[o.id]){var v=safeVote(payload.modes[currentMode()][o.id]);square+=v*v}}var total=cents(square*state.settings.creditPrice),payers=[];for(var k=0;k<people.length;k++)if(people[k].id!==recipient.id)payers.push(people[k]);var base=Math.floor(total/payers.length),remainder=total%payers.length;for(var x=0;x<payers.length;x++){var edgeCents=base+(x<remainder?1:0);if(edgeCents>0)outcomeTransfers.push({payer:payers[x],recipient:recipient,cents:edgeCents,amount:edgeCents/100,reason:recipient.name+' 的未实现价值 ÷ '+payers.length})}}}var gross=purchase.concat(outcomeTransfers),netData=netTransfersFromGross(people,gross),rows=[];for(i=0;i<people.length;i++)rows.push({person:people[i],finance:finances[people[i].id],overallNet:(netData.balances[people[i].id]||0)/100});return{rows:rows,purchaseTransfers:purchase,outcomeTransfers:outcomeTransfers,net:netData.net,note:outcome.note}}
function standardResultsHtml(){var ranked=aggregateStandard(),rows='';for(var i=0;i<ranked.length;i++){var r=ranked[i],detail=[];for(var j=0;j<state.settings.participants.length;j++){var p=state.settings.participants[j];detail.push(esc(p.name)+': '+intNum(payloadFor(p.id).modes[currentMode()][r.option.id],0))}rows+='<tr><td>'+(i+1)+'</td><td><strong>'+esc(r.option.name)+'</strong></td><td class="num">'+r.score+'</td><td>'+detail.join('；')+'</td></tr>'}return'<section class="card"><h3>选项总分排名</h3><div class="table-wrap"><table class="standard-table"><thead><tr><th>排名</th><th>选项</th><th class="num">总分</th><th>逐人票数</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'}
function participantSummaryHtml(data){var cards='';for(var i=0;i<data.rows.length;i++){var row=data.rows[i],label=row.overallNet>0?'最终应收':(row.overallNet<0?'最终应付':'无需转账');cards+='<article class="person-card"><h4>'+esc(row.person.name)+'</h4><div class="person-metrics"><div class="person-metric"><span class="label">已用积分</span><span class="value">'+row.finance.cost+'</span></div><div class="person-metric"><span class="label">额外购买积分</span><span class="value">'+row.finance.purchasedCredits+'</span></div><div class="person-metric"><span class="label">购买金额</span><span class="value">'+money(row.finance.purchaseAmount)+'</span></div><div class="person-metric"><span class="label">'+label+'</span><span class="value">'+money(Math.abs(row.overallNet))+'</span></div></div></article>'}return'<section class="card"><h3>参与者结算摘要</h3><div class="summary-grid">'+cards+'</div></section>'}
function paymentDagSvg(data){if(!data.net.length)return'';var payers=[],recipients=[],seenP={},seenR={},i;for(i=0;i<data.net.length;i++){var edge=data.net[i];if(!seenP[edge.payer.id]){seenP[edge.payer.id]=true;payers.push(edge.payer)}if(!seenR[edge.recipient.id]){seenR[edge.recipient.id]=true;recipients.push(edge.recipient)}}var rows=Math.max(payers.length,recipients.length),height=Math.max(190,rows*76+42),leftX=165,rightX=595,nodeW=170,nodeH=42;function positions(list){var out={},gap=height/(list.length+1);for(var x=0;x<list.length;x++)out[list[x].id]=Math.round(gap*(x+1));return out}var lp=positions(payers),rp=positions(recipients),svg='<div class="dag-wrap"><svg class="dag-svg" viewBox="0 0 760 '+height+'" role="img" aria-label="净额支付图"><defs><marker id="dagArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8aa0"></path></marker></defs>';for(i=0;i<data.net.length;i++){var e=data.net[i],y1=lp[e.payer.id],y2=rp[e.recipient.id],mx=380;svg+='<path class="dag-edge" marker-end="url(#dagArrow)" d="M '+(leftX+nodeW/2)+' '+y1+' C '+mx+' '+y1+', '+mx+' '+y2+', '+(rightX-nodeW/2)+' '+y2+'"></path><text class="dag-amount" x="'+mx+'" y="'+Math.round((y1+y2)/2-5)+'" text-anchor="middle">'+esc(money(e.amount))+'</text>'}for(i=0;i<payers.length;i++){var p=payers[i],py=lp[p.id];svg+='<rect class="dag-node-payer" x="'+(leftX-nodeW/2)+'" y="'+(py-nodeH/2)+'" width="'+nodeW+'" height="'+nodeH+'" rx="10"></rect><text class="dag-label" x="'+leftX+'" y="'+(py+5)+'" text-anchor="middle">'+esc(p.name)+'</text>'}for(i=0;i<recipients.length;i++){var r=recipients[i],ry=rp[r.id];svg+='<rect class="dag-node-recipient" x="'+(rightX-nodeW/2)+'" y="'+(ry-nodeH/2)+'" width="'+nodeW+'" height="'+nodeH+'" rx="10"></rect><text class="dag-label" x="'+rightX+'" y="'+(ry+5)+'" text-anchor="middle">'+esc(r.name)+'</text>'}return svg+'</svg></div>'}
function settlementResultsHtml(data){var cards='',purchase='',outcome='';for(var i=0;i<data.net.length;i++)cards+='<article class="transfer-card"><div class="transfer-route">'+esc(data.net[i].payer.name)+' → '+esc(data.net[i].recipient.name)+'</div><div class="transfer-amount">'+money(data.net[i].amount)+'</div></article>';for(i=0;i<data.purchaseTransfers.length;i++)purchase+='<li><span>'+esc(data.purchaseTransfers[i].payer.name)+' → '+esc(data.purchaseTransfers[i].recipient.name)+'</span><strong>'+money(data.purchaseTransfers[i].amount)+'</strong></li>';for(i=0;i<data.outcomeTransfers.length;i++)outcome+='<li><span>'+esc(data.outcomeTransfers[i].payer.name)+' → '+esc(data.outcomeTransfers[i].recipient.name)+'</span><strong>'+money(data.outcomeTransfers[i].amount)+'</strong></li>';return'<section class="card"><h3>最终净转账</h3><div class="notice">'+esc(data.note)+'</div>'+(cards?paymentDagSvg(data)+'<div class="transfer-grid">'+cards+'</div>':'<div class="notice success">无需执行转账。</div>')+(purchase?'<details style="margin-top:14px"><summary>积分购买款均分明细</summary><ul class="audit-list">'+purchase+'</ul></details>':'')+(outcome?'<details style="margin-top:14px"><summary>结果付款边明细</summary><ul class="audit-list">'+outcome+'</ul></details>':'')+'</section>'}
function renderVotingResults(){setNav(false,true,'结果已解锁');var summary=decisionSummary(),data=settlementData();els.view.innerHTML='<div class="panel-head"><div><h2>最终结果与结算</h2><p>'+esc(state.settings.topic)+'</p></div><button class="btn" id="lockResultsBtn" type="button">清除内存并重新锁定</button></div><div class="panel-body"><div class="result-stack"><section class="winner"><h3>'+esc(summary.title)+'</h3><p>'+esc(summary.text)+'</p></section>'+standardResultsHtml()+participantSummaryHtml(data)+settlementResultsHtml(data)+'</div></div>';document.getElementById('lockResultsBtn').addEventListener('click',function(){resultUnlocked=false;resultBallots=null;renderResultsGate()})}

function exportState(){flushActiveSession().then(function(){var payload={app:'quadratic-group-decision',exportedAt:new Date().toISOString(),security:'Each participant has a PBKDF2-SHA-256 password verifier and a separate AES-GCM ciphertext for auction bids; no plaintext PINs or bids are exported',state:state},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='group-decision-'+new Date().toISOString().replace(/:/g,'-').slice(0,19)+'.json';document.body.appendChild(link);link.click();link.parentNode.removeChild(link);setTimeout(function(){URL.revokeObjectURL(url)},0)})}
function importState(file){var reader=new FileReader();reader.onload=function(){try{var parsed=JSON.parse(reader.result),candidate=parsed&&parsed.state?parsed.state:parsed;if(!candidate||!candidate.settings)throw new Error('文件不是有效的完整状态 JSON。');normalizeState(candidate);clearSensitiveMemory();saveState();render();alert('加密状态已导入。所有参与者页面和结果页均保持锁定。')}catch(e){alert('导入失败：'+e.message)}els.importFile.value=''};reader.onerror=function(){alert('读取文件失败。');els.importFile.value=''};reader.readAsText(file)}
function showError(message){els.saveStatus.textContent=message}
function fatal(error){console.error(error);els.view.innerHTML='<div class="fatal"><strong>应用初始化失败</strong>\n\n'+esc(error&&error.stack?error.stack:(error&&error.message?error.message:String(error)))+'\n\n请使用当前版本的 Chrome、Edge、Firefox 或 Safari 重新打开本文件。</div>';els.prevBtn.disabled=true;els.nextBtn.disabled=true}
function bindGlobal(){els.prevBtn.addEventListener('click',function(){navigateTo(state.currentStep-1)});els.nextBtn.addEventListener('click',function(){navigateTo(state.currentStep+1)});els.exportBtn.addEventListener('click',exportState);els.importBtn.addEventListener('click',function(){els.importFile.click()});els.importFile.addEventListener('change',function(){if(this.files&&this.files[0])importState(this.files[0])});els.resetBtn.addEventListener('click',function(){if(!confirm('确定清空全部配置、密码、加密选票和独立密封报价吗？此操作不可撤销。'))return;localStorage.removeItem(STORAGE_KEY);localStorage.removeItem('quadratic-group-decision');state=defaultState();clearSensitiveMemory();saveState();render()})}
