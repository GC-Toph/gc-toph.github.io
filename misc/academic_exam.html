<script type="application/json" id="built-in-bank">{"schemaVersion":"1.0","exam":{"id":"glycolysis-metabolic-regulation-v2","title":"Glycolysis & Metabolic Regulation","subtitle":"Integrated Academic English and Biochemistry Assessment","discipline":"Human Biochemistry / Metabolism","targetAudience":"Upper-level undergraduates and beginning postgraduates","durationMinutes":30,"instructions":"Read both passages. Answer all 12 questions in English within 30 minutes. The 9 objective questions are marked automatically; the 3 short answers use analytic rubrics and require external LLM or manual grading. Bilingual passages, answers, and explanations are revealed after submission.","scoring":{"totalPoints":100,"englishPoints":40,"professionalPoints":60,"objectivePoints":60,"shortAnswerPoints":40},"coverageGoal":{"glycolysisPercent":70,"otherMetabolismPercent":30},"sourcePolicy":"Academically rewritten from two user-supplied teaching sources. Ambiguous or questionable claims were omitted rather than used as assessment facts.","sourceDescriptions":["Chinese transcription of a glycolysis instructional video, especially transport, phosphorylation, ATP balance and lactate regeneration.","Human-metabolism textbook extract, especially metabolic regulation, molecular polarity, redox chemistry, glycogen and triacylglycerol storage."],"readingWords":935,"instructionsZh":"阅读两篇英文材料，在30分钟内用英文完成12道题。9道客观题自动评分；3道简答题需按分项标准由外部LLM或人工评分。交卷后显示文章、答案和解析的中英对照。"},"passages":[{"id":"P1","title":"The Logic and Energetics of Glycolysis","topic":"glycolysis","paragraphs":["Glycolysis is a sequence of ten enzyme-catalysed reactions in which one molecule of glucose, a six-carbon sugar, is converted into two molecules of pyruvate, each containing three carbon atoms. The pathway produces some ATP directly and also transfers electrons to NAD+, generating NADH. Before glycolysis begins, glucose must enter the cell. Because glucose is polar, it cannot readily diffuse through the hydrophobic interior of the cell membrane. Glucose transporters, including members of the GLUT family, provide a route across this barrier. GLUT4, found in skeletal muscle and adipose tissue, is responsive to insulin, which promotes the availability of this transporter at the cell surface.","Inside the cell, hexokinase, or in certain tissues glucokinase, transfers a phosphate group from ATP to glucose, producing glucose 6-phosphate. This modification consumes one ATP and helps retain the sugar inside the cell, since the phosphorylated product is not carried out by ordinary glucose transporters. Glucose 6-phosphate is then changed into fructose 6-phosphate by an isomerase, an enzyme that rearranges a molecule without changing its overall chemical formula. No ATP is consumed in this rearrangement. Thus, glucose entry, chemical trapping, and molecular rearrangement should be distinguished as different processes.","Next, phosphofructokinase-1 (PFK-1) transfers a second ATP-derived phosphate to fructose 6-phosphate, yielding fructose 1,6-bisphosphate. This step strongly favours the forward direction under cellular conditions and is an important point of metabolic control. An enzyme acting at such a step can influence pathway flux, meaning the rate at which material moves through the sequence. By contrast, the preceding isomerisation is readily reversible. The difference shows why reactions with similar-looking substrates may have distinct regulatory roles.","Aldolase splits the six-carbon fructose 1,6-bisphosphate into two three-carbon compounds: dihydroxyacetone phosphate and glyceraldehyde 3-phosphate (G3P). Triose phosphate isomerase converts the first of these compounds into G3P, so two G3P molecules can continue through the later stages for every glucose molecule initially used. Consequently, each downstream reaction occurs twice per starting glucose. This duplication is essential when calculating the overall yield of energy-related products.","Glyceraldehyde 3-phosphate dehydrogenase then oxidises G3P while NAD+ accepts electrons and is reduced to NADH. Inorganic phosphate is incorporated during this reaction, generating 1,3-bisphosphoglycerate; the added phosphate does not come directly from ATP. Phosphoglycerate kinase subsequently transfers a phosphate from this intermediate to ADP, producing ATP and 3-phosphoglycerate. This is substrate-level phosphorylation: ATP is formed through a direct transfer of phosphate from a metabolic intermediate to ADP. Since two G3P molecules react, this stage produces two ATP molecules per original glucose.","After further rearrangement, phosphoenolpyruvate (PEP) is formed. Pyruvate kinase transfers its phosphate to ADP, producing pyruvate and another ATP for each three-carbon molecule. This final glycolytic step strongly favours the forward direction. Across the pathway, two ATP molecules are invested, four ATP molecules are produced, and the net gain is therefore two ATP per glucose. Glycolysis also yields two NADH and two pyruvate molecules. These figures describe the glycolytic pathway itself; they do not include any ATP that may later result from mitochondrial oxidation of NADH.","For the oxidation of G3P to continue, the cell requires an available supply of NAD+. When oxygen availability limits the reoxidation of NADH through other processes, lactate dehydrogenase can reduce pyruvate to lactate while regenerating NAD+. This reaction helps sustain glycolysis without producing an additional ATP molecule directly. Although oxygen is the final electron acceptor during complete aerobic oxidation, it is not a direct reactant in the glycolytic reactions described here. The key distinction is between obtaining ATP within glycolysis and maintaining the redox conditions that permit the pathway to proceed.","These mechanisms also suggest how to evaluate experimental results. Restricting glucose phosphorylation, PFK-1 activity, or NAD+ regeneration could reduce glycolytic output. However, a decrease in one downstream product alone would not identify which particular step had changed. A mechanistic conclusion requires evidence that distinguishes the proposed cause from alternative explanations."],"wordCount":639,"titleZh":"糖酵解的反应逻辑与能量收支","paragraphsZh":["糖酵解由十个酶催化反应组成，一分子葡萄糖（含六个碳原子的糖）最终转变为两分子丙酮酸，每分子丙酮酸含三个碳原子。该途径可直接产生一部分 ATP，还会将电子转移给 NAD+，生成 NADH。在糖酵解开始前，葡萄糖必须先进入细胞。由于葡萄糖具有极性，它难以直接穿过细胞膜内部的疏水区域。包括 GLUT 家族成员在内的葡萄糖转运蛋白为其跨越这一屏障提供了途径。骨骼肌与脂肪组织中的 GLUT4 可响应胰岛素；胰岛素促进这种转运蛋白出现在细胞表面。","葡萄糖进入细胞后，己糖激酶（或某些组织中的葡萄糖激酶）将 ATP 的一个磷酸基团转移给葡萄糖，形成葡萄糖-6-磷酸。这一修饰消耗一分子 ATP，并有助于将糖保留在细胞内，因为普通葡萄糖转运蛋白不会把磷酸化后的产物运出细胞。接着，异构酶将葡萄糖-6-磷酸转变为果糖-6-磷酸；所谓异构酶，是指能够在不改变分子总体化学式的情况下重排分子结构的酶。该重排过程不消耗 ATP。因此，应当区分葡萄糖进入细胞、通过化学修饰被保留，以及分子结构重排这三个不同过程。","随后，磷酸果糖激酶-1（PFK-1）将第二个来自 ATP 的磷酸基团转移给果糖-6-磷酸，生成果糖-1,6-二磷酸。在细胞条件下，该反应明显倾向于正向进行，是代谢调控的重要节点。催化这类反应的酶能够影响代谢途径通量，即物质沿反应序列流动的速率。相比之下，前一步异构化反应较容易逆向进行。这种差异说明，即使反应所涉及的底物看起来相似，其调控作用也可能不同。","醛缩酶将六碳的果糖-1,6-二磷酸裂解为两种三碳化合物：磷酸二羟丙酮和甘油醛-3-磷酸（G3P）。磷酸丙糖异构酶把前者转变成 G3P。因此，每消耗一分子起始葡萄糖，就有两分子 G3P 可以进入后续反应。相应地，每一个下游反应按每分子起始葡萄糖计算都发生两次。计算整个途径的能量相关产物总量时，必须考虑这一倍增关系。","随后，甘油醛-3-磷酸脱氢酶氧化 G3P，同时 NAD+ 接受电子并被还原为 NADH。这一反应还引入无机磷酸，生成 1,3-二磷酸甘油酸；新增磷酸并不是直接来自 ATP。接着，磷酸甘油酸激酶将该中间产物的一个磷酸基团转移给 ADP，生成 ATP 和 3-磷酸甘油酸。这称为底物水平磷酸化，即代谢中间产物直接把磷酸基团转移给 ADP，形成 ATP。由于有两分子 G3P 参加反应，以每分子起始葡萄糖计，这一阶段会产生两分子 ATP。","经过进一步结构重排后，途径生成磷酸烯醇式丙酮酸（PEP）。丙酮酸激酶将其磷酸基团转移给 ADP，使每个三碳分子生成丙酮酸和另一分子 ATP。糖酵解的最后一步也明显倾向于正向进行。纵观整个途径，前期投入两分子 ATP，后期总共产生四分子 ATP，因此每分子葡萄糖净获得两分子 ATP。糖酵解还生成两分子 NADH 和两分子丙酮酸。这些数字只描述糖酵解本身，并不计入 NADH 后续在线粒体内被氧化时可能产生的 ATP。","要让 G3P 的氧化持续进行，细胞必须有可用的 NAD+。当氧气供应限制了 NADH 通过其他过程重新氧化的能力时，乳酸脱氢酶可将丙酮酸还原成乳酸，同时再生 NAD+。这一反应有助于维持糖酵解，却不会直接额外产生 ATP。尽管氧气是完整有氧氧化过程中的最终电子受体，但在此描述的糖酵解反应中，氧气并非直接反应物。关键是区分：在糖酵解过程中直接获得 ATP，以及维持使该途径能够持续进行的氧化还原条件。","这些机制也提示我们如何评价实验结果。抑制葡萄糖磷酸化、PFK-1 活性或 NAD+ 再生，都可能降低糖酵解产出。然而，仅观察到某一种下游产物减少，并不能确定究竟是哪一步发生了变化。要得出机制性结论，必须有证据将提出的原因与其他可能解释区分开来。"]},{"id":"P2","title":"Metabolic Storage and Chemical Constraints","topic":"metabolism","paragraphs":["Human energy intake is intermittent, whereas energy expenditure continues between meals and can rise sharply during exercise. Metabolic regulation coordinates the storage, release, and use of fuel as demand changes. Its mechanisms include altered enzyme activity and signals from hormonal and nervous systems. Two principal fuel reserves are glycogen, a branched polymer of glucose units, and triacylglycerol, a lipid formed by attaching three fatty acids to glycerol.","The chemistry of these reserves helps explain their different roles. Sugars contain polar groups that interact with water, while much of a lipid molecule is non-polar. Cell membranes contain amphipathic phospholipids: their water-compatible heads face the surrounding fluid, and their hydrophobic tails form an inner barrier. This arrangement helps explain why glucose requires specific transport proteins to move across the membrane. It also means that lipid fuels need specialised transport arrangements in watery blood plasma.","Free glucose molecules would contribute many separate dissolved particles and create a substantial osmotic burden if accumulated in large amounts inside cells. Combining glucose units into glycogen greatly reduces the number of independent solute particles. Yet glycogen remains associated with considerable water, making it relatively heavy for the energy stored. Triacylglycerol, by contrast, forms non-polar droplets that exclude most water. Fatty acids are also relatively rich in energy-carrying electrons, so fat provides more energy per unit mass of stored material. Nonetheless, glycogen retains a distinct role as a source of glucose for metabolism.","Metabolic oxidation involves transfer of electrons from a fuel to an acceptor. Carriers such as NAD+ can receive electrons and become reduced, while oxygen is the final acceptor in complete aerobic oxidation. This broader context clarifies why the ATP produced directly by glycolysis should not be confused with the larger energy yield that may follow from further oxidation of its products."],"wordCount":296,"titleZh":"代谢储能与化学性质的限制","paragraphsZh":["人体的能量摄入是间歇性的，而餐间能量消耗仍会持续，并且在运动期间可能急剧上升。代谢调控会随着需求变化，协调燃料的储存、释放和利用。这些调控机制包括酶活性的变化，以及激素系统和神经系统发出的信号。两种主要的燃料储备是糖原和三酰甘油：糖原是由葡萄糖单元组成的支链聚合物；三酰甘油则是三个脂肪酸与甘油连接形成的脂质。","这些储备物质的化学性质有助于解释各自的作用。糖分子含有能够与水相互作用的极性基团，而脂质分子的大部分区域为非极性。细胞膜含有两亲性磷脂：其亲水的头部朝向周围液体，疏水的尾部则形成内部屏障。这种结构能够解释为什么葡萄糖跨膜运动需要专门的转运蛋白，也意味着脂质燃料在含水的血浆中运输时需要特殊的载运机制。","如果大量游离葡萄糖积聚在细胞内部，就会形成许多独立的溶质颗粒，造成显著的渗透负担。将多个葡萄糖单元连接为糖原则可大幅减少独立溶质颗粒的数量。但是，糖原仍然与大量水结合，因此相对于储存的能量而言，其质量较大。相比之下，三酰甘油形成非极性脂滴，排斥绝大部分水。脂肪酸还富含携带能量的电子，所以脂肪每单位储存质量所提供的能量更多。尽管如此，糖原仍具有独特作用：它是代谢所需葡萄糖的来源。","代谢氧化涉及电子从燃料向电子受体的转移。NAD+ 等载体能够接受电子而被还原，而在完整的有氧氧化过程中，氧气是最终电子受体。这一更广泛的背景说明，糖酵解直接产生的 ATP，不应与其产物进一步氧化后可能获得的更多能量相混淆。"]}],"questions":[{"id":"Q01","passageIds":["P1"],"topic":"glycolysis","competency":"english","type":"single_choice","prompt":"Which statement best restates why glucose transporters are needed?","points":7,"englishPoints":7,"professionalPoints":0,"answer":"B","explanation":{"en":"The membrane has a hydrophobic interior, so a polar sugar requires a transport protein.","zh":"细胞膜内部疏水，极性糖不能轻易直接穿过，因而需要葡萄糖转运蛋白。"},"evidence":"P1 ¶1","options":[{"id":"A","text":"They convert glucose into a non-polar lipid.","textZh":"转运蛋白把葡萄糖转变成非极性脂质。"},{"id":"B","text":"They help a water-compatible sugar cross a membrane barrier.","textZh":"转运蛋白帮助亲水性糖分子穿过细胞膜屏障。"},{"id":"C","text":"They produce ATP outside the cell.","textZh":"转运蛋白在细胞外产生 ATP。"},{"id":"D","text":"They replace the enzymes of glycolysis.","textZh":"转运蛋白代替糖酵解中的酶。"}],"promptZh":"以下哪项最准确地转述了葡萄糖需要转运蛋白的原因？","answerZh":"转运蛋白帮助亲水性的葡萄糖通过细胞膜屏障。"},{"id":"Q02","passageIds":["P1"],"topic":"glycolysis","competency":"english","type":"single_choice","prompt":"In paragraph 2, what does “This modification” refer to?","points":7,"englishPoints":7,"professionalPoints":0,"answer":"C","explanation":{"en":"The phrase refers to adding a phosphate group to glucose to produce glucose 6-phosphate.","zh":"该指代语指向给葡萄糖添加磷酸基团、形成葡萄糖-6-磷酸的过程。"},"evidence":"P1 ¶2","options":[{"id":"A","text":"The movement of glucose across the membrane.","textZh":"葡萄糖跨细胞膜移动。"},{"id":"B","text":"The rearrangement of fructose 6-phosphate.","textZh":"果糖-6-磷酸的结构重排。"},{"id":"C","text":"The phosphorylation of glucose.","textZh":"葡萄糖的磷酸化。"},{"id":"D","text":"The conversion of pyruvate to lactate.","textZh":"丙酮酸转变为乳酸。"}],"promptZh":"第2段中的“This modification”（这一修饰）指什么？","answerZh":"指葡萄糖的磷酸化，即生成葡萄糖-6-磷酸。"},{"id":"Q05","passageIds":["P1"],"topic":"glycolysis","competency":"english","type":"tfng","prompt":"The rearrangement of glucose 6-phosphate to fructose 6-phosphate requires an additional ATP molecule.","points":7,"englishPoints":7,"professionalPoints":0,"answer":"FALSE","explanation":{"en":"The text explicitly states that no ATP is consumed in this isomerisation; the claim asserts the opposite.","zh":"原文明言该异构化不消耗 ATP，因此题干“需要额外 ATP”与原文明确对立，选 False。"},"evidence":"P1 ¶2","promptZh":"葡萄糖-6-磷酸转变为果糖-6-磷酸的重排反应需要额外消耗一分子 ATP。","answerZh":"错误（FALSE）。原文明确说明该异构化反应不消耗 ATP。"},{"id":"Q06","passageIds":["P1"],"topic":"glycolysis","competency":"english","type":"tfng","prompt":"GLUT4 transports glucose faster in skeletal muscle than it does in adipose tissue.","points":7,"englishPoints":7,"professionalPoints":0,"answer":"NOT GIVEN","explanation":{"en":"The text identifies both tissues but gives no comparison of their glucose transport rates. It neither confirms nor denies the statement.","zh":"原文只指出 GLUT4 出现在骨骼肌及脂肪组织，没有比较两者转运速度；既不支持也不反驳该陈述，选 Not Given。"},"evidence":"P1 ¶1","promptZh":"GLUT4 在骨骼肌中转运葡萄糖的速度比在脂肪组织中更快。","answerZh":"未提及（NOT GIVEN）。原文未比较这两种组织中的转运速度。"},{"id":"Q07","passageIds":["P1"],"topic":"glycolysis","competency":"integrated","type":"gap_fill","prompt":"Complete the summary: After cleavage and isomerisation, ______ G3P molecules continue through the later reactions per starting glucose. Write ONE WORD OR ONE NUMBER.","points":7,"englishPoints":5,"professionalPoints":2,"answer":"two","explanation":{"en":"One six-carbon molecule gives two three-carbon units, both of which proceed as G3P. Accept “two” or “2”.","zh":"一个六碳分子产生两个三碳单位，最终两者都以 G3P 形式进入后半程；接受 two 或 2。"},"evidence":"P1 ¶4","acceptedAnswers":["two","2"],"maxWords":1,"promptZh":"完成摘要：经过裂解和异构化，每分子起始葡萄糖会有 ______ 分子 G3P 进入后续反应。限填一个单词或一个数字。","answerZh":"两分子（two / 2）。"},{"id":"Q08","passageIds":["P1"],"topic":"glycolysis","competency":"integrated","type":"single_choice","prompt":"What is the best interpretation of the claim that lactate formation helps sustain glycolysis?","points":7,"englishPoints":2,"professionalPoints":5,"answer":"B","explanation":{"en":"Converting pyruvate to lactate reoxidises NADH to NAD+, allowing the earlier NAD+-dependent G3P oxidation to continue; the lactate step adds no ATP directly.","zh":"丙酮酸还原为乳酸时可使 NADH 再氧化为 NAD+，支持此前依赖 NAD+ 的 G3P 氧化；乳酸生成反应本身不直接增加 ATP。"},"evidence":"P1 ¶5, ¶7","options":[{"id":"A","text":"Lactate formation is the source of all four glycolytic ATP molecules.","textZh":"乳酸形成提供糖酵解产生的全部四分子 ATP。"},{"id":"B","text":"It replenishes the oxidised electron carrier needed for an earlier reaction.","textZh":"这一过程再生早先某个反应所需的氧化型电子载体。"},{"id":"C","text":"It supplies oxygen directly to the glycolytic enzymes.","textZh":"这一过程直接为糖酵解酶提供氧气。"},{"id":"D","text":"It makes glucose transporters unnecessary.","textZh":"这一过程使葡萄糖转运蛋白变得不再需要。"}],"promptZh":"如何最恰当地理解“乳酸形成有助于维持糖酵解”这一论断？","answerZh":"乳酸生成可再生前面反应所需的氧化型电子载体 NAD+。"},{"id":"Q09","passageIds":["P1"],"topic":"glycolysis","competency":"professional","type":"single_choice","prompt":"If one glucose molecule is fully converted to two pyruvate molecules, what is the net ATP yield from glycolysis alone?","points":5,"englishPoints":0,"professionalPoints":5,"answer":"C","explanation":{"en":"Two ATP are consumed and four are produced, giving a net yield of two ATP. Later mitochondrial ATP generation is excluded.","zh":"糖酵解消耗 2 个 ATP、生成 4 个 ATP，因此净得 2 个 ATP；不包括后续线粒体过程。"},"evidence":"P1 ¶2, ¶3, ¶5–6","options":[{"id":"A","text":"Zero ATP.","textZh":"零分子 ATP。"},{"id":"B","text":"One ATP.","textZh":"一分子 ATP。"},{"id":"C","text":"Two ATP.","textZh":"两分子 ATP。"},{"id":"D","text":"Four ATP.","textZh":"四分子 ATP。"}],"promptZh":"一分子葡萄糖完全转变为两分子丙酮酸，仅计算糖酵解本身，ATP 净产量是多少？","answerZh":"净产量为两分子 ATP。"},{"id":"Q10","passageIds":["P1","P2"],"topic":"metabolism","competency":"professional","type":"tfng","prompt":"During G3P oxidation, the newly incorporated phosphate comes from inorganic phosphate rather than directly from ATP.","points":6,"englishPoints":0,"professionalPoints":6,"answer":"TRUE","explanation":{"en":"Paragraph 5 directly identifies inorganic phosphate as the source and contrasts it with ATP.","zh":"第一篇第5段直接指出引入的是无机磷酸而非来自 ATP 的磷酸，因此选 True。"},"evidence":"P1 ¶5","promptZh":"在 G3P 的氧化过程中，新引入的磷酸基团来自无机磷酸，而不是直接来自 ATP。","answerZh":"正确（TRUE）。文中明确指出引入的是无机磷酸。"},{"id":"Q12","passageIds":["P2"],"topic":"metabolism","competency":"professional","type":"single_choice","prompt":"Why does storing glucose units as glycogen instead of separate glucose molecules reduce osmotic stress?","points":7,"englishPoints":0,"professionalPoints":7,"answer":"A","explanation":{"en":"Linking many glucose units into fewer polymer particles reduces the number of independently dissolved particles.","zh":"将许多葡萄糖单元连接成较少的聚合物颗粒，减少独立溶质粒子数量，从而降低渗透负担。"},"evidence":"P2 ¶3","options":[{"id":"A","text":"Many units become part of far fewer dissolved particles.","textZh":"许多葡萄糖单元成为数量少得多的溶解颗粒。"},{"id":"B","text":"Glycogen is completely free of water.","textZh":"糖原完全不含水。"},{"id":"C","text":"Each glucose unit releases oxygen when polymerised.","textZh":"每个葡萄糖单元在聚合时都释放氧气。"},{"id":"D","text":"The cell membrane becomes permeable to all solutes.","textZh":"细胞膜因而可让所有溶质自由通过。"}],"promptZh":"为什么将葡萄糖单元储存为糖原，而不是多个独立葡萄糖分子，能够减轻渗透压力？","answerZh":"聚合后，大量葡萄糖单元成为数量少得多的独立溶质颗粒。"},{"id":"Q13","passageIds":["P1"],"topic":"glycolysis","competency":"professional","type":"short_answer","prompt":"Explain how glycolysis achieves a net ATP gain despite its early ATP investment. Identify both investment reactions, the two ATP-generating reactions, and the importance of the three-carbon split. Write approximately 50–75 words.","points":12,"englishPoints":0,"professionalPoints":12,"suggestedWords":{"min":50,"max":75},"answer":"See analytic rubric; equivalent correct explanations are acceptable.","modelAnswer":"Hexokinase (or glucokinase) and PFK-1 each consume one ATP before the six-carbon compound is divided. The split yields two G3P molecules, so each later ATP-forming reaction occurs twice per glucose. Phosphoglycerate kinase produces two ATP in total, and pyruvate kinase produces two more. Four ATP are formed against two invested, leaving a net gain of two ATP per glucose.","explanation":{"en":"A complete account separates the two ATP-consuming steps from the two ATP-generating reactions and applies the doubling rule after the split.","zh":"完整答案应区分前期两次 ATP 投入与后期两个产 ATP 步骤，并正确应用裂解后反应重复两次的规则。"},"evidence":"P1 ¶2–6","rubric":[{"id":"R13a","criterion":"ATP investment","description":{"en":"Identify glucose phosphorylation by hexokinase/glucokinase (1 ATP) and the PFK-1 reaction (1 ATP); 1.5 points each.","zh":"指出己糖激酶/葡萄糖激酶步骤与 PFK-1 步骤各消耗 1 ATP，每项 1.5 分。"},"maxPoints":3,"dimension":"professional"},{"id":"R13b","criterion":"ATP-producing reactions","description":{"en":"Identify phosphoglycerate kinase and pyruvate kinase as the ATP-generating reactions; 1.5 points each.","zh":"指出磷酸甘油酸激酶与丙酮酸激酶产 ATP，每项 1.5 分。"},"maxPoints":3,"dimension":"professional"},{"id":"R13c","criterion":"Twofold payoff","description":{"en":"Explain that two G3P molecules mean each downstream ATP-generating step occurs twice per glucose.","zh":"解释每分子葡萄糖产生两个 G3P，因此两个产 ATP 步骤各发生两次。"},"maxPoints":3,"dimension":"professional"},{"id":"R13d","criterion":"Net yield","description":{"en":"State 4 ATP produced minus 2 consumed equals 2 ATP net per glucose; give 1 point for each correct quantity/calculation element (4, 2, net 2).","zh":"陈述产 4、耗 2、净得 2 ATP；三个数量/计算要素各 1 分。"},"maxPoints":3,"dimension":"professional"}],"promptZh":"解释糖酵解为何尽管在早期消耗 ATP，最终仍能实现 ATP 净收益。请指出两个消耗 ATP 的步骤、两个产生 ATP 的反应，并说明三碳分子裂解的重要性。英文约 50–75 词。","answerZh":"参照下方双语示范答案及分项评分标准；科学上等价的正确表述也可得分。","modelAnswerZh":"己糖激酶（或葡萄糖激酶）和 PFK-1 催化的反应各消耗一分子 ATP，随后六碳化合物被裂解。裂解后形成两分子 G3P，因此每分子起始葡萄糖的后续产 ATP 反应各发生两次。磷酸甘油酸激酶步骤总共产生两分子 ATP，丙酮酸激酶步骤再产生两分子。合计产生四分子，扣除投入的两分子，净获得两分子 ATP。"},{"id":"Q14","passageIds":["P1"],"topic":"glycolysis","competency":"integrated","type":"short_answer","prompt":"A cell is treated with a selective inhibitor of PFK-1. Predict the effect on glycolytic flux and pyruvate formation, assuming other conditions remain constant. Would a decrease in measured lactate alone establish that PFK-1 was the specific target? Explain cautiously in approximately 55–80 words.","points":14,"englishPoints":5,"professionalPoints":9,"suggestedWords":{"min":55,"max":80},"answer":"See analytic rubric; equivalent correct explanations are acceptable.","modelAnswer":"PFK-1 normally catalyses an important forward-directed, regulated step that forms fructose 1,6-bisphosphate. Inhibiting it would be expected to reduce the flow of carbon through later glycolysis and thus decrease pyruvate formation, other conditions being equal. A fall in lactate alone would not establish target specificity, because changes in substrate delivery, other glycolytic reactions, or NAD+ regeneration could also affect lactate output. Direct evidence on PFK-1 activity would strengthen the inference.","explanation":{"en":"Credit a conditional mechanistic prediction and an explicit distinction between an observed downstream change and evidence identifying its cause. The English component rewards clear, appropriately hedged academic reasoning.","zh":"专业部分重在有条件的机制预测、以及区分“下游产物变化”和“特异性靶点证据”；英语部分评价清晰、谨慎、符合学术语域的论证。"},"evidence":"P1 ¶3, ¶7–8","rubric":[{"id":"R14a","criterion":"Mechanistic target","description":{"en":"Identify that PFK-1 catalyses the regulated fructose 6-phosphate → fructose 1,6-bisphosphate step.","zh":"指出 PFK-1 催化果糖-6-磷酸至果糖-1,6-二磷酸的受调控步骤。"},"maxPoints":3,"dimension":"professional"},{"id":"R14b","criterion":"Conditional prediction","description":{"en":"Predict decreased downstream glycolytic flux and pyruvate formation, with the stated other-conditions-equal assumption.","zh":"在其他条件不变的前提下，预测下游糖酵解通量和丙酮酸生成下降。"},"maxPoints":3,"dimension":"professional"},{"id":"R14c","criterion":"Evidence limitation","description":{"en":"Explain why lactate reduction alone lacks specificity; provide at least one plausible alternative and suggest a more direct PFK-1 assay/measurement.","zh":"说明单独乳酸下降不足以确定靶点，提供至少一个可行替代原因并建议直接测定 PFK-1 活性/靶向证据。"},"maxPoints":3,"dimension":"professional"},{"id":"R14d","criterion":"Clarity and terminology","description":{"en":"Use unambiguous English sentences and appropriate scientific terms; award 0–2.","zh":"英语表达清晰、专业术语恰当；0–2 分。"},"maxPoints":2,"dimension":"english"},{"id":"R14e","criterion":"Qualified academic reasoning","description":{"en":"Use justified uncertainty (e.g., “would be expected”, “alone cannot establish”) and coherent evidence-to-conclusion logic; award 0–3.","zh":"采用有根据的谨慎措辞并形成证据—结论逻辑；0–3 分。"},"maxPoints":3,"dimension":"english"}],"promptZh":"使用选择性 PFK-1 抑制剂处理细胞。在其他条件保持不变的前提下，预测糖酵解通量与丙酮酸生成的变化。仅观察到乳酸下降，能否证明 PFK-1 是特异性靶点？请谨慎解释。英文约 55–80 词。","answerZh":"参照下方双语示范答案及分项评分标准；应说明条件和证据局限。","modelAnswerZh":"PFK-1 催化果糖-6-磷酸生成果糖-1,6-二磷酸，这是糖酵解中受到重要调控、倾向于正向进行的步骤。如果其他条件相同，抑制该酶预计会减少碳流向下游糖酵解反应的通量，并降低丙酮酸生成。仅凭乳酸下降不能确定该抑制剂具有靶点特异性，因为底物供应、其他糖酵解步骤或 NAD+ 再生的变化也可能影响乳酸生成。直接测量 PFK-1 活性等证据有助于加强推断。"},{"id":"Q15","passageIds":["P1","P2"],"topic":"metabolism","competency":"professional","type":"short_answer","prompt":"A proposed energy reserve would store a large quantity of free glucose inside cells rather than glycogen or triacylglycerol. Evaluate this proposal using osmotic effects, water association, and fuel efficiency. Explain one connection to the need for glucose in glycolysis. Write approximately 65–90 words.","points":14,"englishPoints":0,"professionalPoints":14,"suggestedWords":{"min":65,"max":90},"answer":"See analytic rubric; equivalent correct explanations are acceptable.","modelAnswer":"Large quantities of free glucose would create many dissolved particles and increase the osmotic burden on cells. Glycogen reduces this problem by linking glucose units into a polymer, although its associated water lowers energy stored per unit mass. Triacylglycerol excludes most water and contains more energy-rich electrons, so it is more efficient for long-term storage by mass. Nonetheless, glucose remains important because glycolysis begins with glucose, which must be transported into cells or made available from carbohydrate stores.","explanation":{"en":"The comparison requires trade-offs rather than declaring a single fuel universally superior: free glucose is osmotically costly, glycogen is carbohydrate storage, and triacylglycerol is mass-efficient long-term storage.","zh":"应比较不同储能方式的代价，而非断言一种燃料在所有情况下都最好：游离葡萄糖渗透负担大；糖原储存碳水化合物；三酰甘油长期储能质量效率高。"},"evidence":"P1 ¶1; P2 ¶1–3","rubric":[{"id":"R15a","criterion":"Free glucose and osmosis","description":{"en":"State that many free glucose molecules increase independent solute particles and osmotic stress; link to water movement or swelling.","zh":"指出大量游离葡萄糖增加独立溶质粒子及渗透压力，并联系水移动或细胞膨胀。"},"maxPoints":4,"dimension":"professional"},{"id":"R15b","criterion":"Glycogen advantage","description":{"en":"Explain why polymerising glucose into glycogen reduces the osmotic particle count.","zh":"解释将葡萄糖聚合成糖原如何减少独立渗透粒子。"},"maxPoints":3,"dimension":"professional"},{"id":"R15c","criterion":"Storage mass trade-off","description":{"en":"Explain both glycogen hydration and triacylglycerol water exclusion/greater energy per stored mass; 1.5 points each.","zh":"说明糖原结合水、三酰甘油排水且单位储存质量能量较高；两部分各 1.5 分。"},"maxPoints":3,"dimension":"professional"},{"id":"R15d","criterion":"Balanced cross-text application","description":{"en":"Connect access to glucose with the beginning of glycolysis and distinguish this functional need from efficient long-term fat storage.","zh":"把葡萄糖获取与糖酵解起点相联系，并区分该功能需求与脂肪的高密度长期储能作用。"},"maxPoints":4,"dimension":"professional"}],"promptZh":"有人提议在细胞内储存大量游离葡萄糖，以替代糖原或三酰甘油。请从渗透效应、结合水和储能效率评价该提议，并说明它与糖酵解需要葡萄糖之间的一项联系。英文约 65–90 词。","answerZh":"参照下方双语示范答案及分项评分标准；应作跨文本权衡评价。","modelAnswerZh":"在细胞内大量储存游离葡萄糖会增加独立溶质颗粒数量，从而提高渗透负担。把葡萄糖聚合成糖原可减轻这一问题，但糖原含有较多结合水，降低每单位储存质量的能量密度。三酰甘油可排除大部分水，而且含有更多富能电子，因此更适合按质量计的高效长期储能。不过，糖酵解以葡萄糖为起始底物，因此储存碳水化合物以供需要时提供葡萄糖，仍具有不同于长期脂肪储存的生理价值。"}]}</script>
<script>
(()=>{'use strict';
const BANKS_KEY='scholarassess_banks_v1',ATTEMPTS_KEY='scholarassess_attempts_v1',SELECTED_KEY='scholarassess_selected_v1';
const BUILTIN=JSON.parse(document.getElementById('built-in-bank').textContent);
const app=document.getElementById('app');
let storedOK=true;
function readStorage(k,fallback){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fallback}catch(e){storedOK=false;return fallback}}
function saveStorage(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){storedOK=false;showToast('本地保存失败：可能是浏览器禁用了文件页面存储，建议及时导出答卷。');return false}}
let banks=readStorage(BANKS_KEY,[]);if(!Array.isArray(banks))banks=[];banks=banks.filter(x=>x&&x.exam&&x.questions&&x.passages&&x.exam.id!==BUILTIN.exam.id);
let attempts=readStorage(ATTEMPTS_KEY,{});if(!attempts||typeof attempts!=='object'||Array.isArray(attempts))attempts={};
let selected=readStorage(SELECTED_KEY,BUILTIN.exam.id);let currentScreen='home',activePassage='P1',lastFocusedQuestion=null;
const bankById=id=>id===BUILTIN.exam.id?BUILTIN:banks.find(b=>b.exam.id===id);
if(!bankById(selected))selected=BUILTIN.exam.id;
const bank=()=>bankById(selected),attempt=()=>attempts[selected];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function countWords(text){return(String(text??'').trim().match(/[^\s]+/g)||[]).length}
function readingWords(b){return b.passages.reduce((a,p)=>a+p.paragraphs.join(' ').trim().split(/\s+/).filter(Boolean).length,0)}
function safeId(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,'_')}
function fmtDate(ms){return ms?new Date(ms).toLocaleString('zh-CN',{hour12:false}):'—'}
function showToast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(showToast._timer);showToast._timer=setTimeout(()=>t.classList.remove('show'),3500)}
function currentStatus(){const a=attempt();return !a?'未开始':a.submittedAt?'已交卷':'进行中'}
function header(extra=''){return `<header class="topbar"><div class="topinner"><div class="brandmark">S<span style="color:#6ed0bf">·</span></div><div><div class="brandname">ScholarAssess</div><div class="brandsub">离线学术测试工具</div></div><div class="topright">${extra}</div></div></header>`}
function setSelected(id){if(!bankById(id))return;selected=id;saveStorage(SELECTED_KEY,id);renderHome()}
function questionPoints(q){return `${q.points} pts <span class="muted">· E ${q.englishPoints} / P ${q.professionalPoints}</span>`}
function objective(q){return q.type!=='short_answer'}
function isAnswered(q,v){return v!==undefined&&v!==null&&String(v).trim()!==''}
function normalise(v){return String(v??'').normalize('NFKC').toLowerCase().trim().replace(/\s+/g,' ').replace(/\s*\+\s*/g,'+')}
function isCorrect(q,v){if(!isAnswered(q,v))return false;if(q.type==='gap_fill'){if(countWords(v)>q.maxWords)return false;return(q.acceptedAnswers||[q.answer]).some(x=>normalise(x)===normalise(v))}return normalise(q.answer)===normalise(v)}
function objectiveScore(b,a){const result={total:0,max:0,english:0,professional:0,correct:0,objectives:0};for(const q of b.questions.filter(objective)){result.max+=q.points;result.objectives++;if(isCorrect(q,a.answers?.[q.id])){result.total+=q.points;result.english+=q.englishPoints;result.professional+=q.professionalPoints;result.correct++}}return result}
function shortGrades(b,a){let e=0,p=0,graded=0,waiting=0;for(const q of b.questions.filter(x=>!objective(x))){const g=a.llmGrades?.[q.id];if(!g){waiting+=q.points;continue}graded++;for(const r of q.rubric){const val=Number(g.rubricScores?.[r.id]||0);if(r.dimension==='english')e+=val;else p+=val}}return{english:e,professional:p,total:e+p,graded,waiting}}
function ensureAttempt(){const a=attempt();if(a&&!a.submittedAt&&Date.now()>=a.deadlineAt)finishExam('timeout',false)}
function persist(){saveStorage(ATTEMPTS_KEY,attempts)}
function newAttempt(){let b=bank();const now=Date.now();attempts[selected]={examId:selected,startedAt:now,deadlineAt:now+b.exam.durationMinutes*60000,answers:{},flags:{},submittedAt:null,submitReason:null,llmGrades:{}};persist();activePassage=b.passages[0].id;renderExam()}
function resumeOrStart(){const a=attempt();if(a&&!a.submittedAt){ensureAttempt();if(attempt()?.submittedAt)renderResults();else renderExam();return}if(a&&a.submittedAt){if(!confirm('这套题已经提交。重新开始会清除该题库当前答卷与外部评分，确定重新考试吗？'))return}newAttempt()}
function finishExam(reason='manual',go=true){const a=attempt();if(!a||a.submittedAt)return;const now=Date.now();a.submittedAt=reason==='timeout'?Math.min(now,a.deadlineAt):now;a.submitReason=reason;persist();if(go)renderResults()}
function submit(){const a=attempt();if(!a||a.submittedAt)return;ensureAttempt();if(attempt().submittedAt){renderResults();return}const b=bank(),missing=b.questions.filter(q=>!isAnswered(q,a.answers[q.id]));const msg=missing.length?`有 ${missing.length} 道题尚未作答。交卷后无法修改，确定提交？`:'确定提前交卷？提交后不能修改答案。';if(confirm(msg))finishExam('manual')}
function setBank(b){const exists=bankById(b.exam.id);if(exists){if(!confirm('已有相同 ID 的题库。覆盖将清除其当前答卷，确定覆盖吗？'))return;delete attempts[b.exam.id];banks=banks.filter(x=>x.exam.id!==b.exam.id)}banks.push(b);saveStorage(BANKS_KEY,banks);persist();setSelected(b.exam.id);showToast(`已导入：${b.exam.title}（${b.questions.length} 题）`)}
function validateBank(b){const fail=m=>{throw new Error(m)};if(!b||typeof b!=='object'||b.schemaVersion!=='1.0')fail('schemaVersion 必须为 1.0');if(!b.exam||typeof b.exam.id!=='string'||!b.exam.id||!b.exam.title)fail('exam.id 或 exam.title 缺失');if(!Number.isInteger(b.exam.durationMinutes)||b.exam.durationMinutes<1||b.exam.durationMinutes>240)fail('考试时长须为 1–240 分钟整数');if(!Array.isArray(b.passages)||b.passages.length<1)fail('至少需要一篇阅读');const pids=new Set();for(const p of b.passages){if(!p.id||pids.has(p.id)||!p.title||!Array.isArray(p.paragraphs)||!p.paragraphs.length||p.paragraphs.some(x=>typeof x!=='string'))fail('阅读段落格式错误或阅读 ID 重复');if(p.paragraphsZh&&(!Array.isArray(p.paragraphsZh)||p.paragraphsZh.length!==p.paragraphs.length||p.paragraphsZh.some(x=>typeof x!=='string')))fail(`${p.id} 中文段落必须与英文段落一一对应`);pids.add(p.id)}if(!Array.isArray(b.questions)||!b.questions.length||b.questions.length>100)fail('题目数量须为 1–100');const qids=new Set();let points=0,english=0,professional=0,auto=0,short=0;for(const q of b.questions){if(!q.id||qids.has(q.id)||typeof q.prompt!=='string'||!q.prompt||!['single_choice','tfng','gap_fill','short_answer'].includes(q.type))fail(`题目 ID 或类型不正确：${q.id||'未知'}`);qids.add(q.id);if(!Array.isArray(q.passageIds)||!q.passageIds.length||q.passageIds.some(id=>!pids.has(id)))fail(`${q.id} 关联阅读 ID 错误`);for(const v of ['points','englishPoints','professionalPoints'])if(typeof q[v]!=='number'||!Number.isFinite(q[v])||q[v]<0)fail(`${q.id} 的分值应为非负数`);if(q.points<=0||Math.abs(q.points-q.englishPoints-q.professionalPoints)>1e-7)fail(`${q.id} 分值之和不一致`);if(!q.explanation||typeof q.explanation.en!=='string'||typeof q.explanation.zh!=='string')fail(`${q.id} 缺少双语解析`);if(q.promptZh!==undefined&&typeof q.promptZh!=='string')fail(`${q.id} promptZh 应为中文字符串`);if(q.type==='single_choice'){if(!Array.isArray(q.options)||q.options.length<2||q.options.some(o=>!o.id||typeof o.text!=='string')||!q.options.some(o=>o.id===q.answer))fail(`${q.id} 单选选项/答案错误`)}if(q.type==='tfng'&&!['TRUE','FALSE','NOT GIVEN'].includes(q.answer))fail(`${q.id} TFNG 答案错误`);if(q.type==='gap_fill'){if(!Number.isInteger(q.maxWords)||q.maxWords<1||!Array.isArray(q.acceptedAnswers)||!q.acceptedAnswers.length||q.acceptedAnswers.some(x=>typeof x!=='string'||!x.trim()||countWords(x)>q.maxWords))fail(`${q.id} 填空必须设置 maxWords 和 acceptedAnswers`)}if(q.type==='short_answer'){if(!Array.isArray(q.rubric)||!q.rubric.length||typeof q.modelAnswer!=='string')fail(`${q.id} 缺少主观评分细则/参考答案`);let rp=0,re=0,rr=0;const rids=new Set();for(const r of q.rubric){if(!r.id||rids.has(r.id)||!['english','professional'].includes(r.dimension)||!Number.isFinite(r.maxPoints)||r.maxPoints<=0||!r.description||typeof r.description.en!=='string'||typeof r.description.zh!=='string')fail(`${q.id} rubric 格式错误`);rids.add(r.id);rp+=r.maxPoints;if(r.dimension==='english')re+=r.maxPoints;else rr+=r.maxPoints}if(Math.abs(rp-q.points)>1e-7||Math.abs(re-q.englishPoints)>1e-7||Math.abs(rr-q.professionalPoints)>1e-7)fail(`${q.id} 评分细则与题目分值不符`);short+=q.points}else auto+=q.points;points+=q.points;english+=q.englishPoints;professional+=q.professionalPoints}const score=b.exam.scoring;if(!score||Math.abs(score.totalPoints-points)>1e-7||Math.abs(score.englishPoints-english)>1e-7||Math.abs(score.professionalPoints-professional)>1e-7||Math.abs(score.objectivePoints-auto)>1e-7||Math.abs(score.shortAnswerPoints-short)>1e-7)fail('exam.scoring 与逐题分值不一致');return true}
async function importFile(file){if(!file)return;if(!file.name.toLowerCase().endsWith('.json')){showToast('请选择 .json 文件。');return}try{const text=await file.text(),b=JSON.parse(text);validateBank(b);setBank(b)}catch(e){showToast('导入失败：'+e.message)}}
function exportFile(data,name,type='application/json'){const blob=new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function copyText(s){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);showToast('已复制到剪贴板');return}const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.top='-9999px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(ok){showToast('已复制到剪贴板');return}throw Error('Copy blocked')}catch(e){showToast('浏览器未允许复制。可在文本框中全选复制，或使用导出文件。')}}
function promptForLLM(){return `你是一名「学术英语 + 学科专业」命题专家。请根据我提供的新素材生成一份符合要求的 UTF-8 纯 JSON 题库。不要输出 Markdown 围栏或其他解释。

【考试设计】
- 30 分钟，12 道题：9 道客观题 + 3 道英文简答题；两篇学术化英文阅读，共 800–1000 个英文词，阅读长度应适合限时作答。
- 总分 100，英语能力 40 分、学科能力 60 分；客观题合计 60 分，简答合计 40 分。每道题包含 points、englishPoints 和 professionalPoints，并保证三个汇总准确相等。简答 rubric 各项分数的维度汇总也必须一致。
- 英语题考释义、指代、论证逻辑、证据定位、概括；专业题考概念、机制、方法评价、适用条件、实践应用及跨文本比较。
- 删去素材中的口头语、记忆技巧、重复、玩笑和无依据数据；保留定义、因果推理、比较、条件和局限。遇到不确定或疑似错误的专业内容，跳过该点，不要编造或擅自补全。
- 每篇英文正文用学术英语重写，首次出现的高难术语提供上下文线索。图表如有使用，需转成可在正文定位的文字描述。
- 所有题干、选项、参考答案为英文；同时必须提供忠实的素材内容。不得将原始素材全文直接搬运到 passages 中。

【强制双语字段】
1. passages 每篇提供 title（英文）和 titleZh（中文），paragraphs 为英文段落数组，paragraphsZh 为逐段对应的中文翻译，数组长度和段落顺序必须严格一致。注意：双语「原文」指供考生阅读的学术化阅读文章及其中文译文，不是素材的整份原始转录。
2. questions 每题必须有英文 prompt、中文 promptZh；客观题必须有标准答案字段 answer 与中文答案解释 answerZh；所有题都有 explanation:{en,zh}、evidence（例如 P1 ¶2）。
3. 单选每个选项提供 text（英文）和 textZh（中文），唯一正确；TFNG 的 FALSE 必须与原文直接相反，NOT GIVEN 是原文无支持亦无反证；填空题提供 maxWords（字数上限）及 acceptedAnswers（可接受英文答案），答案不得超字数。
4. 简答题必须额外提供 modelAnswer（英文参考答案）、modelAnswerZh（中文译文）、answerZh（中文要点）、suggestedWords:{min,max} 和 rubric 数组。rubric 的每项包含 id、criterion、description:{en,zh}、maxPoints、dimension (english 或 professional)。同义且科学上等价的回答可按条目评分。
5. 逐题明示分值；100 分总分、40/60 维度、60/40 客观主观必须精确一致。所有 ID 唯一；题目 passageIds 要对应已定义文章。

【JSON schemaVersion=1.0 必须兼容的结构】
{
 "schemaVersion":"1.0",
 "exam":{"id":"new-unique-id","title":"English exam title","subtitle":"...","discipline":"...","durationMinutes":30,"instructions":"Answer all questions in English.","scoring":{"totalPoints":100,"englishPoints":40,"professionalPoints":60,"objectivePoints":60,"shortAnswerPoints":40}},
 "passages":[{"id":"P1","title":"English heading","titleZh":"中文标题","topic":"...","paragraphs":["English paragraph 1", "English paragraph 2"],"paragraphsZh":["中文第1段","中文第2段"]}],
 "questions":[{"id":"Q01","passageIds":["P1"],"topic":"...","competency":"english","type":"single_choice","prompt":"Question in English?","promptZh":"中文题干？","points":7,"englishPoints":7,"professionalPoints":0,"options":[{"id":"A","text":"English option","textZh":"中文选项"},{"id":"B","text":"Other option","textZh":"其他选项"}],"answer":"A","answerZh":"中文正确答案说明","evidence":"P1 ¶1","explanation":{"en":"Reason in English","zh":"中文解析"}}]
}
可选题型仅 single_choice、tfng、gap_fill、short_answer；tfng 使用 TRUE/FALSE/NOT GIVEN，gap_fill 使用 maxWords 和 acceptedAnswers；short_answer 使用 modelAnswer、modelAnswerZh、suggestedWords 和 rubric。上方 JSON 只是字段示范，不代表完整题量：实际输出必须包含两篇文章、12题及三道简答题，并完成所有校验。

【请在此粘贴素材】
`;}
function renderHome(){currentScreen='home';const b=bank(),a=attempt(),objs=b.questions.filter(objective).length,shorts=b.questions.length-objs;app.innerHTML=header(`<span class="chip blue">本地离线</span>`)+`<main class="container"><section class="surface compact-home"><div class="sectionhead" style="margin:0"><div><h1>学术测试</h1><p class="muted small">选择题库、限时作答、查看解析，或导入其他学科的 JSON 题库。</p></div><span class="chip ${a?.submittedAt?'green':a?'amber':'blue'}">${esc(currentStatus())}</span></div><div class="compact-stats"><span><strong>${esc(b.exam.durationMinutes)} 分钟</strong></span><span>${b.questions.length} 题（${objs} 客观 + ${shorts} 简答）</span><span>${readingWords(b)} 英文词</span><span>英语 ${b.exam.scoring.englishPoints} / 学科 ${b.exam.scoring.professionalPoints} 分</span></div></section><div style="height:15px"></div><div class="grid2"><div class="stack"><section class="surface"><div class="sectionhead"><h2 class="card-title">当前考试</h2></div><h3>${esc(b.exam.title)}</h3><p class="small muted" style="margin:7px 0 12px">${esc(b.exam.subtitle||b.exam.discipline||'')}</p><div class="buttonrow"><button class="btn primary" id="start">${a&&!a.submittedAt?'继续作答':a?.submittedAt?'重新考试':`开始 ${b.exam.durationMinutes} 分钟考试`}</button>${a?.submittedAt?'<button class="btn" id="viewresult">查看成绩与双语解析</button>':''}</div>${a&&!a.submittedAt?`<p class="small muted" style="margin-top:10px">开始时间：${fmtDate(a.startedAt)}；离开页面不会暂停倒计时。</p>`:''}<div class="buttonrow" style="margin-top:13px"><button class="btn minor ghost" id="downloadbank">下载当前题库 JSON</button><button class="btn minor ghost" id="copybank">复制当前题库 JSON</button></div></section><section class="surface"><h2 class="card-title">题库管理</h2><div class="banklist" id="banklist"></div><div class="rule"></div><div class="filedrop" id="dropzone" role="button" tabindex="0" aria-label="选择 JSON 题库文件"><strong>点击选择或拖入 JSON 文件</strong><p class="small muted">支持其他学科；导入时检查题型、答案、分值和 Rubric。</p></div><input type="file" id="importfile" accept=".json,application/json" class="hide"></section></div><div class="stack"><section class="surface"><div class="sectionhead"><h2 class="card-title">生成新题库的提示词</h2><span class="chip">可复制</span></div><p class="small muted">将提示词复制给 LLM，再附上新素材。模板要求中文译文、双语答案和评分细则，不限制学科。</p><textarea class="promptbox" id="promptbox" readonly aria-label="供 LLM 生成题库的 JSON 提示词">${esc(promptForLLM())}</textarea><div class="buttonrow" style="margin-top:12px"><button class="btn dark" id="copyprompt">一键复制命题提示词</button><button class="btn minor" id="downloadprompt">下载提示词</button></div></section><section class="surface"><h2 class="card-title">使用说明</h2><p class="small muted">客观题交卷后自动判分；简答题可复制答卷与中英双语参考材料，由外部 LLM 按 Rubric 评分。成绩和作答进度保存在当前浏览器本地。</p><p class="note-compact">考试中已拦截 Ctrl/⌘+F、Ctrl/⌘+G 与 F3 页面查找快捷键；复制与粘贴保持可用。浏览器菜单发起的原生查找无法由网页完全禁止。本工具不属于服务器端防作弊系统。</p></section></div></div></main>`;
const list=document.getElementById('banklist');[BUILTIN,...banks].forEach((bk,index)=>{const it=document.createElement('button');it.className='bankrow'+(bk.exam.id===selected?' selected':'');it.innerHTML=`<span class="round">${index+1}</span><span class="banktext"><strong>${esc(bk.exam.title)}</strong><small>${esc(bk.exam.discipline||bk.exam.subtitle||'')} · ${bk.questions.length} questions</small></span><span class="chip ${bk.exam.id===selected?'blue':''}">${bk.exam.id===BUILTIN.exam.id?'内置':'已导入'}</span>`;it.onclick=()=>setSelected(bk.exam.id);list.append(it)});
const input=document.getElementById('importfile');input.onchange=async()=>{await importFile(input.files?.[0]);input.value=''};const drop=document.getElementById('dropzone');drop.onclick=()=>input.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}};drop.ondragover=e=>{e.preventDefault();drop.classList.add('dragging')};drop.ondragleave=()=>drop.classList.remove('dragging');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('dragging');importFile(e.dataTransfer?.files?.[0])};document.getElementById('start').onclick=resumeOrStart;if(document.getElementById('viewresult'))document.getElementById('viewresult').onclick=renderResults;document.getElementById('downloadbank').onclick=()=>exportFile(b,`${safeId(b.exam.id)}.json`);document.getElementById('copybank').onclick=()=>copyText(JSON.stringify(b,null,2));document.getElementById('copyprompt').onclick=()=>copyText(promptForLLM());document.getElementById('downloadprompt').onclick=()=>exportFile(promptForLLM(),'scholarassess_llm_json_prompt.txt','text/plain')}
function remainingText(a){const remaining=Math.max(0,Math.ceil((a.deadlineAt-Date.now())/1000));return `${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`}
function timeClass(a){const sec=(a.deadlineAt-Date.now())/1000;return sec<=60?'danger':sec<=300?'alert':''}
function renderExam(){ensureAttempt();const a=attempt();if(!a){renderHome();return}if(a.submittedAt){renderResults();return}currentScreen='exam';const b=bank();if(!b.passages.some(p=>p.id===activePassage))activePassage=b.passages[0].id;app.innerHTML=header(`<span class="chip green">自动保存中</span><div class="timer ${timeClass(a)}" id="timer" aria-live="off">${remainingText(a)}</div><button class="btn minor" id="backhome">题库首页</button><button class="btn primary minor" id="submitexam">提前交卷</button>`)+`<main class="examview"><section class="exampanel"><div class="panelhead"><div class="sectionhead" style="margin:0"><div><div class="eyebrow">READING MATERIAL</div><h2>Academic Passages</h2></div><span class="chip">${readingWords(b)} words</span></div><div class="passagetabs" id="passagetabs"></div></div><div class="panelbody reader" id="reader"></div></section><section class="exampanel"><div class="panelhead"><div class="sectionhead" style="margin:0"><div><div class="eyebrow">ASSESSMENT</div><h2>Questions <span class="muted" style="font-weight:500">· ${b.questions.length}</span></h2></div><span class="chip blue" id="answered-count">0 / ${b.questions.length} 已答</span></div><div class="progressline"><div id="progressfill" style="width:0%"></div></div><nav class="qnav" id="qnav" aria-label="跳转题目"></nav></div><div class="panelbody" id="questionbody"><div class="questioncontent" id="questioncontent"></div></div></section></main>`;
renderReading();renderQuestions();document.getElementById('backhome').onclick=renderHome;document.getElementById('submitexam').onclick=submit;updateProgress();updateTimer()}
function renderReading(){if(currentScreen!=='exam')return;const b=bank();const tabs=document.getElementById('passagetabs');tabs.innerHTML=b.passages.map(p=>`<button class="tab ${p.id===activePassage?'active':''}" data-passage="${esc(p.id)}" type="button">${esc(p.title.length>31?p.title.slice(0,28)+'…':p.title)}</button>`).join('');tabs.querySelectorAll('button').forEach(t=>t.onclick=()=>{activePassage=t.dataset.passage;renderReading()});const p=b.passages.find(x=>x.id===activePassage),reader=document.getElementById('reader');reader.innerHTML=`<div class="eyebrow">${esc(p.id)} · ${esc(p.topic||'READING')}</div><h2 class="reading-title">${esc(p.title)}</h2><div class="readmeta">${p.paragraphs.join(' ').trim().split(/\s+/).filter(Boolean).length} words · ${p.paragraphs.length} paragraphs</div>`+p.paragraphs.map((s,i)=>`<p id="reading-${esc(p.id)}-${i+1}"><span class="paranum">[${i+1}]</span>${esc(s)}</p>`).join('');reader.scrollTop=0}
function renderQuestions(){const b=bank(),a=attempt(),box=document.getElementById('questioncontent');box.innerHTML=b.questions.map((q,i)=>{const v=a.answers[q.id]??'',flag=!!a.flags[q.id];let body='';if(q.type==='single_choice'||q.type==='tfng'){let choices=q.type==='tfng'?[{id:'TRUE',text:'True'},{id:'FALSE',text:'False'},{id:'NOT GIVEN',text:'Not Given'}]:q.options;body=`<div class="choices">${choices.map(o=>`<label class="choice ${v===o.id?'checked':''}"><input type="radio" name="answer-${esc(q.id)}" value="${esc(o.id)}" ${v===o.id?'checked':''}><span class="choiceid">${q.type==='tfng'?'':esc(o.id)}</span><span class="choicetext">${esc(o.text)}</span></label>`).join('')}</div>`}else if(q.type==='gap_fill'){body=`<input class="fillinput" name="answer-${esc(q.id)}" aria-label="${esc(q.id)} gap fill" type="text" value="${esc(v)}" autocomplete="off" spellcheck="false"><div class="small muted" style="margin-top:6px">Maximum ${q.maxWords} word${q.maxWords>1?'s':''}. Answers over the limit are marked incorrect.</div>`}else{body=`<textarea class="shortinput" name="answer-${esc(q.id)}" aria-label="${esc(q.id)} short answer" spellcheck="true" placeholder="Write your academic answer in English…">${esc(v)}</textarea><div class="counter ${q.suggestedWords&&countWords(v)>q.suggestedWords.max?'over':''}" id="counter-${esc(q.id)}">${countWords(v)} words ${q.suggestedWords?'· Suggested '+q.suggestedWords.min+'–'+q.suggestedWords.max+' words':''}</div>`}return `<article class="qcard ${isAnswered(q,v)?'answered':''} ${flag?'flagged':''}" id="card-${esc(q.id)}"><div class="qmeta"><div class="qnumber">QUESTION ${String(i+1).padStart(2,'0')} <span class="muted">· ${esc(q.type.replaceAll('_',' ').toUpperCase())}</span></div><div class="points">${questionPoints(q)}</div></div><p class="qprompt">${esc(q.prompt)}</p>${body}<div class="qfooter"><span class="counter">Source: ${esc(q.passageIds.join(' + '))}${q.evidence?' · '+esc(q.evidence):''}</span><button class="flagbtn ${flag?'active':''}" type="button" data-flag="${esc(q.id)}">${flag?'◆ 已标记':'◇ 标记稍后检查'}</button></div></article>`}).join('');box.querySelectorAll('.qcard').forEach(card=>{const id=card.id.replace('card-',''),q=b.questions.find(x=>x.id===id);if(q.type==='single_choice'||q.type==='tfng'){card.querySelectorAll('input[type="radio"]').forEach(input=>input.onchange=()=>{a.answers[q.id]=input.value;persist();card.querySelectorAll('.choice').forEach(c=>c.classList.toggle('checked',c.querySelector('input').checked));updateProgress()})}else{const el=card.querySelector('.fillinput,.shortinput');el.oninput=()=>{a.answers[q.id]=el.value;persist();if(q.type==='short_answer'){const c=document.getElementById('counter-'+q.id);c.textContent=`${countWords(el.value)} words`+(q.suggestedWords?` · Suggested ${q.suggestedWords.min}–${q.suggestedWords.max} words`:'');c.classList.toggle('over',!!q.suggestedWords&&countWords(el.value)>q.suggestedWords.max)}updateProgress()}}card.querySelector('[data-flag]').onclick=()=>{a.flags[q.id]=!a.flags[q.id];persist();card.classList.toggle('flagged',a.flags[q.id]);const btn=card.querySelector('[data-flag]');btn.classList.toggle('active',a.flags[q.id]);btn.textContent=a.flags[q.id]?'◆ 已标记':'◇ 标记稍后检查';updateProgress()}})}
function updateProgress(){if(currentScreen!=='exam')return;const b=bank(),a=attempt(),n=b.questions.filter(q=>isAnswered(q,a.answers[q.id])).length;document.getElementById('answered-count').textContent=`${n} / ${b.questions.length} 已答`;document.getElementById('progressfill').style.width=(100*n/b.questions.length)+'%';const nav=document.getElementById('qnav');nav.innerHTML=b.questions.map((q,i)=>`<button class="qnavbutton ${isAnswered(q,a.answers[q.id])?'done':''} ${a.flags[q.id]?'flagged':''}" data-jump="${esc(q.id)}" aria-label="跳转第 ${i+1} 题" title="Question ${i+1}">${i+1}</button>`).join('');nav.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{document.getElementById('card-'+btn.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'})});b.questions.forEach(q=>document.getElementById('card-'+q.id)?.classList.toggle('answered',isAnswered(q,a.answers[q.id])))}
function updateTimer(){const a=attempt();if(!a||a.submittedAt)return;if(Date.now()>=a.deadlineAt){finishExam('timeout');showToast(`${bank().exam.durationMinutes} 分钟已结束，已自动交卷。`);return}const el=document.getElementById('timer');if(el){el.textContent=remainingText(a);el.className='timer '+timeClass(a)}}
function answerLabel(q,v){if(!isAnswered(q,v))return '（未作答）';if(q.type==='single_choice'){const o=q.options.find(x=>x.id===v);return v+(o?' — '+o.text:'')}return String(v)}
function scoringReport(b,a){const o=objectiveScore(b,a),s=shortGrades(b,a);return{objective:o,subjective:s,gradedTotal:o.total+s.total,maximum:b.exam.scoring.totalPoints,ungradedPoints:s.waiting,englishEarned:o.english+s.english,englishMax:b.exam.scoring.englishPoints,professionalEarned:o.professional+s.professional,professionalMax:b.exam.scoring.professionalPoints}}
function renderResults(){const b=bank(),a=attempt();if(!a){renderHome();return}ensureAttempt();if(!a.submittedAt){renderExam();return}currentScreen='result';const sum=scoringReport(b,a),shortCount=b.questions.filter(q=>q.type==='short_answer').length,completed=sum.subjective.graded===shortCount;app.innerHTML=header(`<span class="chip blue">已交卷 · 只读</span><button class="btn minor" id="tohome">题库首页</button><button class="btn minor primary" id="exportreporttop">导出答卷 JSON</button>`)+`<main class="resultlayout"><div class="resulthead"><div class="eyebrow" style="color:#81d8d0">ASSESSMENT REPORT</div><h1>${esc(b.exam.title)}</h1><p>${a.submitReason==='timeout'?'倒计时结束，系统自动交卷。':'已提前交卷。'} 交卷时间：${fmtDate(a.submittedAt)}。客观题已自动判分；简答题需按评分细则外部评分。</p><div class="buttonrow"><span class="chip">${b.questions.length} 题</span><span class="chip">英语 ${b.exam.scoring.englishPoints} / 专业 ${b.exam.scoring.professionalPoints}</span><span class="chip ${completed?'green':'amber'}">${completed?'所有简答题已导入评分':'简答题待外部评分'}</span></div></div><div class="scores"><div class="scoretile"><div class="slabel">客观题自动评分</div><div class="value">${sum.objective.total}<span class="muted" style="font-size:16px"> / ${sum.objective.max}</span></div><div class="detail">${sum.objective.correct} / ${sum.objective.objectives} 题正确</div></div><div class="scoretile"><div class="slabel">总分 ${completed?'(已合并)':'(部分待评分)'}</div><div class="value">${fmtNum(sum.gradedTotal)}<span class="muted" style="font-size:16px"> / ${sum.maximum}</span></div><div class="detail">${sum.ungradedPoints?`仍有 ${sum.ungradedPoints} 分未评分`:'主观与客观分数均已计入'}</div></div><div class="scoretile"><div class="slabel">英语 E</div><div class="value">${fmtNum(sum.englishEarned)}<span class="muted" style="font-size:16px"> / ${sum.englishMax}</span></div><div class="detail">${sum.ungradedPoints?'含已评分部分，未评分项不计为 0':'已完成全部评分'}</div></div><div class="scoretile"><div class="slabel">专业 P</div><div class="value">${fmtNum(sum.professionalEarned)}<span class="muted" style="font-size:16px"> / ${sum.professionalMax}</span></div><div class="detail">${sum.subjective.graded} / ${shortCount} 道简答已评分</div></div></div><div class="buttonrow" style="margin:18px 0"><button class="btn dark" id="copyllmpack">复制评卷指令给大模型</button><button class="btn" id="exportreport">导出完整答卷 JSON</button><button class="btn" id="copyreport">复制作答与自动评分情况</button><button class="btn" id="copybilingual">复制双语原文与标准答案</button><button class="btn minor" id="newexam">重考本题库</button></div><section class="gradingbox"><div class="sectionhead"><div><div class="eyebrow">LLM SCORING BRIDGE</div><h3>导入简答题外部评分</h3></div><span class="chip amber">不调用任何在线 API</span></div><p class="small muted">点击上方「复制评卷指令给大模型」，粘贴至任意 LLM；要求它按评分细则返回 JSON。将返回的 JSON 粘贴下方并导入，系统会核对每项得分不超上限并自动合并总分。外部模型的评分并非自动验证的事实，必要时请人工复核。</p><textarea id="gradejson" aria-label="粘贴 LLM 评分 JSON" placeholder='{"schemaVersion":"1.0","examId":"...","grades":[{"questionId":"Q13","rubricScores":{"R13a":3,"R13b":3,"R13c":3,"R13d":3},"feedbackEn":"...","feedbackZh":"..."}]}'></textarea><div class="buttonrow" style="margin-top:10px"><button class="btn primary" id="applygrades">导入并合并 LLM 分数</button><button class="btn minor" id="copygradesample">复制评分返回格式示例</button></div></section><div id="reading-review"></div><div class="sectionhead" style="margin:30px 0 5px"><div><div class="eyebrow">QUESTION REVIEW</div><h2>逐题作答 · 答案 · 解析 · 评分标准</h2></div><span class="chip">${b.questions.length} 题</span></div><div class="reviewlist" id="reviewlist"></div><div class="footer">客观题按标准答案精确评分（填空允许 acceptedAnswers）；简答题分数来自外部 LLM Rubric JSON，建议复核。</div></main>`;
document.getElementById('reading-review').innerHTML=bilingualPassagesHTML(b);const review=document.getElementById('reviewlist');review.innerHTML=b.questions.map((q,i)=>reviewHTML(q,i,a)).join('');document.getElementById('tohome').onclick=renderHome;document.getElementById('exportreporttop').onclick=()=>exportFile(buildReport(b,a),`${safeId(b.exam.id)}_answer_report.json`);document.getElementById('exportreport').onclick=()=>exportFile(buildReport(b,a),`${safeId(b.exam.id)}_answer_report.json`);document.getElementById('copyreport').onclick=()=>copyText(JSON.stringify(buildReport(b,a),null,2));document.getElementById('copyllmpack').onclick=()=>copyText(makeLLMGradingPrompt(b,a));document.getElementById('applygrades').onclick=applyGrades;document.getElementById('copygradesample').onclick=()=>copyText(JSON.stringify(makeGradeSample(b),null,2));document.getElementById('newexam').onclick=()=>{if(confirm('重新考试将覆盖当前作答和外部评分，确定吗？'))newAttempt()};document.getElementById('copybilingual').onclick=()=>copyText(bilingualAnswerText(b,a))}
function fmtNum(n){return Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}
function answerLabelZh(q,v){if(!isAnswered(q,v))return '（未作答）';if(q.type==='single_choice'){const o=(q.options||[]).find(x=>x.id===v);return o?`${v} — ${o.textZh||'（未提供选项中文翻译）'}`:String(v)}if(q.type==='tfng'){return ({'TRUE':'正确','FALSE':'错误','NOT GIVEN':'未提及'})[v]||String(v)}return String(v)}
function bilingualPassagesHTML(b){return `<section class="source-review" id="source-review"><div class="sectionhead"><div><div class="eyebrow">BILINGUAL READINGS</div><h2>考试阅读文章 · 中英文对照</h2></div><span class="chip">${b.passages.length} 篇</span></div><p class="small muted">以下是本套题的学术化改写阅读原文与逐段中文译文，并非上传素材的未经改写全文。</p>${b.passages.map(p=>`<details open><summary>${esc(p.id)} · ${esc(p.title)} / ${esc(p.titleZh||'中文译名未提供')}</summary>${p.paragraphs.map((en,i)=>`<div class="para-pair"><span class="langflag">¶${i+1} · EN</span><p>${esc(en)}</p><span class="langflag">¶${i+1} · 中文</span><p class="zh">${esc(p.paragraphsZh?.[i]||'本题库未提供该段中文译文。')}</p></div>`).join('')}</details>`).join('')}</section>`}
function bilingualAnswerText(b,a){const parts=[`EXAM / 考试: ${b.exam.title}`,`Duration / 时长: ${b.exam.durationMinutes} minutes`,`Reading passages (English + 中文逐段) / 阅读文章：`];for(const p of b.passages){parts.push(`\n${p.id} ${p.title} / ${p.titleZh||'（未提供中文标题）'}`);p.paragraphs.forEach((t,i)=>{parts.push(`[${i+1}] EN: ${t}`);parts.push(`[${i+1}] 中文: ${p.paragraphsZh?.[i]||'（未提供中文翻译）'}`)})}parts.push('\nQUESTIONS, ANSWERS AND RUBRICS / 题目、答案和评分标准');b.questions.forEach((x,i)=>{parts.push(`\n${i+1}. ${x.id} [${x.points} pts; E${x.englishPoints}/P${x.professionalPoints}]`);parts.push('Question (EN): '+x.prompt);parts.push('题干（中）: '+(x.promptZh||'（未提供中文译文）'));if(x.options){x.options.forEach(opt=>parts.push(`${opt.id}. ${opt.text} / ${opt.textZh||'（无中文）'}`))}parts.push('Candidate / 用户答案: '+(a.answers[x.id]??'（未作答）'));parts.push('Correct / 标准答案 (EN): '+(objective(x)?answerLabel(x,x.answer):x.modelAnswer));parts.push('正确答案（中）: '+(x.type==='short_answer'?(x.modelAnswerZh||x.answerZh||'（未提供中文参考答案）'):(x.answerZh||answerLabelZh(x,x.answer))));parts.push('Explanation (EN): '+x.explanation.en);parts.push('解析（中）: '+x.explanation.zh);parts.push('Evidence / 原文定位: '+(x.evidence||''));if(x.rubric)x.rubric.forEach(r=>parts.push(`Rubric ${r.id} [${r.dimension}] ${r.maxPoints} pts: ${r.description.en} / ${r.description.zh}`))});return parts.join('\n')}

function reviewHTML(q,i,a){const v=a.answers[q.id],grade=a.llmGrades?.[q.id],right=objective(q)?isCorrect(q,v):null;let answer='';if(objective(q)){answer=`<div class="answerbox"><div class="answeritem"><div class="atitle">Your answer / 你的答案</div><strong>${esc(answerLabel(q,v))}</strong><p class="bilingual-answer">${esc(answerLabelZh(q,v))}</p></div><div class="answeritem"><div class="atitle">Correct answer / 标准答案</div><strong>EN · ${esc(answerLabel(q,q.answer))}</strong><p class="bilingual-answer">中 · ${esc(q.answerZh||answerLabelZh(q,q.answer))}</p></div></div><div class="small muted">Marking rule: ${q.type==='gap_fill'?'accepted answers: '+esc(q.acceptedAnswers.join(' / '))+'; maximum '+q.maxWords+' word(s)':'exactly one matching answer (no partial points)'}.</div>`}else{answer=`<div class="answeritem" style="margin:12px 0"><div class="atitle">Your English response / 你的作答</div>${esc(isAnswered(q,v)?v:'（未作答）')}</div><div class="answeritem"><div class="atitle">Model answer (EN) / 英文参考答案</div>${esc(q.modelAnswer)}</div><div class="answeritem"><div class="atitle">Model answer (中文) / 中文参考答案</div>${esc(q.modelAnswerZh||q.answerZh||'（本题库未提供中文参考答案）')}</div><div class="rubric">${q.rubric.map(r=>`<div class="rubric-row"><div><div class="rlabel">${esc(r.criterion)} <span class="chip ${r.dimension==='english'?'blue':'green'}">${r.dimension==='english'?'English':'Discipline'}</span></div><div class="rdesc">EN · ${esc(r.description.en)}</div><div class="rdesc">中 · ${esc(r.description.zh)}</div></div><div class="scoremark">${grade?fmtNum(grade.rubricScores[r.id])+' / ':''}${r.maxPoints} pts</div></div>`).join('')}</div>${grade?`<div class="bilingual"><strong>External LLM feedback / 外部反馈</strong><p>${esc(grade.feedbackEn||'—')}</p><p>${esc(grade.feedbackZh||'—')}</p></div>`:''}`}

return `<article class="reviewcard"><div class="reviewtop"><div><strong>Question ${String(i+1).padStart(2,'0')}</strong> <span class="small muted">· ${esc(q.type.replaceAll('_',' '))} · ${esc(q.evidence||q.passageIds.join(' + '))}</span></div><span class="chip ${objective(q)?right?'green':'red':grade?'green':'amber'}">${objective(q)?(right?'Correct':'Incorrect / blank')+' · '+(right?q.points:0)+'/'+q.points:grade?'LLM '+fmtNum(q.rubric.reduce((s,r)=>s+grade.rubricScores[r.id],0))+'/'+q.points:'Pending · '+q.points+' pts'}</span></div><div class="reviewbody"><div class="small muted">English ${q.englishPoints} pts · Discipline ${q.professionalPoints} pts</div><p class="qprompt" style="margin-top:7px">${esc(q.prompt)}</p><p class="review-zh">${esc(q.promptZh||'（本题库未提供中文题干）')}</p>${q.options?`<details class="option-review"><summary>Options / 选项双语对照</summary>${q.options.map(o=>`<div class="optionline"><b>${esc(o.id)}</b> ${esc(o.text)}<div class="review-zh">${esc(o.textZh||'（无中文译文）')}</div></div>`).join('')}</details>`:''}${answer}<div class="bilingual"><strong>Bilingual explanation / 中英文解析</strong><p>EN · ${esc(q.explanation.en)}</p><p>中 · ${esc(q.explanation.zh)}</p></div></div></article>`}
function buildReport(b,a){return{format:'ScholarAssessSubmission-1.1',exam:{id:b.exam.id,title:b.exam.title,durationMinutes:b.exam.durationMinutes,startedAt:fmtDate(a.startedAt),submittedAt:fmtDate(a.submittedAt),submissionReason:a.submitReason,scoring:b.exam.scoring},summary:scoringReport(b,a),passages:b.passages.map(p=>({id:p.id,title:p.title,titleZh:p.titleZh||null,paragraphsEn:p.paragraphs,paragraphsZh:p.paragraphsZh||null})),answers:b.questions.map(q=>({questionId:q.id,passageIds:q.passageIds,type:q.type,promptEn:q.prompt,promptZh:q.promptZh||null,options:q.options||undefined,points:q.points,englishPoints:q.englishPoints,professionalPoints:q.professionalPoints,userAnswer:a.answers[q.id]??'',objectiveCorrect:objective(q)?isCorrect(q,a.answers[q.id]):null,objectiveAwarded:objective(q)?(isCorrect(q,a.answers[q.id])?q.points:0):null,modelAnswerEn:!objective(q)?q.modelAnswer:undefined,modelAnswerZh:!objective(q)?q.modelAnswerZh:undefined,correctAnswerEn:objective(q)?answerLabel(q,q.answer):undefined,correctAnswerZh:q.answerZh||null,explanationEn:q.explanation.en,explanationZh:q.explanation.zh,evidence:q.evidence,rubric:q.rubric||undefined,llmGrade:a.llmGrades?.[q.id]||null})),scoringDisclosure:'Objective items automatically graded locally; short answers require external LLM/manual rubric scoring and should be reviewed.'}}
function makeGradeSample(b){return{schemaVersion:'1.0',examId:b.exam.id,grades:b.questions.filter(q=>q.type==='short_answer').map(q=>({questionId:q.id,rubricScores:Object.fromEntries(q.rubric.map(r=>[r.id,0])),feedbackEn:'Criterion-specific academic feedback.',feedbackZh:'对应评分条目的中文反馈。'}))}}
function makeLLMGradingPrompt(b,a){const short=b.questions.filter(q=>q.type==='short_answer');const items=short.map(q=>{const rubric=q.rubric.map(r=>`- ${r.id} | ${r.criterion} | ${r.maxPoints} points | ${r.dimension}: ${r.description.en}`).join('\n');return `QUESTION ${q.id} (${q.points} points)\nQuestion: ${q.prompt}\nReference answer: ${q.modelAnswer}\nExplanation: ${q.explanation.en}\nRubric:\n${rubric}\nUser response: ${isAnswered(q,a.answers[q.id])?String(a.answers[q.id]):'[Blank — award zero for every criterion]'}`}).join('\n\n---\n\n');return `You are an independent academic grader. Grade the following short-answer responses strictly according to each question's rubric.\n\nInstructions:\n- Assess only the supplied user responses; do not grade objective questions.\n- Use the reference answer and explanation as guidance, not as wording that must be copied. Award credit for scientifically and academically equivalent answers.\n- Score every rubric criterion separately, never exceeding its maximum. Use numerical scores and allow half-point increments where appropriate.\n- Give zero for blank responses. Assess English only where the rubric dimension is "english".\n- Do not invent facts or award credit for unsupported claims.\n- Return ONLY one valid JSON object, with no Markdown or additional text, using this exact structure:\n${JSON.stringify({schemaVersion:'1.0',examId:b.exam.id,grades:short.map(q=>({questionId:q.id,rubricScores:Object.fromEntries(q.rubric.map(r=>[r.id,0])),feedbackEn:'Brief criterion-specific feedback.'}))},null,2)}\n- Keep schemaVersion, examId, questionId and rubric IDs unchanged. Provide brief English feedback for each question.\n\n${items}\n\nReturn the completed JSON object only.`}
function applyGrades(){const b=bank(),a=attempt();if(!a||!a.submittedAt)return;let data;try{data=JSON.parse(document.getElementById('gradejson').value);if(!data||data.schemaVersion!=='1.0'||data.examId!==b.exam.id||!Array.isArray(data.grades)||!data.grades.length)throw Error('schemaVersion、examId 或 grades 格式错误');const next={...(a.llmGrades||{})};const seen=new Set();for(const grade of data.grades){if(!grade||typeof grade.questionId!=='string'||seen.has(grade.questionId))throw Error('评分 questionId 缺失或重复');seen.add(grade.questionId);const q=b.questions.find(q=>q.id===grade.questionId&&q.type==='short_answer');if(!q)throw Error(`非简答题或未知题号：${grade.questionId}`);if(!grade.rubricScores||typeof grade.rubricScores!=='object')throw Error(`${q.id}: 缺少 rubricScores`);const expected=new Set(q.rubric.map(r=>r.id));for(const k of Object.keys(grade.rubricScores))if(!expected.has(k))throw Error(`${q.id}: 非法 rubric ID ${k}`);for(const r of q.rubric){const s=grade.rubricScores[r.id];if(typeof s!=='number'||!Number.isFinite(s)||s<0||s>r.maxPoints)throw Error(`${q.id}: ${r.id} 不得小于 0、超过 ${r.maxPoints} 或缺失`);if(!isAnswered(q,a.answers[q.id])&&s>0)throw Error(`${q.id} 未作答，不能得分`)}next[q.id]={rubricScores:grade.rubricScores,feedbackEn:String(grade.feedbackEn||''),feedbackZh:String(grade.feedbackZh||''),gradedAt:Date.now()}}a.llmGrades=next;persist();renderResults();showToast(`成功合并 ${data.grades.length} 道简答题的评分`)}catch(e){showToast('评分导入失败：'+e.message)}}
function update(){if(currentScreen==='exam')updateTimer()}
function blockFindShortcut(e){const k=String(e.key||'').toLowerCase();if(((e.ctrlKey||e.metaKey)&&(k==='f'||k==='g'))||k==='f3'){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();showToast('页面查找快捷键已禁用；复制和粘贴仍可使用。')}}document.addEventListener('keydown',blockFindShortcut,true);
setInterval(update,500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});window.addEventListener('focus',update);validateBank(BUILTIN);ensureAttempt();renderHome();if(!storedOK)showToast('当前环境可能限制 localStorage；请通过导出功能备份答卷。');
})();
</script>
