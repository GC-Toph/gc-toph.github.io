<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="16" cy="8" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8" cy="16" r="1" fill="currentColor"/><circle cx="16" cy="16" r="1" fill="currentColor"/></svg></span>大富翁</div>
    <div class="top-meta"><span class="offline-label">一桌朋友，一场冒险</span><span id="save-status"><span class="status-dot"></span>HTML单页版</span></div>
  </header>
  <main id="app" class="container"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><div class="dialog-inner confirm-inner"><h2 id="confirm-title">重新开一局？</h2><p>当前对局将结束。新游戏开始后，会覆盖本设备保存的上一局进度。</p><div class="next-row"><button type="button" class="btn secondary" data-action="close-dialog">继续对局</button><button type="button" class="btn primary" data-action="confirm-restart">重新设置</button></div></div></dialog>
  <dialog id="record-dialog" aria-labelledby="record-title"><div id="record-content" class="dialog-inner"></div></dialog>

  <script id="game-engine">
  'use strict';
  // 金额全程使用 BigInt；Number 仅用于无量纲随机变量、比例展示和图表。
  const GameEngine = (() => {
    const SCALE = 1000000000000n;
    const STAT_KEYS = ['invested','proceeds','interest','wages','prayerFees','prayerRefunds','expenses','allianceFees','riskLoss','aidGiven','aidReceived','wages','prayerFees','prayerRefunds'];
    const PROJECT_NAMES = ['晴湾旅社','星河工坊','山野咖啡','绿洲农场','云端影院','深海探险','晨光书店','风车小镇','北岛航线','森林营地','月亮集市','麦田酿造','落日港口','火山温泉','极光研究所','花园乐园','远山列车','流星矿场','蓝鲸电台','城市新星'];
    function random() {
      if (globalThis.crypto && typeof globalThis.crypto.getRandomValues === 'function') {
        const a = new Uint32Array(2); globalThis.crypto.getRandomValues(a);
        return ((a[0] >>> 5) * 67108864 + (a[1] >>> 6)) / 9007199254740992;
      }
      return Math.random();
    }
    const min = (a,b) => a < b ? a : b;
    const max = (a,b) => a > b ? a : b;
    const sum = values => values.reduce((a,b) => a + b, 0n);
    const rounded = (n,d) => n < 0n ? -((-n + d/2n)/d) : (n + d/2n)/d;
    const fixed = number => BigInt(Math.round(number * Number(SCALE)));
    const uniform = (lo,hi,rng) => lo + (hi-lo) * rng();
    function normal(rng) {
      const u = Math.max(Number.MIN_VALUE, 1 - rng());
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng());
    }
    const player = (g,id) => g.players.find(p => p.id === id);
    const living = g => g.players.filter(p => !p.bankrupt);
    const totalWealth = g => sum(g.players.map(p => p.wealth));
    const totalDraft = g => sum(g.players.map(p => p.bankrupt ? 0n : g.drafts[p.id] || 0n));
    const bankGap = g => max(0n,g.project.cost-totalDraft(g));
    const totalFunding = g => totalDraft(g) + bankGap(g);
    const workerCount = g => g.players.filter(p=>!p.bankrupt && g.working?.[p.id]).length;
    function minimumWage(g,p) {
      const workers = BigInt(workerCount(g));
      return 60n + 100n/(1n+workers) + 20000n/(200n+p.wealth) + totalWealth(g)/800n;
    }
    function generateProject(total, round, rng = random) {
      const ratio = uniform(.05,.5,rng);
      const cost = max(1n, rounded(total * fixed(ratio), SCALE));
      const s1 = uniform(.3,.6,rng), s2 = uniform(.5,.95,rng);
      const r1 = uniform(.2,1.2,rng), r2 = uniform(.8,6,rng);
      const vlo = rounded(cost * fixed(1 + Math.min(r1,r2)), SCALE);
      const vhi = rounded(cost * fixed(1 + Math.max(r1,r2)), SCALE);
      return {name:PROJECT_NAMES[(round-1) % PROJECT_NAMES.length], cost,
        slo:Math.min(s1,s2), shi:Math.max(s1,s2), vlo, vhi};
    }
    function sampleValue(project,rng = random) {
      const z = fixed(normal(rng));
      const numerator = (project.vlo + project.vhi) * 3n * SCALE + (project.vhi - project.vlo) * z;
      return max(0n, rounded(numerator, 6n * SCALE));
    }
    function allocate(value, weights) {
      const total = sum(weights);
      if (total === 0n) return weights.map(() => 0n);
      const shares = weights.map(w => value * w / total);
      const remainders = weights.map((w,i) => ({i,r:value*w % total,w})).filter(x => x.w > 0n);
      remainders.sort((a,b) => a.r === b.r ? a.i - b.i : a.r > b.r ? -1 : 1);
      let leftover = value - sum(shares);
      for (const entry of remainders) {
        if (leftover === 0n) break;
        shares[entry.i] += 1n; leftover -= 1n;
      }
      if (leftover !== 0n) throw new Error('分配校验失败');
      return shares;
    }
    function beginRound(g,rng = random) {
      if (living(g).length === 0) throw new Error('没有存续玩家');
      g.phase = 'preparation';
      g.project = generateProject(totalWealth(g),g.round,rng);
      g.drafts = Object.fromEntries(g.players.map(p => [p.id,0n]));
      g.bankDraft = 0n;
      g.working = Object.fromEntries(g.players.map(p=>[p.id,false]));
      g.prayers = Object.fromEntries(g.players.map(p=>[p.id,false]));
      g.roundState = {opening:g.players.map(p => p.wealth),events:[]};
      g.lastNotice = '';
    }
    function createGame(names, rounds, rng = random) {
      if (!Array.isArray(names) || names.length < 1) throw new Error('至少需要一名玩家');
      if (!Number.isSafeInteger(rounds) || rounds < 10) throw new Error('轮数至少为 10');
      const g = {version:4,round:1,rounds,phase:'preparation',records:[],endReason:'',lastNotice:'',
        players:names.map((name,i) => ({id:i+1,name:String(name).trim().slice(0,30) || `玩家 ${i+1}`,
          wealth:1000n,allyId:null,bankrupt:false,bankruptRound:null,history:[1000n],
          stats:Object.fromEntries(STAT_KEYS.map(k => [k,0n]))})),drafts:{},project:null,roundState:null};
      beginRound(g,rng); return g;
    }
    function bankrupt(g,p,stage) {
      if (p.wealth !== 0n || p.bankrupt) return;
      p.bankrupt = true; p.bankruptRound = g.round;
      g.roundState.events.push({type:'bankrupt',id:p.id,stage});
      if (p.allyId !== null) {
        const partner = player(g,p.allyId), partnerId = p.allyId;
        p.allyId = null; if (partner) partner.allyId = null;
        g.roundState.events.push({type:'dissolve',ids:[p.id,partnerId]});
      }
    }
    function formAlliance(g,aId,bId) {
      if (g.phase !== 'preparation') throw new Error('只有每轮开始时可以结盟');
      const a = player(g,aId), b = player(g,bId);
      if (!a || !b || a === b || a.bankrupt || b.bankrupt || a.allyId !== null || b.allyId !== null) throw new Error('请选择两名尚未结盟的存续玩家');
      if (a.wealth < 50n || b.wealth < 50n) throw new Error('双方都需要至少 50 元支付联盟费用');
      for (const p of [a,b]) { p.wealth -= 50n; p.stats.allianceFees += 50n; }
      a.allyId = b.id; b.allyId = a.id;
      g.roundState.events.push({type:'alliance',ids:[a.id,b.id],amount:100n});
      bankrupt(g,a,'联盟费用'); bankrupt(g,b,'联盟费用');
    }
    function applyRiskBatch(g,kind,flags) {
      const losses = new Map();
      for (const p of living(g)) {
        if (!flags[p.id][kind]) continue;
        const loss = kind === 'illness' ? min(200n,p.wealth) : p.wealth / 10n;
        p.wealth -= loss; p.stats.riskLoss += loss; losses.set(p.id,loss);
        g.roundState.events.push({type:'risk',id:p.id,risk:kind,amount:loss});
      }
      for (const p of g.players) bankrupt(g,p,kind === 'illness' ? '疾病风险' : '神秘灾害');
      // 同一类风险的扣款、破产判定和救助均按批次处理，避免玩家编号决定结果。
      const transfers = [];
      for (const a of living(g)) {
        if (a.allyId === null || a.id > a.allyId) continue;
        const b = player(g,a.allyId);
        for (const [victim,donor] of [[a,b],[b,a]]) {
          const loss = losses.get(victim.id) || 0n;
          const amount = min(loss/2n,donor.wealth*3n/100n);
          if (amount > 0n) transfers.push({from:donor.id,to:victim.id,amount,risk:kind});
        }
      }
      for (const t of transfers) {
        const donor = player(g,t.from), victim = player(g,t.to);
        donor.wealth -= t.amount; victim.wealth += t.amount;
        donor.stats.aidGiven += t.amount; victim.stats.aidReceived += t.amount;
        g.roundState.events.push({type:'aid',...t});
      }
    }
    function prepareRound(g,rng = random) {
      if (g.phase !== 'preparation') throw new Error('本轮开销与风险已经处理');
      const expenses = living(g).map(p => ({p,planned:p.allyId === null ? 50n : 40n}));
      for (const {p,planned} of expenses) {
        const amount = min(planned,p.wealth);
        p.wealth -= amount; p.stats.expenses += amount;
        g.roundState.events.push({type:'expense',id:p.id,amount,planned});
      }
      for (const p of g.players) bankrupt(g,p,'日常开销');
      const flags = {};
      for (const p of living(g)) flags[p.id] = {illness:rng() < .1,disaster:rng() < .05};
      applyRiskBatch(g,'illness',flags);
      applyRiskBatch(g,'disaster',flags);
      g.phase = 'investment';
    }
    function setDraft(g,id,amount) {
      if (g.phase !== 'investment') throw new Error('目前不能修改认购');
      const p = player(g,id);
      if (!p || p.bankrupt || typeof amount !== 'bigint' || g.working[id]) return;
      g.drafts[id] = max(0n,min(amount,p.wealth-(g.prayers[id]?20n:0n)));
      if (g.drafts[id] === 0n) g.prayers[id] = false;
      g.bankDraft = bankGap(g);
    }
    function setWorking(g,id,yes) {
      if(g.phase !== 'investment') throw new Error('目前无法切换打工');
      const p=player(g,id);
      if(!p || p.bankrupt) return;
      g.working[id]=Boolean(yes);
      if(yes){g.drafts[id]=0n;g.prayers[id]=false;}
      g.bankDraft=bankGap(g);
    }
    function setPrayer(g,id,yes) {
      if(g.phase !== 'investment') throw new Error('目前无法切换祈福');
      const p=player(g,id);
      if(!p || p.bankrupt || g.working[id]) return;
      if(yes && (g.drafts[id]===0n || p.wealth<20n)) throw new Error('祈福需要投资且额外预留 20 元');
      if(yes) g.drafts[id]=min(g.drafts[id],p.wealth-20n);
      g.prayers[id]=Boolean(yes);
      g.bankDraft=bankGap(g);
    }
    function settleRound(g,start,rng = random) {
      if (g.phase !== 'investment') throw new Error('本轮已经结算或尚未准备');
      if (start && totalFunding(g) < g.project.cost) throw new Error('筹资不足');
      const contributions = g.players.map(p => start && !p.bankrupt ? g.drafts[p.id] || 0n : 0n);
      const bankContribution = start ? bankGap(g) : 0n;
      const raised = sum(contributions) + bankContribution;
      let probability = null, status = 'skipped', value = 0n;
      const prayers = g.players.map(p=>start && !p.bankrupt && !!g.prayers[p.id] && contributions[g.players.indexOf(p)]>0n);
      // 每个打工玩家分别、独立采样一次标准正态随机变量，不共用本轮抽样值。
      const workerDraws = g.players.map(p => {
        if (!start || p.bankrupt || !g.working[p.id]) return null;
        const y = normal(rng);
        const x = y*y + y*y*y*y/4;
        return {y, x, bonus:BigInt(Math.floor(x))};
      });
      const wages = g.players.map((p,i)=>workerDraws[i] ? minimumWage(g,p)+workerDraws[i].bonus : 0n);
      const prayerFees = prayers.map(yes=>yes?20n:0n);
      const refunds = contributions.map((v,i)=>0n);
      if (start) {
        for (let i=0;i<g.players.length;i++) g.players[i].wealth -= contributions[i]+prayerFees[i];
        const {slo,shi} = g.project;
        probability = Math.min(.99,Math.max(.01,(slo+shi)/2 + (shi-slo)/6 * normal(rng)));
        status = rng() < probability ? 'success' : 'failure';
        if (status === 'success') value = sampleValue(g.project,rng);
        else contributions.forEach((v,i)=>{if(prayers[i])refunds[i]=v/10n;});
      }
      const allProceeds = allocate(value,[...contributions,bankContribution]);
      const proceeds = allProceeds.slice(0,-1);
      const bankProceeds = allProceeds.at(-1);
      const interest = [];
      for (let i=0;i<g.players.length;i++) {
        const p = g.players[i];
        // 仅未投资的剩余现金计息；当轮项目分配款不计入 2% 的计息本金。
        const earned = p.wealth*2n/100n;
        p.wealth += proceeds[i] + earned + wages[i] + refunds[i];
        p.stats.invested += contributions[i]; p.stats.proceeds += proceeds[i]; p.stats.interest += earned;
        p.stats.wages += wages[i]; p.stats.prayerFees += prayerFees[i]; p.stats.prayerRefunds += refunds[i];
        interest.push(earned);
      }
      for (const p of g.players) bankrupt(g,p,'项目结算');
      const record = {round:g.round,project:{...g.project},status,probability,value,raised,bankContribution,bankProceeds,
        contributions,proceeds,interest,wages,workerDraws,prayers,prayerFees,refunds,working:g.players.map(p=>!!g.working[p.id]),opening:[...g.roundState.opening],
        closing:g.players.map(p => p.wealth),events:[...g.roundState.events]};
      g.records.push(record);
      for (const p of g.players) p.history.push(p.wealth);
      g.phase = 'result'; g.lastNotice = '';
      return record;
    }
    function advanceRound(g,rng = random) {
      if (g.phase !== 'result') throw new Error('请先结算本轮');
      if (g.round >= g.rounds || living(g).length === 0) {
        g.phase = 'finished'; g.endReason = living(g).length === 0 ? '所有玩家已破产，提前结束' : '全部轮次已完成';
        return;
      }
      g.round += 1; beginRound(g,rng);
    }
    function validState(g) {
      try {
        const money = v => typeof v === 'bigint' && v >= 0n;
        if (!g || g.version !== 4 || !['preparation','investment','result','finished'].includes(g.phase)) return false;
        if (!Number.isSafeInteger(g.rounds) || g.rounds < 10 || !Number.isInteger(g.round) || g.round < 1 || g.round > g.rounds) return false;
        if (!Array.isArray(g.players) || !g.players.length || !Array.isArray(g.records) || g.records.length > g.rounds) return false;
        const pids = new Set();
        for (const p of g.players) {
          if (!Number.isSafeInteger(p.id) || pids.has(p.id) || typeof p.name !== 'string' || !money(p.wealth) || typeof p.bankrupt !== 'boolean') return false;
          if (p.bankrupt !== (p.wealth === 0n)) return false;

  function chartSvg() {
    const players = game.players.filter(p=>!hiddenPlayers.has(p.id));
    if (!players.length) return '<div class="chart-empty">点击玩家名字，重新显示财富轨迹。</div>';
    const rounds = game.records.length;
    const positives = players.flatMap(p=>p.history.filter(v=>v>0n).map(logWealth));
    let low = Math.floor(Math.min(...positives)), high = Math.ceil(Math.max(...positives));
    if (low===high) { low = Math.max(0,low-1); high += 1; }
    const width=1030,height=415,left=60,right=1008,top=32,bottom=287,zeroY=350;
    const x = round => left+(right-left)*round/Math.max(1,rounds);
    const y = value => bottom-(logWealth(value)-low)/(high-low)*(bottom-top);
    const tickStep = Math.max(1,Math.ceil((high-low)/5));
    const ticks = [];
    for (let t=low;t<=high;t+=tickStep) ticks.push(t);
    if (ticks.at(-1)!==high) ticks.push(high);
    let svg = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="wealth-svg-title wealth-svg-desc"><title id="wealth-svg-title">每位玩家的 log10 财富随轮次变化</title><desc id="wealth-svg-desc">正财富使用以 10 为底的对数纵轴。破产后的 0 元显示在下方独立区域。横轴从初始状态到第 ${rounds} 轮。</desc><text x="${left}" y="15" font-size="11" fill="#6b7970">log₁₀(财富 / 元)</text>`;
    for (const t of ticks) {
      const yy=bottom-(t-low)/(high-low)*(bottom-top);
      svg += `<line x1="${left}" y1="${yy}" x2="${right}" y2="${yy}" stroke="#e0e4d8"/><text x="${left-15}" y="${yy+4}" font-size="11" fill="#6b7970" text-anchor="end">${t}</text>`;
    }
    svg += `<rect x="${left}" y="${zeroY-20}" width="${right-left}" height="40" rx="7" fill="#f0ede5"/><text x="${left-13}" y="${zeroY+4}" text-anchor="end" font-size="11" fill="#a56243">0 元</text><text x="${left+8}" y="${zeroY-27}" font-size="10" fill="#8c7e6b">破产区（不属于对数纵轴）</text>`;
    for (let i=0;i<=rounds;i++) svg+=`<text x="${x(i)}" y="396" text-anchor="middle" font-size="11" fill="#6b7970">${i===0?'初始':i}</text>`;
    svg += `<text x="${right}" y="413" text-anchor="end" font-size="10" fill="#6b7970">轮次</text>`;
    for (const p of players) {
      const dash = p.id>8 ? `stroke-dasharray="${3+Math.floor((p.id-1)/8)%4} 4"` : '';
      const points = p.history.map((v,i)=>v>0n?`${x(i)},${y(v)}`:null).filter(Boolean).join(' ');
      svg+=`<polyline points="${points}" fill="none" stroke="${color(p.id)}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${dash}/>`;
      const firstZero = p.history.findIndex(v=>v===0n);
      if (firstZero>=0 && firstZero<rounds) svg+=`<line x1="${x(firstZero)}" y1="${zeroY}" x2="${x(rounds)}" y2="${zeroY}" stroke="${color(p.id)}" stroke-width="1.5" stroke-dasharray="3 5" opacity=".6"/>`;
      for (let i=0;i<p.history.length;i++) {
        const value=p.history[i],yy=value===0n?zeroY:y(value);
        const label = `${p.name} · ${i===0?'初始':`第 ${i} 轮`} · ${yuan(value)}${value===0n?'（破产）':''}`;
        svg+=`<circle cx="${x(i)}" cy="${yy}" r="${value===0n?4.5:3.5}" fill="${value===0n?'#faf8f2':color(p.id)}" stroke="${color(p.id)}" stroke-width="1.5" tabindex="0" aria-label="${esc(label)}"><title>${esc(label)}</title></circle>`;
      }
    }
    return svg+'</svg>';
  }

  function startNewGame() {

  async function runExpenseSequence() {
    const token=++sequenceToken;
    animating=true; screen='expenses';
    const before=new Map(game.players.map(p=>[p.id,p.wealth]));
    expenseOpening=new Map(before);
    GameEngine.prepareRound(game); saveNow(); render();
    const events=game.roundState.events.filter(e=>e.type!=='alliance');
    const expenses=events.filter(e=>e.type==='expense');
    const remaining=events.filter(e=>e.type!=='expense');
    function changeBalance(id,delta) {
      before.set(id,(before.get(id)||0n)+delta);
      const balance=$(`[data-balance="${id}"]`);
      if(balance) balance.textContent=yuan(before.get(id));
      const row=$(`[data-ledger="${id}"]`);
      if(row) {
        const float=document.createElement('span');
        float.className='money-float '+(delta>0n?'gain':'loss');
        float.textContent=signedYuan(delta);
        row.append(float);
        float.addEventListener('animationend',()=>float.remove(),{once:true});
      }
    }
    // 日常开销是同一批次：所有人同时扣款和播放金额动画。
    if(expenses.length) {
      const node=$('#event-stage');
      if(node) {
        node.textContent=`日常开销：${expenses.length} 位存续玩家同时扣款，独立玩家最多 ¥50，盟友最多 ¥40。`;
        node.className='event-stage';
      }
      for(const e of expenses) changeBalance(e.id,-e.amount);
      toast(`日常开销已同步扣除：共 ${yuan(expenses.reduce((total,e)=>total+e.amount,0n))}`);
      await sleep(reducedMotion()?300:2300);
    }
    // 疾病、神秘灾害、救助和破产事件仍按原始顺序逐一展示。
    for(const e of remaining) {
      if(token!==sequenceToken) return;
      const node=$('#event-stage');
      if(!node) break;
      const message=eventText(e);
      node.textContent=message;
      node.className='event-stage '+(e.type==='risk'?'risk-flash':e.type==='aid'?'aid-flash':'');
      if(e.type==='risk') changeBalance(e.id,-e.amount);
      else if(e.type==='aid') {
        changeBalance(e.from,-e.amount);
        changeBalance(e.to,e.amount);
      }
      toast(message);
      await sleep(reducedMotion()?180:e.type==='risk'?2100:e.type==='aid'?1900:1200);
    }
    if(token!==sequenceToken) return;
    animating=false;expenseOpening=null;
    if(GameEngine.living(game).length===0){GameEngine.settleRound(game,false);GameEngine.advanceRound(game);screen='alliance';}
    else screen='investment';
    saveNow();render();window.scrollTo({top:0,behavior:'instant'});
  }
  async function commitRound() {
    if(game.phase!=='investment'||animating)return;
    const start=GameEngine.totalFunding(game)>=game.project.cost;
    if(!start){
      const r=GameEngine.settleRound(game,false);GameEngine.advanceRound(game);screen='alliance';
      if(game.phase!=='finished')game.lastNotice=`第 ${r.round} 轮已放弃，现金利息 ${yuan(GameEngine.sum(r.interest))} 已入账。`;
      saveNow();render();toast('融资不足，项目放弃；本轮未扣认购款。');return;
    }
    animating=true;screen='drawing';const token=++sequenceToken;render();
    for(let sec=3;sec>=1;sec--){const count=$('#draw-countdown');if(count)count.textContent=sec;await sleep(reducedMotion()?100:1000);if(token!==sequenceToken)return;}
    const r=GameEngine.settleRound(game,true);saveNow();
    const panel=$('.draw-panel');
    if(panel){panel.classList.add(r.status==='success'?'draw-success':'draw-failure');panel.innerHTML=`<div class="result-symbol">${r.status==='success'?'✦':'×'}</div><h2>${r.status==='success'?'项目成功！':'项目失败'}</h2><p>${r.status==='success'?`总价值 ${yuan(r.value)} · 按出资比例分配`:'未祈福的投资本金全部损失；祈福者返还 10% 投资本金'}</p>`;}
    toast(r.status==='success'?'开奖成功，投资与打工收益已结算':'开奖失败，打工收益及祈福返还已到账');
    await sleep(reducedMotion()?150:1250);
    if(token!==sequenceToken)return;
    animating=false;render();window.scrollTo({top:0,behavior:'instant'});
  }
  function exportCsv() {
    const rows=[['资金大富翁战绩'],['实际完成轮数',game.records.length],['设定轮数',game.rounds],[],['玩家','最终财富','总盈亏','单轮复合收益率','破产轮次','累计认购','项目分配','利息','打工收入','祈福费用','祈福返还','日常开销','联盟费用','风险损失','救助支出','收到救助']];
    const safeName = s=>/^[=+\-@\t\r]/.test(s) ? "'"+s : s;
    for (const p of game.players) rows.push([safeName(p.name),p.wealth,p.wealth-1000n,growth(p.wealth,game.records.length),p.bankruptRound || '',...['invested','proceeds','interest','wages','prayerFees','prayerRefunds','expenses','allianceFees','riskLoss','aidGiven','aidReceived'].map(k=>p.stats[k])]);
    rows.push([],['逐轮财富'],['轮次',...game.players.map(p=>safeName(p.name))]);
    for(let i=0;i<=game.records.length;i++) rows.push([i,...game.players.map(p=>p.history[i])]);
    rows.push([],['逐轮项目'],['轮次','项目','最低融资额','概率下端点','概率上端点','价值下端点','价值上端点','结果','实际成功概率','实际融资','实际总价值','银行出资','银行分配','打工人数','打工总收入','祈福总费用','祈福总返还']);
    for (const r of game.records) rows.push([r.round,r.project.name,r.project.cost,r.project.slo.toFixed(6),r.project.shi.toFixed(6),r.project.vlo,r.project.vhi,statusName(r.status),r.probability===null?'':r.probability.toFixed(6),r.raised,r.value,r.bankContribution,r.bankProceeds,r.working.filter(Boolean).length,GameEngine.sum(r.wages),GameEngine.sum(r.prayerFees),GameEngine.sum(r.refunds)]);
    const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download='资金大富翁_战绩.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  document.addEventListener('submit',e=>{if(e.target.id==='setup-form'){e.preventDefault();startNewGame();}});
  document.addEventListener('change',e=>{
    if(game?.phase==='investment' && e.target.classList.contains('prayer-toggle')) { try {GameEngine.setPrayer(game,Number(e.target.dataset.player),e.target.checked);render();queueSave();} catch(err) {toast(err.message);render();} return; }
    if(e.target.id!=='player-count') return;
    const count=Number(e.target.value);
    if(!Number.isSafeInteger(count)||count<1){$('#setup-error').textContent='玩家人数须为正整数。';return;}
    setupNames=[...document.querySelectorAll('.setup-name')].map(input=>input.value);
    setupNames=expandedNames(setupNames,count);
    $('#name-fields').innerHTML=nameFields(count);$('#setup-error').textContent='';
  });
  document.addEventListener('input',e=>{
    if(!game||game.phase!=='investment')return;
    if(e.target.classList.contains('investment-input')){
      const digits=e.target.value.replace(/[^0-9]/g,'');e.target.value=digits;
      syncDraft(Number(e.target.dataset.player),BigInt(digits||'0'),true);
    }else if(e.target.classList.contains('position-slider')){
      const p=game.players.find(p=>p.id===Number(e.target.dataset.player));
      syncDraft(p.id,p.wealth*BigInt(e.target.value)/1000n);
    }
  });
  document.addEventListener('click',e=>{
    const button=e.target.closest('[data-action]');if(!button||button.disabled)return;
    const action=button.dataset.action;
    try {
      if(action==='choose-work' || action==='choose-invest'){GameEngine.setWorking(game,Number(button.dataset.player),action==='choose-work');saveNow();render();return;}
      if(action==='close-dialog'){button.closest('dialog')?.close();return;}
      if(action==='resume'){game=savedGame;hiddenPlayers.clear();screen=game.phase==='preparation'?'alliance':game.phase==='investment'?'investment':'result';render();saveNow();window.scrollTo({top:0,behavior:'instant'});return;}
      if(action==='restart'){
        if(game.phase==='finished'){sequenceToken++;animating=false;setupNames=game.players.map(p=>p.name);savedGame=game;game=null;renderSetup();window.scrollTo({top:0,behavior:'instant'});}
        else $('#confirm-dialog').showModal();return;
      }
      if(action==='confirm-restart'){
        $('#confirm-dialog').close();sequenceToken++;animating=false;saveNow();setupNames=game.players.map(p=>p.name);game=null;renderSetup();window.scrollTo({top:0,behavior:'instant'});return;
      }
      if(!game || animating)return;
      if(action==='alliance'){
        const a=Number($('#ally-a').value),b=Number($('#ally-b').value);
        GameEngine.formAlliance(game,a,b);
        if(GameEngine.living(game).length===0){GameEngine.prepareRound(game);GameEngine.settleRound(game,false);GameEngine.advanceRound(game);}
        saveNow();render();toast('联盟费用已扣除。');
      }else if(action==='finish-alliance'){
        if(game.phase!=='preparation')return;
        runExpenseSequence();
      }else if(action==='preset'){
        if(game.phase!=='investment')return;
        const id=Number(button.dataset.player),p=game.players.find(p=>p.id===id);
        syncDraft(id,p.wealth*BigInt(button.dataset.percent)/100n);
      }else if(action==='commit')commitRound();
      else if(action==='next'){
        GameEngine.advanceRound(game);screen='alliance';saveNow();render();window.scrollTo({top:0,behavior:'instant'});
      }else if(action==='open-record'){
        const r=game.records.find(r=>r.round===Number(button.dataset.round));if(!r)return;
        $('#record-content').innerHTML=`<div class="dialog-top"><h2 id="record-title">第 ${r.round} 轮结算</h2><button class="dialog-close" type="button" data-action="close-dialog">关闭</button></div>${recordContent(r)}`;
        $('#record-dialog').showModal();
      }else if(action==='legend'){
        const id=Number(button.dataset.player);hiddenPlayers.has(id)?hiddenPlayers.delete(id):hiddenPlayers.add(id);
        button.classList.toggle('off',hiddenPlayers.has(id));button.setAttribute('aria-pressed',String(!hiddenPlayers.has(id)));$('#wealth-chart').innerHTML=chartSvg();
      }else if(action==='export')exportCsv();
    }catch(error){toast(error.message || '操作未完成，请重试。');}
  });
  window.addEventListener('pagehide',()=>{if(game)saveNow();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&game)saveNow();});
  savedGame=loadSaved();renderSetup();
  </script>
</body>
</html>
