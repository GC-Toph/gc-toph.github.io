<!DOCTYPE html>
<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>拼豆图纸生成器</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #4f46e5;
      --brand2: #4338ca;
      --brand-light: #e0e7ff;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.025);
      --radius: 12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
    
    header { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .topbar { max-width: 1600px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .title { font-size: 19px; font-weight: 800; display:flex; align-items:center;}
    .title span { font-size: 11px; font-weight: 700; color: #fff; background: var(--brand); padding: 3px 8px; border-radius: 6px; margin-left: 10px; white-space: nowrap; letter-spacing: 0.5px;}
    .row { display: flex; gap: 10px; }
    
    button, .filebtn, select, input[type="number"] { border: 1px solid var(--line); height: 38px; border-radius: 8px; background: #fff; color: var(--text); font-size: 14px; padding: 0 12px; outline: none; transition: 0.2s; }
    select, input[type="number"] { box-shadow: inset 0 1px 2px rgba(0,0,0,0.02); }
    button, .filebtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    button:hover, .filebtn:hover { border-color: #cbd5e1; background: #f8fafc; }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    button.primary:hover { background: var(--brand2); border-color: var(--brand2); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    input[type=file] { display: none; }
    input[type=range] { width: 100%; accent-color: var(--brand); }
    
    main { max-width: 1600px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 320px minmax(0,1fr) 340px; gap: 16px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); position:relative; }
    
    .left-panel { padding: 18px; position: sticky; top: 76px; max-height: calc(100vh - 90px); overflow-y: auto; }
    .center-panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .right-panel { position: sticky; top: 76px; height: calc(100vh - 90px); display: flex; flex-direction: column; overflow: hidden; }
    
    h2 { font-size: 15px; margin: 0 0 14px; color:#0f172a; font-weight: 700;}
    .field { display: grid; grid-template-columns: 100px minmax(0,1fr); gap: 10px; align-items: center; margin: 12px 0; }
    .field label { font-size: 13px; color: #475569; font-weight: 600;}
    .slider { display: grid; grid-template-columns: 1fr 42px; gap: 10px; align-items: center; }
    .value { text-align: right; font-family: var(--mono); font-size: 12px; color: #475569; background:#f1f5f9; padding:3px 6px; border-radius:6px;}
    
    .drop { border: 2px dashed #cbd5e1; border-radius: 10px; background: #f8fafc; min-height: 140px; padding: 16px; display: grid; place-items: center; text-align: center; cursor: pointer; transition: .2s; margin-bottom: 20px;}
    .drop:hover { border-color: var(--brand); background: var(--brand-light); }
    .drop.has { padding: 0; background: #0f172a; border-style: solid; border-width: 1px; overflow: hidden; }
    .drop img { max-width: 100%; max-height: 240px; display: block; }
    
    .adv-box { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 20px; }

    .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; text-align: center;}
    .stat b { font-size: 22px; display: block; margin-bottom: 2px; font-family: var(--mono); color: var(--brand);}
    .stat span { font-size: 12px; color: var(--muted); font-weight: 600;}
    
    .canvas-wrap { display: flex; flex-direction: column; box-shadow: var(--shadow-lg); border-radius: var(--radius); border: 1px solid var(--line); background: #fff; overflow: hidden;}
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); background:#f8fafc; flex-wrap: wrap;}
    .toolbar-title { color:#0f172a; font-size:14px; white-space: nowrap; }
    .preview-controls { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; min-width: 360px; }
    .preview-controls .zoom-slider { display: grid; grid-template-columns: minmax(110px, 180px) 52px; gap: 8px; align-items: center; }
    .view-btn.active { border-color: var(--brand); color: var(--brand2); background: var(--brand-light); }
    .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #e2e8f0; color: #475569; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .status-badge.active { background: #fef08a; color: #854d0e; }
    .status-badge.done { background: #dcfce7; color: #166534; }
    .progress-track { width: 100px; height: 6px; background: rgba(0,0,0,0.1); border-radius: 4px; overflow: hidden; display: none; }
    .status-badge.active .progress-track { display: block; }
    .progress-fill { height: 100%; background: #ca8a04; width: 0%; transition: width 0.15s ease-out; }
    
    .canvasShell { height: calc(100vh - 275px); min-height: 400px; overflow: auto; background: #e2e8f0; padding: 20px; cursor: crosshair; }
    .canvasStage { display: inline-block; background: white; box-shadow: 0 10px 25px rgba(0,0,0,.1); transform-origin: top left; }
    canvas { display: block; image-rendering: pixelated; }
    
    .color-list-wrap { flex: 1; overflow-y: auto; padding: 0; background: #fff;}
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px 12px; }
    th { background: #f8fafc; color: #475569; position: sticky; top: 0; font-weight: 600; box-shadow: 0 1px 0 var(--line); z-index: 10;}
    
    .color-row { cursor: pointer; transition: 0.15s; background: #fff;}
    .color-row:hover { background: #f8fafc; }
    .color-row.active { background: var(--brand-light) !important; }
    .color-row.active td { font-weight: 700; color: var(--brand2); }
    
    .swatch { width: 20px; height: 20px; border: 1px solid #cbd5e1; border-radius: 4px; display: inline-block; vertical-align: middle; margin-right: 8px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);}
    .kbd { font-family: var(--mono); font-size: 11px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 4px; padding: 2px 6px; white-space: nowrap;}
    
    .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 8px; opacity: 0; transition: .3s; z-index: 100; pointer-events: none; font-weight: 600; box-shadow: var(--shadow-lg);}
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

    /* 弹窗样式 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; place-items: center; z-index: 100; }
    .modal-overlay.show { display: grid; }
    .modal { background: #fff; padding: 24px; border-radius: var(--radius); width: 600px; max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h3 { margin: 0; font-size: 18px; color: var(--text); }
    .modal-body { overflow-y: auto; flex: 1; margin-bottom: 20px; }
    .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .color-chip { border: 2px solid var(--line); border-radius: 8px; padding: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.15s; user-select: none;}
    .color-chip:hover { border-color: #cbd5e1; }
    .color-chip.selected { border-color: var(--brand); background: var(--brand-light); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px;}

    .list-picker-row, .modal-picker-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    .list-picker-row > button { flex:1; min-width:120px; }
    .picker-btn.whitelist { border-color:#86efac; background:#f0fdf4; color:#166534; }
    .picker-btn.blacklist { border-color:#fca5a5; background:#fef2f2; color:#991b1b; }
    .picker-btn.active { outline:3px solid rgba(79,70,229,.22); border-color:var(--brand); }
    .list-summary { margin-top:10px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:12px; }
    .list-summary div { display:grid; grid-template-columns:58px 1fr; gap:8px; margin:4px 0; }
    .list-summary span { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .list-counts { font-size:13px; color:var(--muted); }
    .list-counts b:first-of-type { color:#15803d; } .list-counts b:last-of-type { color:#b91c1c; }
    .modal-note { font-size:13px; color:var(--muted); margin-bottom:10px; line-height:1.55; }
    .color-chip { flex-direction:column; align-items:stretch; gap:7px; cursor:default; }
    .chip-main { display:flex; align-items:center; gap:8px; }
    .chip-actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .chip-actions button { height:30px; padding:0 6px; font-size:12px; }
    .chip-actions .is-white { background:#dcfce7; border-color:#22c55e; color:#166534; }
    .chip-actions .is-black { background:#fee2e2; border-color:#ef4444; color:#991b1b; }
    .canvasShell.picking { cursor:copy; box-shadow:inset 0 0 0 3px var(--brand); }
    @media (max-width: 1280px) {
      main { grid-template-columns: 280px minmax(0, 1fr); }
      .right-panel { grid-column: 1 / -1; height: 400px; position: static; }
      .canvasShell { height: 500px; }
    }
    @media (max-width: 768px) {
      .topbar { flex-direction: column; align-items: stretch; }
      .row { flex-wrap: wrap; }
      .row > * { flex: 1; text-align: center; justify-content: center; }
      main { grid-template-columns: 1fr; padding: 12px; }
      .left-panel { position: static; height: auto; max-height: none; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .stats-row .stat:nth-child(3) { grid-column: span 2; }
      .canvasShell { min-height: 350px; height: 50vh; padding: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="title">拼豆图纸生成器 <span>Potts Model</span></div>
    <div class="row">
      <label class="filebtn">1. 选择图片<input id="file" type="file" accept="image/*"></label>
      <button class="primary" id="generate" disabled>2. 开始生成</button>
      <button id="exportFull" disabled>3A. 导出全图</button>
      <button id="exportRegions" disabled>3B. 分区域批量导出</button>
      <button id="exportProject" disabled>导出pbd文件</button>
      <label class="filebtn">导入pbd文件<input id="importProject" type="file" accept=".pbd,application/json"></label>
    </div>
  </div>
</header>

<main>
  <aside class="panel left-panel">
    <div id="drop" class="drop">点击或拖拽上传图片</div>

    <h2>基础尺寸与色卡</h2>
    <div class="field"><label>格子宽度</label><input id="gridWidth" type="number" min="10" max="320" value="64"></div>
    <div class="field"><label>拼豆底板</label><select id="sectionSize">
      <option value="15">15 × 15 小板</option>
      <option value="29" selected="">29 × 29 大板</option>
      <option value="50">50 × 50 融合板</option>
    </select></div>
    <div class="field"><label>内置色卡</label><select id="paletteType">
      <option value="mard291">MARD 全色 291</option>
      <option value="mard221" selected="">MARD 标准 221</option>
      <option value="artkalS">Artkal S 5mm</option>
      <option value="perler">Perler 标准色</option>
      <option value="hama">Hama 标准色</option>
    </select></div>
    <div class="field"><label>当前加载</label><span id="paletteStatus" class="value" style="text-align:left; font-weight:600; color:var(--brand);">载入中...</span></div>

    <div class="adv-box">
      <h2>平滑算法调优 (高级)</h2>
      <div class="field" title="值越大，相近颜色越容易聚集成大色块。"><label>色块聚集</label><div class="slider"><input id="couplingJ" type="range" min="0" max="10" value="2" step="0.5"><span id="couplingJv" class="value">2.0</span></div></div>
      <div class="field" title="决定在颜色渐变处是否容忍断裂。"><label>边缘保留</label><div class="slider"><input id="edgeGamma" type="range" min="10" max="100" value="80"><span id="edgeGammav" class="value">80</span></div></div>
      <div class="field" title="自动消除单独的杂色豆子。"><label>去孤立噪点</label><div class="slider"><input id="curvatureK" type="range" min="0" max="10" value="2" step="0.5"><span id="curvatureKv" class="value">2.0</span></div></div>
    </div>
    
    <div id="phase2Box" class="adv-box" style="display:none; margin-top:15px; border: 1px solid var(--brand); background: var(--brand-light);">
      <h2 style="color:var(--brand2); margin-bottom:10px;">第二阶段：精简色号</h2>
      <div class="field" title="输入你期望保留的最多颜色数量。">
        <label style="color:var(--brand2)">保留上限</label>
        <input id="maxColorsLimit" type="number" min="1" max="255" value="15" style="border-color:var(--brand);">
      </div>
      <button id="btnOpenLockModal" class="primary" style="width:100%; margin-top:10px;">配置黑白名单并二次退火</button>
      <div class="list-picker-row">
        <button id="pickWhitelist" type="button" class="picker-btn whitelist">吸管：加入白名单</button>
        <button id="pickBlacklist" type="button" class="picker-btn blacklist">吸管：加入黑名单</button>
      </div>
      <div class="list-summary">
        <div><b>白名单</b><span id="whiteSummary">未选择</span></div>
        <div><b>黑名单</b><span id="blackSummary">未选择</span></div>
      </div>
    </div>

  </aside>

  <section class="center-panel">
    <div class="stats-row">
      <div class="stat"><b id="statGrid">-</b><span>尺寸(格)</span></div>
      <div class="stat"><b id="statTemp">-</b><span>优化进度</span></div>
      <div class="stat"><b id="statBeads">-</b><span>用豆总计</span></div>
      <div class="stat"><b id="statColors">-</b><span>颜色种类</span></div>
      <div class="stat"><b id="statEnergy">-</b><span>系统能量</span></div>
    </div>
    
    <div class="canvas-wrap">
      <div class="toolbar">
        <b class="toolbar-title">图纸预览区（右侧选色后涂改，Ctrl+Z 撤销）</b>
        <div class="preview-controls">
          <button id="fitPanorama" class="view-btn" type="button" title="自动缩放到完整显示整张图纸">全景视角</button>
          <button id="fitLocal" class="view-btn" type="button" title="自动缩放到适合编辑一个底板区域">局部视角</button>
          <div class="zoom-slider">
            <input id="screenZoom" type="range" min="10" max="400" value="100" aria-label="图纸缩放">
            <span id="screenZoomv" class="value">100%</span>
          </div>
          <div id="statusBadge" class="status-badge">
            <span id="statusText">等待生成</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill" style="width: 0%;"></div></div>
          </div>
        </div>
      </div>
      <div class="canvasShell" id="canvasShell"><div class="canvasStage" id="canvasStage" style="transform: scale(1);"><canvas id="sheet" width="600" height="600"></canvas></div></div>
    </div>
  </section>

  <aside class="panel right-panel">
    <div style="padding: 14px 16px; font-weight: 700; border-bottom: 1px solid var(--line); background: #f8fafc; font-size: 15px; border-radius: var(--radius) var(--radius) 0 0;">
      所需色号清单 (点击选取)
    </div>
    <div class="color-list-wrap">
      <table>
        <thead><tr><th>颜色与名称</th><th>原厂色号</th><th>印刻</th><th>用量</th></tr></thead>
        <tbody id="colorList"></tbody>
      </table>
    </div>
  </aside>
</main>

<!-- 颜色黑白名单弹窗 -->
<div id="lockModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>压缩颜色：黑白名单</h3>
      <span class="list-counts">白 <b id="modalWhiteCount">0</b> / 黑 <b id="modalBlackCount">0</b> / 上限 <span id="modalMaxCount">15</span></span>
    </div>
    <div class="modal-note">白名单颜色一定保留；黑名单颜色一定排除。点击色卡上的按钮设置，也可使用图纸预览区吸管取色。</div>
    <div class="modal-picker-row">
      <button id="modalPickWhite" type="button" class="picker-btn whitelist">去图纸吸取白名单</button>
      <button id="modalPickBlack" type="button" class="picker-btn blacklist">去图纸吸取黑名单</button>
      <button id="clearColorLists" type="button">清空名单</button>
    </div>
    <div class="modal-body">
      <div id="modalColorGrid" class="color-grid"></div>
    </div>
    <div class="modal-footer">
      <button id="btnCancelModal">取消</button>
      <button id="btnConfirmModal" class="primary">确认并开始优化</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

    if (paletteCache.has(key)) {
      FULL_PALETTE = buildRuntimePalette(paletteCache.get(key));
      activePaletteKey = key;
      rebuildColorDist();
      $("paletteStatus").textContent = `${cfg.label} (${FULL_PALETTE.length}色)`;
      return FULL_PALETTE;
    }
    
    $("paletteStatus").textContent = `载入中...`;
    await new Promise(r => setTimeout(r, 10)); 
    
    const csv = cfg.csvData;
    if (!csv) throw new Error("色卡数据不存在");
    const rows = parsePaletteCsv(csv, cfg);
    if (!rows.length) throw new Error("色卡数据解析为空");
    
    paletteCache.set(key, rows);
    FULL_PALETTE = buildRuntimePalette(rows);
    activePaletteKey = key;
    rebuildColorDist();
    $("paletteStatus").textContent = `${cfg.label} (${FULL_PALETTE.length}色)`;
    return FULL_PALETTE;
  }

  function rgbToHex({r,g,b}){ return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
  function hexToRgb(h){ const n=parseInt(h.slice(1),16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
  function luma(r,g,b){ return 0.299*r + 0.587*g + 0.114*b; }
  function rgbToLab({r,g,b}){
    let r_ = r/255, g_ = g/255, b_ = b/255;
    r_ = r_>0.04045 ? Math.pow((r_+0.055)/1.055, 2.4) : r_/12.92;
    g_ = g_>0.04045 ? Math.pow((g_+0.055)/1.055, 2.4) : g_/12.92;
    b_ = b_>0.04045 ? Math.pow((b_+0.055)/1.055, 2.4) : b_/12.92;
    let x = (r_*0.4124+g_*0.3576+b_*0.1805)/0.95047, y = (r_*0.2126+g_*0.7152+b_*0.0722)/1.00000, z = (r_*0.0193+g_*0.1192+b_*0.9505)/1.08883;
    x = x>0.008856 ? Math.cbrt(x) : 7.787*x + 16/116; y = y>0.008856 ? Math.cbrt(y) : 7.787*y + 16/116; z = z>0.008856 ? Math.cbrt(z) : 7.787*z + 16/116;
    return { l: 116*y - 16, a: 500*(x-y), b: 200*(y-z) };
  }
  function labChroma(lab){ return Math.sqrt(lab.a*lab.a + lab.b*lab.b); }

  function deltaE94(l1, l2){
    let dL = l1.l - l2.l, c1 = labChroma(l1), c2 = labChroma(l2), dC = c1 - c2;
    let dH_sq = (l1.a - l2.a)**2 + (l1.b - l2.b)**2 - dC*dC; let dH = dH_sq > 0 ? Math.sqrt(dH_sq) : 0;
    return Math.sqrt(dL*dL + (dC/(1+0.045*c1))**2 + (dH/(1+0.015*c1))**2);
  }

  function deltaE94Sym(l1, l2){
    let dL = l1.l - l2.l, c1 = labChroma(l1), c2 = labChroma(l2), cBar = (c1 + c2) * 0.5, dC = c1 - c2;
    let dH_sq = (l1.a - l2.a)**2 + (l1.b - l2.b)**2 - dC*dC; let dH = dH_sq > 0 ? Math.sqrt(dH_sq) : 0;
    return Math.sqrt(dL*dL + (dC/(1+0.045*cBar))**2 + (dH/(1+0.015*cBar))**2);
  }

  function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),3000); }


  const PROJECT_VERSION = 2;
  const COMPACT_PROJECT_MAGIC = "PBD2";

  function writeVarUint(out, value) {
    value = Number(value) >>> 0;
    while (value >= 0x80) { out.push((value & 0x7f) | 0x80); value >>>= 7; }
    out.push(value);
  }

  function readVarUint(bytes, state) {
    let value = 0, shift = 0;
    while (state.i < bytes.length) {
      const b = bytes[state.i++];
      value |= (b & 0x7f) << shift;
      if (!(b & 0x80)) return value >>> 0;
      shift += 7;
      if (shift > 28) throw new Error("图纸压缩数据损坏");
    }
    throw new Error("图纸压缩数据不完整");
  }

  function bytesToBase64(bytes) {
    let binary = "";
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
    return btoa(binary);
  }

  function base64ToBytes(text) {
    const binary = atob(text);
    const out = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
    return out;
  }

  function encodeCellsRle(cells) {
    const out = [];
    for (let i = 0; i < cells.length;) {
      const value = cells[i];
      let count = 1;
      while (i + count < cells.length && cells[i + count] === value) count++;
      writeVarUint(out, value); writeVarUint(out, count); i += count;
    }
    return bytesToBase64(Uint8Array.from(out));
  }

  function decodeCellsRle(text, expectedLength) {
    const bytes = base64ToBytes(text), state = { i: 0 }, cells = new Array(expectedLength);
    let pos = 0;
    while (state.i < bytes.length && pos < expectedLength) {
      const value = readVarUint(bytes, state), count = readVarUint(bytes, state);
      if (!count || pos + count > expectedLength) throw new Error("图纸格点压缩数据无效");
      cells.fill(value, pos, pos + count); pos += count;
    }
    if (pos !== expectedLength || state.i !== bytes.length) throw new Error("图纸格点数量不匹配");
    return cells;
  }

  function buildCompactProjectPayload() {
    if (!result) throw new Error("当前没有可导出的图纸");
    const usedGlobal = Array.from(new Set(result.cells)).sort((a,b) => a-b);
    const globalToLocal = new Map(usedGlobal.map((idx, local) => [idx, local]));
    const localCells = result.cells.map(idx => globalToLocal.get(idx));
    const colors = usedGlobal.map(idx => {
      const c = FULL_PALETTE[idx];
      return [c.code, c.rawCode || c.code, c.name, c.rgb.r, c.rgb.g, c.rgb.b, c.brand || "", c.symbol || ""];
    });
    const localIndex = idx => globalToLocal.has(idx) ? globalToLocal.get(idx) : null;
    return {
      f: COMPACT_PROJECT_MAGIC, v: PROJECT_VERSION,
      w: result.w, h: result.h, b: Number($("sectionSize").value) || 29,
      p: { k: $("paletteType").value, l: PALETTE_CATALOG[$("paletteType").value]?.label || "自定义色卡", c: colors },
      a: [Number($("gridWidth").value), Number($("couplingJ").value), Number($("edgeGamma").value), Number($("curvatureK").value), Number($("maxColorsLimit").value)],
      l: {
        w: Array.from(currentWhitelist).map(localIndex).filter(Number.isInteger),
        b: Array.from(currentBlacklist).map(localIndex).filter(Number.isInteger)
      },
      d: encodeCellsRle(localCells), t: Date.now()
    };
  }

  function downloadText(text, filename, mime = "application/json") {
    const blob = new Blob([text], { type: `${mime};charset=utf-8` });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function normalizeProjectPayload(data) {
    if (data?.f === COMPACT_PROJECT_MAGIC) {
      if (Number(data.v) > PROJECT_VERSION) throw new Error("图纸文件版本过新，请升级生成器");
      const w = Number(data.w), h = Number(data.h);
      if (!Number.isInteger(w) || !Number.isInteger(h) || w < 1 || h < 1) throw new Error("图纸尺寸无效");
      if (!Array.isArray(data.p?.c) || !data.p.c.length || typeof data.d !== "string") throw new Error("图纸缺少色卡或格点数据");
      const colors = data.p.c.map(row => ({
        code: String(row[0] || ""), rawCode: String(row[1] || row[0] || ""), name: String(row[2] || row[0] || "未命名"),
        rgb: { r:Number(row[3]), g:Number(row[4]), b:Number(row[5]) }, brand: String(row[6] || ""), symbol: String(row[7] || "")
      }));
      colors.forEach(c => { if (![c.rgb.r,c.rgb.g,c.rgb.b].every(Number.isFinite)) throw new Error("色卡 RGB 数据无效"); c.hex = rgbToHex(c.rgb); });
      const cells = decodeCellsRle(data.d, w * h);
      if (cells.some(v => v < 0 || v >= colors.length)) throw new Error("格点数组包含无效色卡索引");
      const a = Array.isArray(data.a) ? data.a : [];
      return { w, h, cells, paletteKey:data.p.k, paletteLabel:data.p.l, colors, sectionSize:data.b,
        params:{gridWidth:a[0], couplingJ:a[1], edgeGamma:a[2], curvatureK:a[3], maxColorsLimit:a[4]},
        whitelist:data.l?.w || [], blacklist:data.l?.b || [] };
    }

    throw new Error("仅支持 compact v2 图纸文件（PBD2）");
  }

  function rebuildImportedSimulationState(w, h, cells) {
    const N = w * h, numStates = FULL_PALETTE.length, topKCount = Math.min(TOP_K_COUNT, numStates);
    const E_data = new Float32Array(N * numStates), topK = new Int32Array(N * topKCount);
    for (let p = 0; p < N; p++) {
      const observedLab = FULL_PALETTE[cells[p]].lab, dists = new Array(numStates);
      for (let k = 0; k < numStates; k++) {
        const e = deltaE94(observedLab, FULL_PALETTE[k].lab);
        E_data[p * numStates + k] = e; dists[k] = { k, e };
      }
      dists.sort((a,b) => a.e - b.e);
      for (let i = 0; i < topKCount; i++) topK[p * topKCount + i] = dists[i].k;
    }
    const W_right = new Float32Array(N), W_bottom = new Float32Array(N), W_dr = new Float32Array(N), W_dl = new Float32Array(N);
    const gamma = Math.max(0.1, (110 - Number($("edgeGamma").value)) * 0.1), edgeWeight = de => 1 / (1 + Math.exp((de - 8) / gamma));
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const p = y*w+x, lab = FULL_PALETTE[cells[p]].lab;
      if (x < w-1) W_right[p] = edgeWeight(deltaE94Sym(lab, FULL_PALETTE[cells[p+1]].lab));
      if (y < h-1) W_bottom[p] = edgeWeight(deltaE94Sym(lab, FULL_PALETTE[cells[p+w]].lab));
      if (x < w-1 && y < h-1) W_dr[p] = edgeWeight(deltaE94Sym(lab, FULL_PALETTE[cells[p+w+1]].lab));
      if (x > 0 && y < h-1) W_dl[p] = edgeWeight(deltaE94Sym(lab, FULL_PALETTE[cells[p+w-1]].lab));
    }
    simState = { w, h, labels:Int32Array.from(cells), E_data, topK, topKCount, W_right, W_bottom, W_dr, W_dl, temp:0, iter:0, maxIter:0 };
  }

  let simState = {};
  const TOP_K_COUNT = 7; 

  function setupPhysicalSystem() {
    const gw = Number($("gridWidth").value), gh = Math.max(1, Math.round(gw / (img.width/img.height))), N = gw * gh;
    const tcv = document.createElement("canvas"); tcv.width = gw; tcv.height = gh;
    const tctx = tcv.getContext("2d", { willReadFrequently: true }); 
    tctx.fillStyle = "#ffffff"; tctx.fillRect(0, 0, gw, gh); 
    tctx.drawImage(img, 0, 0, gw, gh);
    const srcData = tctx.getImageData(0,0,gw,gh).data;

    let obsField = new Array(N);
    for (let i = 0; i < N; i++) {
        let pr = srcData[i*4], pg = srcData[i*4+1], pb = srcData[i*4+2];
        if (srcData[i*4+3] < 128) { pr = 255; pg = 255; pb = 255; }
        obsField[i] = rgbToLab({r: pr, g: pg, b: pb});
    }

    const numStates = FULL_PALETTE.length;
    const topKCount = Math.min(TOP_K_COUNT, numStates);
    const E_data = new Float32Array(N * numStates);
    const topK = new Int32Array(N * topKCount); 

    for(let p=0; p<N; p++) {
        let dists = [];
        for(let k=0; k<numStates; k++) {
            let e = deltaE94(obsField[p], FULL_PALETTE[k].lab);
            E_data[p*numStates + k] = e;
            dists.push({k: k, e: e});
        }
        dists.sort((a,b) => a.e - b.e);
        for(let i=0; i<topKCount; i++) topK[p*topKCount + i] = dists[i].k;
    }

    const W_right = new Float32Array(N);
    const W_bottom = new Float32Array(N);
    const W_dr = new Float32Array(N);
    const W_dl = new Float32Array(N);

    let gamma = (110 - Number($("edgeGamma").value)) * 0.1;
    let baseShift = 8;

    function edgeWeight(de) {
      return 1.0 / (1.0 + Math.exp((de - baseShift) / gamma));
    }

    for (let y = 0; y < gh; y++) {
      for (let x = 0; x < gw; x++) {
        let p = y * gw + x;
        if (x < gw - 1) W_right[p] = edgeWeight(deltaE94Sym(obsField[p], obsField[p + 1]));
        if (y < gh - 1) W_bottom[p] = edgeWeight(deltaE94Sym(obsField[p], obsField[p + gw]));
        if (x < gw - 1 && y < gh - 1) W_dr[p] = edgeWeight(deltaE94Sym(obsField[p], obsField[p + gw + 1]));
        if (x > 0 && y < gh - 1) W_dl[p] = edgeWeight(deltaE94Sym(obsField[p], obsField[p + gw - 1]));
      }
    }

    let labels = new Int32Array(N);
    for(let p=0; p<N; p++) labels[p] = topK[p*topKCount]; 

    simState = {
        w: gw, h: gh, labels: labels, E_data: E_data, topK: topK, topKCount: topKCount,
        W_right: W_right, W_bottom: W_bottom, W_dr: W_dr, W_dl: W_dl,
        temp: 4.0, iter: 0, maxIter: 250 
    };

    $("statGrid").textContent = `${gw}×${gh}`;
    $("statBeads").textContent = N;
    $("statColors").textContent = new Set(labels).size;

    isAnimating = true;
    $("statusText").textContent = "计算智能平滑...";
    lastFrameTime = performance.now();
    animFrame = requestAnimationFrame(animationLoop);
  }

  function animationLoop(timestamp) {
    if(!isAnimating) return;
    animFrame = requestAnimationFrame(animationLoop);
    if (timestamp - lastFrameTime >= fpsInterval) {
        lastFrameTime = timestamp - ((timestamp - lastFrameTime) % fpsInterval);
        let changed = 0, totalEnergy = 0;
        for(let step=0; step<2; step++) { let res = simulationStep(); changed += res.c; totalEnergy = res.e; }
        updateUIAfterStep(changed, totalEnergy);
    }
  }

  function simulationStep() {
    let s = simState; s.temp *= 0.987;
    let J = Number($("couplingJ").value) * 0.5;
    let J_diag = J * 0.707;
    let K_curve = Number($("curvatureK").value) * 0.5; 
    
    let changed = 0, totalEnergy = 0;
    let candidateArr = new Int32Array(1 + s.topKCount + 8); 
    const numStates = FULL_PALETTE.length;

    for(let phase = 0; phase < 4; phase++) {
        for(let y=0; y<s.h; y++) {
            for(let x=0; x<s.w; x++) {
                const cellPhase = 2 * (x & 1) + (y & 1);
                if (cellPhase !== phase) continue;
                let p = y*s.w + x, cCount = 0;
                
                let pushC = (k) => { for(let i=0; i<cCount; i++) if(candidateArr[i]===k) return; candidateArr[cCount++]=k; };
                pushC(s.labels[p]);
                for(let i=0; i<s.topKCount; i++) pushC(s.topK[p*s.topKCount + i]); 
                
                if(x>0) pushC(s.labels[p-1]); if(x<s.w-1) pushC(s.labels[p+1]);
                if(y>0) pushC(s.labels[p-s.w]); if(y<s.h-1) pushC(s.labels[p+s.w]);
                if(x>0 && y>0) pushC(s.labels[p-s.w-1]); if(x<s.w-1 && y<s.h-1) pushC(s.labels[p+s.w+1]);
                if(x<s.w-1 && y>0) pushC(s.labels[p-s.w+1]); if(x>0 && y<s.h-1) pushC(s.labels[p+s.w-1]);

                let minH = Infinity, bestK = s.labels[p];
                let P = new Float32Array(cCount), H_all = new Float32Array(cCount);

                for(let i=0; i<cCount; i++) {
                    let k = candidateArr[i];
                    let H = s.E_data[p * numStates + k]; 
                    let exactSameNeighbors = 0;

                    let getPenalty = (neighborLabel) => {
                        if(k === neighborLabel) exactSameNeighbors++;
                        return COLOR_DIST[k * numStates + neighborLabel];
                    };

                    if (x > 0) H += J * s.W_right[p-1] * getPenalty(s.labels[p-1]);
                    if (x < s.w-1) H += J * s.W_right[p] * getPenalty(s.labels[p+1]);
                    if (y > 0) H += J * s.W_bottom[p-s.w] * getPenalty(s.labels[p-s.w]);
                    if (y < s.h-1) H += J * s.W_bottom[p] * getPenalty(s.labels[p+s.w]);
                    
                    if (x > 0 && y > 0) H += J_diag * s.W_dr[p-s.w-1] * getPenalty(s.labels[p-s.w-1]);
                    if (x < s.w-1 && y < s.h-1) H += J_diag * s.W_dr[p] * getPenalty(s.labels[p+s.w+1]);
                    if (x < s.w-1 && y > 0) H += J_diag * s.W_dl[p-s.w+1] * getPenalty(s.labels[p-s.w+1]);
                    if (x > 0 && y < s.h-1) H += J_diag * s.W_dl[p] * getPenalty(s.labels[p+s.w-1]);

                    if (exactSameNeighbors <= 1) H += K_curve * 1.5;
                    else if (exactSameNeighbors == 2) H += K_curve * 0.5;

                    H_all[i] = H;
                    if (H < minH) minH = H;
                }

                totalEnergy += minH;

                if (s.temp > 0.2) {
                    let sumP = 0;
                    for(let i=0; i<cCount; i++) { P[i] = Math.exp(-(H_all[i] - minH) / s.temp); sumP += P[i]; }
                    let r = Math.random() * sumP, cum = 0;
                    for(let i=0; i<cCount; i++) { cum += P[i]; if (r <= cum) { bestK = candidateArr[i]; break; } }
                } else {
                    for(let i=0; i<cCount; i++) if (H_all[i] === minH) { bestK = candidateArr[i]; break; }
                }

                if (bestK !== s.labels[p]) changed++;
                s.labels[p] = bestK;
            }
        }
    }
    s.iter++; return { c: changed, e: totalEnergy };
  }

  function updateUIAfterStep(changed, totalEnergy) {
    let s = simState;
    let progressPct = Math.min(100, Math.round((s.iter / s.maxIter) * 100));
    $("statTemp").textContent = `${progressPct} %`;
    $("statEnergy").textContent = (totalEnergy / 1000).toFixed(1);
    $("progressFill").style.width = `${progressPct}%`;
    $("statColors").textContent = new Set(s.labels).size;

    renderCurrentState();

    if(s.iter >= s.maxIter || (changed === 0 && s.temp < 0.2)) {
        isAnimating = false;
        $("statTemp").textContent = `100 %`;
        $("statusBadge").className = "status-badge done"; 
        $("statusText").textContent = "计算完成";
        $("progressFill").style.width = "100%";
        $("generate").disabled = false; 
        $("exportFull").disabled = false; $("exportRegions").disabled = false; $("exportProject").disabled = false;
        $("btnOpenLockModal").disabled = false;
        historyStack = []; // 每次大生成完成，清空重做历史
        toast("✨ 图纸生成完毕！点击右侧颜色可手动涂抹修改。");
        finalizeResult();
    }
  }

  const CW = 24; 

  function renderCurrentState() {
    let s = simState; 
    const previewCw = 14; 
    sheet.width = s.w * previewCw; sheet.height = s.h * previewCw;
    sctx.fillStyle="#fff"; sctx.fillRect(0,0,sheet.width,sheet.height);
    for(let y=0; y<s.h; y++){
      for(let x=0; x<s.w; x++){
        sctx.fillStyle = FULL_PALETTE[s.labels[y*s.w+x]].hex; 
        sctx.fillRect(x*previewCw, y*previewCw, previewCw, previewCw);
      }
    }
    zoomUpdate();
  }

  function drawSingleCell(x, y, paletteObj) {
    let px = x * CW, py = y * CW;
    sctx.fillStyle = paletteObj.hex; 
    sctx.fillRect(px, py, CW, CW);
    
    let isBg = (paletteObj.code === result.bgCode && luma(paletteObj.rgb.r, paletteObj.rgb.g, paletteObj.rgb.b) > 180);
    let fontColor = luma(paletteObj.rgb.r, paletteObj.rgb.g, paletteObj.rgb.b) < 130 ? "#ffffff" : "#0f172a";
    
    sctx.fillStyle = isBg ? "rgba(0,0,0,0.03)" : fontColor;
    sctx.font = "bold 13px var(--sans)"; sctx.textAlign="center"; sctx.textBaseline="middle";
    
    if (!isBg) {
        sctx.strokeStyle = fontColor === "#ffffff" ? "rgba(0,0,0,0.4)" : "rgba(255,255,255,0.7)";
        sctx.lineWidth = 2.5; sctx.lineJoin = "round";
        sctx.strokeText(paletteObj.symbol, px+CW/2, py+CW/2+1);
    }
    sctx.fillText(paletteObj.symbol, px+CW/2, py+CW/2+1);
  }

  function renderFullGridLines() {
    sctx.strokeStyle = "rgba(0,0,0,0.06)"; sctx.lineWidth=1; sctx.beginPath();
    for(let x=0;x<=result.w;x++){sctx.moveTo(x*CW,0);sctx.lineTo(x*CW,sheet.height);}
    for(let y=0;y<=result.h;y++){sctx.moveTo(0,y*CW);sctx.lineTo(sheet.width,y*CW);} sctx.stroke();

    sctx.strokeStyle = "rgba(0,0,0,0.2)"; sctx.setLineDash([4, 4]); sctx.lineWidth=1.5; sctx.beginPath();
    for(let x=0;x<=result.w;x+=5){sctx.moveTo(x*CW,0);sctx.lineTo(x*CW,sheet.height);}
    for(let y=0;y<=result.h;y+=5){sctx.moveTo(0,y*CW);sctx.lineTo(sheet.width,y*CW);} sctx.stroke(); sctx.setLineDash([]); 

    const bs = Number($("sectionSize").value) || 29;
    sctx.strokeStyle = "rgba(0,0,0,0.6)"; sctx.lineWidth=2.5; sctx.beginPath();
    for(let x=0;x<=result.w;x+=bs){sctx.moveTo(x*CW,0);sctx.lineTo(x*CW,sheet.height);}
    for(let y=0;y<=result.h;y+=bs){sctx.moveTo(0,y*CW);sctx.lineTo(sheet.width,y*CW);} sctx.stroke(); 
  }

  function getColorCounts(cells) {
    let counts = {};
    cells.forEach(idx => counts[idx] = (counts[idx] || 0) + 1);
    return counts;
  }

  function getFinalUsedColors(cells) {
    const counts = getColorCounts(cells);
    return Object.entries(counts)
      .map(([idx, count]) => ({...FULL_PALETTE[Number(idx)], count}))
      .sort((a, b) => b.count - a.count);
  }

  function renderFinalResultGrid() {
    if(!result) return;
    sheet.width = result.w * CW; sheet.height = result.h * CW;
    sctx.fillStyle="#fff"; sctx.fillRect(0,0,sheet.width,sheet.height);
    
    const finalUsed = getFinalUsedColors(result.cells);
    result.bgCode = finalUsed.length > 0 ? finalUsed[0].code : null;

    for(let y=0; y<result.h; y++){
      for(let x=0; x<result.w; x++){
        drawSingleCell(x, y, FULL_PALETTE[result.cells[y*result.w+x]]);
      }
    }
    renderFullGridLines();
    updateColorTable();
    zoomUpdate();
  }

  function finalizeResult() {
    let s = simState;
    result = { w: s.w, h: s.h, cells: Array.from(s.labels) };
    
    const finalUsed = getFinalUsedColors(result.cells);
    $("maxColorsLimit").value = Math.max(1, finalUsed.length);
    $("phase2Box").style.display = "block";
    
    renderFinalResultGrid();
  }

  // ==== 第二阶段：白名单、黑名单与图纸取色器 ====
  let currentWhitelist = new Set();
  let currentBlacklist = new Set();
  let currentModalTargetK = 0;

  function colorCodes(setObj) {

  function confirmListTransfer(idx, target) {
    const color = FULL_PALETTE[idx];
    const code = color?.code || "该颜色";

  function setListMembership(idx, target) {
    if (target === "white") {
      if (currentWhitelist.has(idx)) {

      } else {
        if (currentWhitelist.size >= currentModalTargetK) {
          toast(`白名单最多可选择 ${currentModalTargetK} 种颜色`);
          return;
        }
        if (currentBlacklist.has(idx) && !confirmListTransfer(idx, "white")) return;
        currentBlacklist.delete(idx);
        currentWhitelist.add(idx);
      }
    } else {
      if (currentBlacklist.has(idx)) {
        currentBlacklist.delete(idx);
      } else {
        if (currentWhitelist.has(idx) && !confirmListTransfer(idx, "black")) return;
        currentWhitelist.delete(idx);
        currentBlacklist.add(idx);
      }

        <div class="chip-actions"><button type="button" class="${currentWhitelist.has(c.idx) ? 'is-white' : ''}">白名单</button><button type="button" class="${currentBlacklist.has(c.idx) ? 'is-black' : ''}">黑名单</button></div>`;
      const buttons = div.querySelectorAll("button");

    pickerMode = pickerMode === mode ? null : mode;

  $("pickWhitelist").onclick = () => startPicker("white");
  $("pickBlacklist").onclick = () => startPicker("black");
  $("modalPickWhite").onclick = () => startPicker("white");
  $("modalPickBlack").onclick = () => startPicker("black");
  $("clearColorLists").onclick = () => {

  };

  $("btnOpenLockModal").onclick = () => {
    if (!result) return;
    const targetColorCount = parseInt($("maxColorsLimit").value, 10);
    if (!Number.isFinite(targetColorCount) || targetColorCount < 1) return;
    const finalUsed = getFinalUsedColors(result.cells);

  $("btnCancelModal").onclick = () => { $("lockModal").classList.remove("show"); pickerMode = null; updateListSummary(); };

  // 通过聚类挑选兼具频次与色系覆盖度的代表色；黑名单从候选池彻底排除
  function selectRepresentativeColors(usedColorCounts, K, fullPalette, whitelist, blacklist) {
    const eligibleUsed = usedColorCounts.filter(c => !blacklist.has(c.idx));
    if (whitelist.size > K) throw new Error(`白名单数量 ${whitelist.size} 超过保留上限 ${K}`);
    if (!eligibleUsed.length) throw new Error("黑名单排除了全部已用颜色");

    const points = eligibleUsed.map(c => ({ idx:c.idx, lab:fullPalette[c.idx].lab, weight:Math.sqrt(c.count) }));
    const centers = [];
    const protectedIndices = new Set();

    for (const idx of whitelist) {
      if (blacklist.has(idx)) continue;
      const pt = points.find(p => p.idx === idx) || { idx, lab:fullPalette[idx].lab, weight:1 };
      centers.push({...pt.lab}); protectedIndices.add(idx);
    }
    if (!centers.length) {
      points.sort((a,b) => b.weight-a.weight);
      centers.push({...points[0].lab}); protectedIndices.add(points[0].idx);
    }

    const target = Math.min(K, fullPalette.length - blacklist.size);
    while (centers.length < target) {
      let bestPoint = null, maxScore = -1;
      for (const pt of points) {
        if (protectedIndices.has(pt.idx)) continue;
        let minDist = Infinity;
        for (const c of centers) minDist = Math.min(minDist, deltaE94Sym(pt.lab, c));
        const score = pt.weight * minDist * minDist;
        if (score > maxScore) { maxScore = score; bestPoint = pt; }
      }
      if (!bestPoint) break;
      centers.push({...bestPoint.lab}); protectedIndices.add(bestPoint.idx);
    }

    for (let iter=0; iter<10; iter++) {
      const clusters = Array.from({length:centers.length}, () => ({l:0,a:0,b:0,w:0}));
      for (const pt of points) {
        let best=0, minD=Infinity;
        centers.forEach((c,k) => { const d=deltaE94Sym(pt.lab,c); if(d<minD){minD=d;best=k;} });
        const cl=clusters[best]; cl.l+=pt.lab.l*pt.weight; cl.a+=pt.lab.a*pt.weight; cl.b+=pt.lab.b*pt.weight; cl.w+=pt.weight;
      }
      clusters.forEach((cl,k) => { if(cl.w){centers[k]={l:cl.l/cl.w,a:cl.a/cl.w,b:cl.b/cl.w};} });
    }

    const selected = new Set();
    for (const idx of whitelist) if (!blacklist.has(idx) && selected.size < target) selected.add(idx);
    for (const center of centers) {
      if (selected.size >= target) break;
      let bestIdx=-1, minD=Infinity;
      for (let i=0;i<fullPalette.length;i++) {
        if (selected.has(i) || blacklist.has(i)) continue;
        const d=deltaE94Sym(center, fullPalette[i].lab);
        if(d<minD){minD=d;bestIdx=i;}
      }
      if(bestIdx!==-1) selected.add(bestIdx);
    }
    return Array.from(selected);
  }

  $("btnConfirmModal").onclick = () => {
    $("lockModal").classList.remove("show"); pickerMode = null; updateListSummary();
    if (!result) return;
    const targetColorCount = currentModalTargetK;
    const counts = {};
    result.cells.forEach(idx => counts[idx] = (counts[idx] || 0) + 1);
    const usedData = Object.entries(counts).map(([idx,count]) => ({idx:Number(idx),count}));

    let allowedArr;
    try {
      allowedArr = selectRepresentativeColors(usedData, targetColorCount, FULL_PALETTE, currentWhitelist, currentBlacklist);
    } catch (err) {
      toast(err.message || "黑白名单配置无效"); return;
    }
    if (!allowedArr.length) { toast("没有可用于优化的颜色"); return; }
    const allowedIndices = new Set(allowedArr);
    const N = simState.w * simState.h;
    const newTopKCount = Math.min(TOP_K_COUNT, allowedArr.length);
    const newTopK = new Int32Array(N * newTopKCount);

    for (let p=0;p<N;p++) {
      const dists = allowedArr.map(k => ({k,e:simState.E_data[p * FULL_PALETTE.length + k]})).sort((a,b)=>a.e-b.e);
      for (let i=0;i<newTopKCount;i++) newTopK[p*newTopKCount+i]=dists[i].k;
      if (!allowedIndices.has(simState.labels[p])) simState.labels[p]=dists[0].k;
    }

    simState.topK=newTopK; simState.topKCount=newTopKCount; simState.temp=2.5; simState.iter=0; simState.maxIter=150;
    historyStack=[]; isAnimating=true;
    $("statusBadge").className="status-badge active"; $("statusText").textContent="应用黑白名单并二次优化中...";
    $("progressFill").style.width="0%"; $("generate").disabled=true; $("exportFull").disabled=true; $("exportRegions").disabled=true; $("btnOpenLockModal").disabled=true;
    lastFrameTime=performance.now(); animFrame=requestAnimationFrame(animationLoop);
  };

  function updateColorTable() {
    if(!result) return;
    let finalUsed = getFinalUsedColors(result.cells);
    
    const tbody = $("colorList"); tbody.innerHTML="";
    $("statColors").textContent = finalUsed.length;

    finalUsed.forEach(c => {
      let tr = document.createElement("tr");
      tr.className = "color-row" + (activeBrushIndex === c.idx ? " active" : "");
      tr.innerHTML = `<td><span class="swatch" style="background:${c.hex}"></span>${c.name}</td>
                      <td><span class="kbd">${c.code}</span></td>
                      <td style="font-size:14px;font-weight:700;color:#0f172a">${c.symbol}</td>
                      <td><b style="color:var(--brand); font-size:14px;">${c.count}</b></td>`;
      tr.onclick = () => {
        activeBrushIndex = c.idx;
        updateColorTable(); 
      };
      tbody.appendChild(tr);
    });
  }

  // --- 涂抹与撤销历史记录功能 ---
  function saveStateToHistory() {
    if(!result) return;
    if(historyStack.length >= MAX_HISTORY) historyStack.shift();
    // 深度拷贝当前画布一维数组
    historyStack.push(new Int32Array(result.cells));
  }

  function undoLastAction() {
    if(historyStack.length === 0 || isAnimating) return;
    result.cells = Array.from(historyStack.pop());
    renderFinalResultGrid();
    toast("已撤销上一步操作");
  }

  // 监听 Ctrl+Z 快捷键
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      undoLastAction();
    }
  });

  function handlePaint(e) {
    if(isAnimating || !result || activeBrushIndex === null) return;
    
    const event = e.touches ? e.touches[0] : e;
    const rect = sheet.getBoundingClientRect();
    const scale = Number($("screenZoom").value) / 100;
    
    const x = Math.floor((event.clientX - rect.left) / scale / CW);
    const y = Math.floor((event.clientY - rect.top) / scale / CW);
    
    if(x >= 0 && x < result.w && y >= 0 && y < result.h) {
        let linearIdx = y * result.w + x;
        if(result.cells[linearIdx] !== activeBrushIndex) {
            // 在这一笔画真正产生修改前，保存状态 (只保存一次)
            if(!hasChangedInStroke) {
                saveStateToHistory();
                hasChangedInStroke = true;
            }
            result.cells[linearIdx] = activeBrushIndex;
            drawSingleCell(x, y, FULL_PALETTE[activeBrushIndex]);
            renderFullGridLines(); 
        }
    }
  }

  function pickColorFromSheet(e) {
    if (!pickerMode || !result || isAnimating) return false;
    const event = e.touches ? e.touches[0] : e;
    const rect = sheet.getBoundingClientRect();
    const scale = Number($("screenZoom").value) / 100;
    const x = Math.floor((event.clientX - rect.left) / scale / CW);
    const y = Math.floor((event.clientY - rect.top) / scale / CW);
    if (x < 0 || x >= result.w || y < 0 || y >= result.h) return true;
    const idx = result.cells[y * result.w + x];
    const mode = pickerMode;
    if (mode === "white" && !currentWhitelist.has(idx) && currentWhitelist.size >= currentModalTargetK) {
      toast(`白名单最多可选择 ${currentModalTargetK} 种颜色`); return true;
    }

    const alreadyInTarget = mode === "white" ? currentWhitelist.has(idx) : currentBlacklist.has(idx);
    if (alreadyInTarget) {
      toast(`${FULL_PALETTE[idx].code} 已在${mode === "white" ? "白名单" : "黑名单"}中`);
      return true;
    }

    const hasConflict = mode === "white" ? currentBlacklist.has(idx) : currentWhitelist.has(idx);
    if (hasConflict && !confirmListTransfer(idx, mode)) {
      toast("已取消名单覆盖");
      return true;
    }

    if (mode === "white") {
      currentBlacklist.delete(idx);
      currentWhitelist.add(idx);
    } else {
      currentWhitelist.delete(idx);
      currentBlacklist.add(idx);
    }
    updateListSummary();
    renderListModalGrid();
    toast(`${FULL_PALETTE[idx].code} 已加入${mode === "white" ? "白名单" : "黑名单"}`);
    return true;
  }

  sheet.addEventListener('mousedown', (e) => {
    if (pickColorFromSheet(e)) { e.preventDefault(); return; }
    if(!result || activeBrushIndex === null) {
      if(result && !isAnimating) toast("请先在右侧列表中点击选取一种画笔颜色！");
      return;
    }
    isDrawing = true; 
    hasChangedInStroke = false; 
    handlePaint(e);
  });
  sheet.addEventListener('mousemove', (e) => { if(isDrawing) handlePaint(e); });
  window.addEventListener('mouseup', () => { if(isDrawing) { isDrawing = false; updateColorTable(); } });
  
  sheet.addEventListener('touchstart', (e) => {
    if (pickColorFromSheet(e)) { e.preventDefault(); return; }
    if(!result || activeBrushIndex === null) return;
    e.preventDefault(); 
    isDrawing = true; 
    hasChangedInStroke = false;
    handlePaint(e);
  }, {passive: false});
  sheet.addEventListener('touchmove', (e) => {
    if(isDrawing) { e.preventDefault(); handlePaint(e); }
  }, {passive: false});
  window.addEventListener('touchend', () => {
    if(isDrawing) { isDrawing = false; updateColorTable(); }
  });

  let autoViewMode = null;

  function setZoom(percent, mode = null) {
    const zoom = Math.max(10, Math.min(400, Math.round(percent)));
    $("screenZoom").value = zoom;
    $("screenZoomv").textContent = zoom + "%";
    $("canvasStage").style.transform = `scale(${zoom / 100})`;
    autoViewMode = mode;
    $("fitPanorama").classList.toggle("active", mode === "panorama");
    $("fitLocal").classList.toggle("active", mode === "local");
  }

  function zoomUpdate(){ setZoom(Number($("screenZoom").value), null); }

  function fitPanoramaView() {
    if (!sheet.width || !sheet.height) return;
    const shell = $("canvasShell");
    const availableW = Math.max(1, shell.clientWidth - 40);
    const availableH = Math.max(1, shell.clientHeight - 40);
    const zoom = Math.min(availableW / sheet.width, availableH / sheet.height) * 100;
    setZoom(zoom, "panorama");
    shell.scrollTo({ left: 0, top: 0, behavior: "smooth" });
  }

  function fitLocalView() {
    if (!sheet.width || !sheet.height) return;
    const shell = $("canvasShell");
    const boardSize = Math.max(1, Number($("sectionSize").value) || 29);
    const cellPx = result ? CW : 14;
    const localW = Math.min(sheet.width, boardSize * cellPx);
    const localH = Math.min(sheet.height, boardSize * cellPx);
    const availableW = Math.max(1, shell.clientWidth - 56);
    const availableH = Math.max(1, shell.clientHeight - 56);
    const zoom = Math.min(availableW / localW, availableH / localH) * 100;
    setZoom(zoom, "local");
    shell.scrollTo({ left: 0, top: 0, behavior: "smooth" });
  }

  $("screenZoom").oninput = e => setZoom(Number(e.target.value), null);
  $("fitPanorama").onclick = fitPanoramaView;
  $("fitLocal").onclick = fitLocalView;
  $("sectionSize").addEventListener("change", () => { if (autoViewMode === "local") fitLocalView(); });
  window.addEventListener("resize", () => {
    clearTimeout(window.__beadResizeTimer);
    window.__beadResizeTimer = setTimeout(() => {
      if (autoViewMode === "panorama") fitPanoramaView();
      else if (autoViewMode === "local") fitLocalView();
    }, 120);
  });
  ["couplingJ","edgeGamma","curvatureK"].forEach(id => { 
      $(id).oninput = e => { 
          let val = Number(e.target.value);
          $(id+"v").textContent = (id === "edgeGamma") ? val : val.toFixed(1); 
      }; 
  });

  loadPaletteByKey($("paletteType").value).catch(err => { console.warn("初始色卡加载失败", err); $("paletteStatus").textContent = "加载异常"; });

  function getExportColors(cells) {
    const counts = {};
    cells.forEach(idx => counts[idx] = (counts[idx] || 0) + 1);
    return Object.entries(counts)
      .map(([idx, count]) => ({ ...FULL_PALETTE[Number(idx)], count }))
      .sort((a, b) => b.count - a.count);
  }

  function createExportCanvas(region = null) {
    const x0 = region ? region.x0 : 0;
    const y0 = region ? region.y0 : 0;
    const regionW = region ? region.w : result.w;
    const regionH = region ? region.h : result.h;
    const regionCells = [];
    for(let y = 0; y < regionH; y++) {
      for(let x = 0; x < regionW; x++) {
        regionCells.push(result.cells[(y0 + y) * result.w + (x0 + x)]);
      }
    }
    const finalUsed = getExportColors(regionCells);

    const exportCell = 32, rulerSize = 34, titleHeight = 86, footerHeight = 42;
    const padding = 36, legendWidth = 430, legendRowH = 34, legendHeaderH = 122;
    const boardW = regionW * exportCell, boardH = regionH * exportCell;
    const legendH = legendHeaderH + finalUsed.length * legendRowH + 28;
    const outCV = document.createElement("canvas");
    outCV.width = padding * 3 + rulerSize + boardW + legendWidth;
    outCV.height = Math.max(padding * 2 + titleHeight + rulerSize + boardH + footerHeight, padding * 2 + legendH);
    const ctx = outCV.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, outCV.width, outCV.height);

    const boardX = padding + rulerSize, boardY = padding + titleHeight + rulerSize;
    const activeBrandName = PALETTE_CATALOG[$("paletteType").value].label;
    const sectionSize = Number($("sectionSize").value) || 29;
    const regionName = region ? `区域 ${region.row}-${region.col}` : "全图";

    ctx.fillStyle = "#0f172a"; ctx.font = "700 28px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillText(`拼豆图纸 · ${regionName}`, padding, padding + 30);
    ctx.font = "15px sans-serif"; ctx.fillStyle = "#64748b";
    const scopeText = region ? `全图坐标：列 ${x0 + 1}-${x0 + regionW}，行 ${y0 + 1}-${y0 + regionH}` : `底板 ${sectionSize} × ${sectionSize}`;
    ctx.fillText(`${activeBrandName} ｜ ${regionW} × ${regionH} 格 ｜ ${regionW * regionH} 颗 ｜ ${finalUsed.length} 色 ｜ ${scopeText}`, padding, padding + 58);

    for(let y = 0; y < regionH; y++) for(let x = 0; x < regionW; x++) {
      const c = FULL_PALETTE[result.cells[(y0 + y) * result.w + (x0 + x)]];
      const px = boardX + x * exportCell, py = boardY + y * exportCell;
      ctx.fillStyle = c.hex; ctx.fillRect(px, py, exportCell, exportCell);
      ctx.fillStyle = luma(c.rgb.r, c.rgb.g, c.rgb.b) < 130 ? "#ffffff" : "#0f172a";
      ctx.font = "700 16px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(c.symbol, px + exportCell / 2, py + exportCell / 2 + 1);
    }

    ctx.strokeStyle = "rgba(15,23,42,0.18)"; ctx.lineWidth = 1; ctx.beginPath();
    for(let x = 0; x <= regionW; x++) { const px = boardX + x * exportCell + .5; ctx.moveTo(px, boardY); ctx.lineTo(px, boardY + boardH); }
    for(let y = 0; y <= regionH; y++) { const py = boardY + y * exportCell + .5; ctx.moveTo(boardX, py); ctx.lineTo(boardX + boardW, py); }
    ctx.stroke();

    ctx.strokeStyle = "rgba(15,23,42,0.52)"; ctx.lineWidth = 1.5; ctx.beginPath();
    for(let x = 0; x <= regionW; x++) if((x0 + x) % 5 === 0) { const px = boardX + x * exportCell; ctx.moveTo(px, boardY); ctx.lineTo(px, boardY + boardH); }
    for(let y = 0; y <= regionH; y++) if((y0 + y) % 5 === 0) { const py = boardY + y * exportCell; ctx.moveTo(boardX, py); ctx.lineTo(boardX + boardW, py); }
    ctx.stroke();

    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 3; ctx.strokeRect(boardX, boardY, boardW, boardH);
    if(!region) {
      ctx.beginPath();
      for(let x = 0; x <= regionW; x += sectionSize) { const px = boardX + x * exportCell; ctx.moveTo(px, boardY); ctx.lineTo(px, boardY + boardH); }
      for(let y = 0; y <= regionH; y += sectionSize) { const py = boardY + y * exportCell; ctx.moveTo(boardX, py); ctx.lineTo(boardX + boardW, py); }
      ctx.stroke();
    }

    ctx.textBaseline = "middle";
    for(let x = 0; x < regionW; x++) {
      const n = x0 + x + 1; ctx.font = `${n % 5 === 0 ? "700" : "500"} 12px monospace`;
      ctx.fillStyle = n % 5 === 0 ? "#0f172a" : "#64748b"; ctx.textAlign = "center";
      ctx.fillText(String(n), boardX + x * exportCell + exportCell / 2, boardY - rulerSize / 2);
    }
    for(let y = 0; y < regionH; y++) {
      const n = y0 + y + 1; ctx.font = `${n % 5 === 0 ? "700" : "500"} 12px monospace`;
      ctx.fillStyle = n % 5 === 0 ? "#0f172a" : "#64748b"; ctx.textAlign = "right";
      ctx.fillText(String(n), boardX - 9, boardY + y * exportCell + exportCell / 2);
    }

    const legendX = boardX + boardW + padding; let ly = padding + 28;
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = "#0f172a"; ctx.font = "700 24px sans-serif";
    ctx.fillText("本图所需色号", legendX, ly); ly += 30;
    ctx.font = "14px sans-serif"; ctx.fillStyle = "#64748b"; ctx.fillText("仅统计当前导出范围", legendX, ly); ly += 26;
    ctx.fillStyle = "#f8fafc"; ctx.fillRect(legendX, ly, legendWidth, 30);
    ctx.font = "700 13px sans-serif"; ctx.fillStyle = "#475569"; ctx.fillText("序号", legendX + 8, ly + 20); ctx.fillText("颜色 / 符号 / 色号", legendX + 58, ly + 20);
    ctx.textAlign = "right"; ctx.fillText("数量", legendX + legendWidth - 10, ly + 20); ctx.textAlign = "left"; ly += 30;
    finalUsed.forEach((c, i) => {
      const rowY = ly + i * legendRowH;
      if(i % 2) { ctx.fillStyle = "#f8fafc"; ctx.fillRect(legendX, rowY, legendWidth, legendRowH); }
      ctx.strokeStyle = "#e2e8f0"; ctx.beginPath(); ctx.moveTo(legendX, rowY + legendRowH); ctx.lineTo(legendX + legendWidth, rowY + legendRowH); ctx.stroke();
      ctx.font = "700 13px monospace"; ctx.fillStyle = "#475569"; ctx.fillText(String(i + 1).padStart(2, "0"), legendX + 8, rowY + 22);
      ctx.fillStyle = c.hex; ctx.fillRect(legendX + 58, rowY + 6, 22, 22); ctx.strokeStyle = "#94a3b8"; ctx.strokeRect(legendX + 58, rowY + 6, 22, 22);
      ctx.font = "700 16px sans-serif"; ctx.fillStyle = "#0f172a"; ctx.fillText(c.symbol, legendX + 91, rowY + 22);
      ctx.font = "14px sans-serif"; const displayName = c.name.length > 22 ? c.name.slice(0, 21) + "…" : c.name;
      ctx.fillText(`${c.code}  ${displayName}`, legendX + 120, rowY + 22);
      ctx.font = "700 14px monospace"; ctx.fillStyle = "#4f46e5"; ctx.textAlign = "right"; ctx.fillText(`${c.count} 颗`, legendX + legendWidth - 10, rowY + 22); ctx.textAlign = "left";
    });
    ctx.fillStyle = "#64748b"; ctx.font = "12px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(region ? "说明：编号沿用全图坐标，便于各区域拼接定位。" : "说明：顶部为列号，左侧为行号；粗线表示底板分区。", padding, outCV.height - 18);
    return { canvas: outCV, colors: finalUsed.length };
  }

  function downloadCanvas(canvas, filename) {
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png", 1.0); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }

  $("exportFull").onclick = () => {
    if(!result) return;
    const btn = $("exportFull"), oldText = btn.textContent; btn.disabled = true; btn.textContent = "正在导出全图...";
    try {
      const data = createExportCanvas();
      const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      downloadCanvas(data.canvas, `拼豆图纸_全图_${result.w}x${result.h}_${data.colors}色_${stamp}.png`);
      toast("全图已导出");
    } catch(err) { console.error(err); toast("全图导出失败，请降低格子宽度后重试"); }
    finally { btn.disabled = false; btn.textContent = oldText; }
  };


  $("exportProject").onclick = () => {
    try {
      const payload = buildCompactProjectPayload();
      const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      downloadText(JSON.stringify(payload), `拼豆图纸_${result.w}x${result.h}_${stamp}.pbd`);
      toast("自定义图纸文件已导出");
    } catch (err) {
      console.error(err); toast(err.message || "图纸文件导出失败");
    }
  };

  $("importProject").onchange = async e => {
    const f = e.target.files?.[0];
    if (!f) return;
    try { await importProjectFile(f); }
    catch (err) { console.error(err); toast(err.message || "图纸文件导入失败"); }
    finally { e.target.value = ""; }
  };

  $("exportRegions").onclick = async () => {
    if(!result) return;
    const btn = $("exportRegions"), fullBtn = $("exportFull"), oldText = btn.textContent;
    btn.disabled = true; fullBtn.disabled = true;
    const sectionSize = Number($("sectionSize").value) || 29;
    const cols = Math.ceil(result.w / sectionSize), rows = Math.ceil(result.h / sectionSize);
    const total = cols * rows;
    const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
    try {
      let n = 0;
      for(let row = 1; row <= rows; row++) {
        for(let col = 1; col <= cols; col++) {
          n++; btn.textContent = `导出区域 ${n}/${total}`;
          const x0 = (col - 1) * sectionSize, y0 = (row - 1) * sectionSize;
          const w = Math.min(sectionSize, result.w - x0), h = Math.min(sectionSize, result.h - y0);
          const data = createExportCanvas({ x0, y0, w, h, row, col });
          const regionNo = String(n).padStart(2, "0");
          downloadCanvas(data.canvas, `拼豆图纸_区域${regionNo}_R${row}C${col}_${w}x${h}_${data.colors}色_${stamp}.png`);
          await new Promise(resolve => setTimeout(resolve, 180));
        }
      }
      toast(`已批量导出 ${total} 个区域；如浏览器询问，请允许多个文件下载`);
    } catch(err) { console.error(err); toast("分区域导出失败，请检查浏览器下载权限"); }
    finally { btn.disabled = false; fullBtn.disabled = false; btn.textContent = oldText; }
  };

})();
</script>

</body></html>
