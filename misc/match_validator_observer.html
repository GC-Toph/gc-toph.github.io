<body>
<div class="wrap">
  <div class="card">
    <h1>生活习惯契合度问卷 · 校验与观察者评估</h1>
    <p class="muted small">自评与他评不一致不等于“撒谎”。可能来自自我认知偏差、情境差异或观察样本不足。所有分数的 95% CI 均由同一套随机变量模型传播得到。</p>
  </div>
  <div class="tabs">
    <button id="tabSelf" class="active">① 解析自评结果</button>
    <button id="tabObserver">② 观察者评估</button>
    <button id="tabCompare">③ 自评 × 他评</button>
  </div>

  <section id="selfSection">
    <div class="card">
      <h2>导入受测者结果</h2>
      <p class="muted small">仅支持最终版 3.0.0 问卷生成的结果。</p>
      <div class="field"><label>选择结果文件（.ltmdata / .txt）</label><input id="fileInput" type="file" accept=".ltmdata,.txt,text/plain"></div>
      <div class="field"><label>或粘贴结果文本</label><textarea id="pasteInput" placeholder="把受测者复制给你的结果文本粘贴到这里"></textarea></div>
      <div class="toolbar"><button id="parseBtn">解析结果</button><button id="clearSelf" class="secondary">清除</button></div>
    </div>
    <div id="selfOutput"></div>
  </section>

  <section id="observerSection" class="hidden">
    <div class="card">
      <h2>观察者行为评估</h2>
      <p class="muted">只评价实际观察过的行为。没有足够信息时请选择“无法判断”。观察时长与观察信心会进入观察者评分的不确定性模型。</p>
      <div class="two">
        <div class="field"><label>你与对方实际接触多久？</label><select id="obsDuration"><option value="">请选择</option><option>少于 1 个月</option><option>1–3 个月</option><option>3–6 个月</option><option>6–12 个月</option><option>1 年以上</option></select></div>
        <div class="field"><label>你对自己观察准确性的总体信心</label><select id="obsConfidence"><option value="">请选择</option><option value="1">1 很有限</option><option value="2">2 偏低</option><option value="3">3 一般</option><option value="4">4 较高</option><option value="5">5 很高</option></select></div>
      </div>
      <div id="observerItems"></div>
      <div class="toolbar"><button id="scoreObserver">生成观察者评分</button><button id="resetObserver" class="secondary">清空观察者问卷</button></div>
    </div>
    <div id="observerOutput"></div>
  </section>

  <section id="compareSection" class="hidden">
    <div id="compareOutput" class="card"><h2>自评 × 他评</h2><p class="muted">需要先解析受测者结果，并完成观察者评估。</p></div>
  </section>
</div>
<script>

{id:'h2',label:'是否希望有孩子',opts:['明确希望','比较希望','不确定','比较不希望','明确不要']},
{id:'h3',label:'对关系排他性的要求',opts:['只接受双方排他的单偶关系','倾向单偶，但可以讨论边界','可以接受其他关系模式','不确定']},

];
const scenarioKey={
s1:{a:{anx:2,rel:6},b:{anx:3,rel:7},c:{anx:7,rel:2},d:{anx:5,avo:4,rel:2}},
s2:{a:{anx:6,rel:3},b:{anx:2,avo:1,rel:7},c:{avo:5,rel:3},d:{avo:7,rel:1}},
s3:{a:{avo:1,rel:7},b:{avo:2,rel:6},c:{avo:4,rel:3},d:{avo:6,rel:2}},
s4:{a:{avo:1,rel:6},b:{anx:5,rel:4},c:{avo:5,rel:3},d:{avo:7,rel:2}},
s5:{a:{anx:2,rel:7},b:{anx:7,rel:2},c:{anx:6,rel:1},d:{avo:7,rel:2}}
};

{id:'o01',d:'anx',text:'联系频率下降或回复变慢时，对方会明显反复确认、揣测关系是否发生变化。'},
{id:'o02',d:'anx',text:'我把较多注意力放在其他人或其他事情上时，对方容易把它体验成被冷落或被替代。'},
{id:'o03',d:'anx',text:'冲突尚未解决时，对方很难先做自己的事情，会持续想要立即确认或解决。'},
{id:'o04',d:'avo',text:'对方遇到困难时更常把我挡在外面，倾向独自处理，不太愿意接受支持。'},
{id:'o05',d:'avo',text:'关系明显变得稳定或更亲密后，对方有过降温、后退或重新拉开距离的表现。'},

{id:'o07',d:'rel',text:'对方能够直接说出需要和边界，而不是主要依靠暗示、试探、吃醋或让我猜。'},
{id:'o08',d:'rel',text:'发生冲突时，对方通常不会突然消失、长期冷处理或用分手威胁，而是能回来继续讨论。'},
{id:'o09',d:'rel',text:'如果对方确实做错了事情，通常能够具体承认自己的部分，并采取实际修复。'},
{id:'o10',d:'con',text:'约定时间、重要承诺和已经答应的事情，对方总体上比较可靠。'},

const scoreDefs=[
{id:'con',label:'尽责性',direction:'positive',min:0,max:1,def:0.8},
{id:'agr',label:'宜人性',direction:'positive',min:0,max:1,def:0.5},
{id:'rel',label:'沟通与修复',direction:'positive',min:0,max:1,def:0.75},

{id:'neu',label:'负性情绪敏感',direction:'negative',min:-1,max:0,def:-0.2},

];
const defaultWeights=Object.fromEntries(scoreDefs.map(x=>[x.id,x.def]));

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function sd(a){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)}
function percentile(arr,p){if(!arr.length)return null;const a=[...arr].sort((x,y)=>x-y),i=(a.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return lo===hi?a[lo]:a[lo]+(a[hi]-a[lo])*(i-lo)}
function summary(samples,{clamp01=false,digits=0}={}){const vals=(samples||[]).filter(Number.isFinite);if(!vals.length)return {score:null,ci:null};let med=percentile(vals,.5),lo=percentile(vals,.025),hi=percentile(vals,.975);if(clamp01){med=clamp(med,0,100);lo=clamp(lo,0,100);hi=clamp(hi,0,100)}const f=x=>Number(x.toFixed(digits));return {score:f(med),ci:[f(lo),f(hi)]}}
function formatCI(ci,digits=0){if(!ci)return '95% CI —';return `95% CI ${Number(ci[0]).toFixed(digits)}–${Number(ci[1]).toFixed(digits)}`}
function to100Likert(v){return (v-1)/6*100}
function hashString(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function makeNormal(rng){let spare=null;return function(){if(spare!==null){const z=spare;spare=null;return z}let u,v,s;do{u=rng()*2-1;v=rng()*2-1;s=u*u+v*v}while(s===0||s>=1);const m=Math.sqrt(-2*Math.log(s)/s);spare=v*m;return u*m}}
function sampleLikert(r,sigma,z){return clamp(Number(r)+sigma*z(),1,7)}
function utf8FromB64(b64){const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
function parseEncoded(text){
  text=(text||'').trim();
  if(!text.startsWith('LTM3:'))throw new Error('结果格式不匹配。请使用最终版 3.0.0 问卷重新导出。');
  const obj=JSON.parse(utf8FromB64(text.slice(5).replace(/\s+/g,'')));
  if(obj.schema!==SCHEMA||obj.version!==VERSION)throw new Error('仅支持最终版 3.0.0 结果，不兼容旧版本数据。');
  validatePayload(obj);
  return obj;
}
function validatePayload(obj){
  for(let n=1;n<=35;n++){const id='q'+String(n).padStart(2,'0'),v=Number(obj.answers?.[id]);if(!Number.isFinite(v)||v<1||v>7)throw new Error(`结果缺少或损坏：${id}`)}
  for(let n=1;n<=5;n++){const id='s'+n,opt=obj.scenarios?.[id];if(!scenarioKey[id]?.[opt])throw new Error(`结果缺少或损坏：${id}`)}
  for(let n=1;n<=11;n++){const id='v'+n,x=obj.values?.[id],s=Number(x?.stance),imp=Number(x?.importance);if(!Number.isFinite(s)||s<1||s>7||!Number.isFinite(imp)||imp<0||imp>3)throw new Error(`结果缺少或损坏：${id}`)}
  for(const h of hardDefs){if(!obj.hard?.[h.id]||!h.opts.includes(obj.hard[h.id]))throw new Error(`结果缺少或损坏：${h.id}`)}
  if(!Number.isFinite(Number(obj.durationSec))||Number(obj.durationSec)<=0)throw new Error('结果缺少有效作答时间。');
}
function durationPenalty(sec){
  const m=Number(sec)/60;
  if(m<6)return clamp((6-m)*3,0,18);
  if(m<=15)return 0;
  return 5;
}
function entropyFromLikert(vals){
  const sm=vals.map(v=>v+1),total=sm.reduce((a,b)=>a+b,0),p=sm.map(v=>v/total);
  return 100*(-p.reduce((s,x)=>s+x*Math.log(x),0))/Math.log(vals.length);
}
function interp(score){if(score==null)return '数据不足';if(score<33)return '较低';if(score<67)return '中等';return '较高'}
function qualityLabel(q){return q>=85?'较高':q>=65?'可用，但应结合细项':q>=45?'偏低，谨慎解释':'很低，不建议据此做重要判断'}
function barHtml(score,ci){
  if(score==null)return '<div class="metricBar"><div class="track"></div></div>';
  const s=clamp(Number(score),0,100),lo=clamp(Number(ci?.[0]??s),0,100),hi=clamp(Number(ci?.[1]??s),0,100);
  const left=Math.min(lo,hi),right=Math.max(lo,hi),width=Math.max(.45,right-left);
  return `<div class="metricBar" aria-label="点估计 ${s}，95% CI ${left} 到 ${right}"><div class="track"><div class="fill" style="width:${s}%"></div></div><div class="ciBracket" style="left:${left}%;width:${width}%"></div><div class="point" style="left:${s}%"></div></div>`;
}
function metricCard(name,score,ci,note){return `<div class="metric"><span>${esc(name)}</span><strong>${score==null?'—':score}</strong><span class="ci">${formatCI(ci)}</span>${barHtml(score,ci)}<div class="muted small">${note||''}</div></div>`}

function analyzeSelf(data){
  const dims=Object.fromEntries(Object.keys(dimLabels).map(d=>[d,[]]));
  const life=Object.fromEntries(lifeDefs.map(x=>[x.d,[]]));
  const quality=[],consistency=[],lifeBalance=[];
  const penalties={attention:[],impression:[],pairs:[],straight:[],time:[],scenario:[]};
  const seed=hashString(JSON.stringify({answers:data.answers,scenarios:data.scenarios,durationSec:data.durationSec,version:data.version}));
  const rng=mulberry32(seed),z=makeNormal(rng);
  const timeP=durationPenalty(data.durationSec);
  const dimItemDefs=Object.fromEntries(Object.keys(dimLabels).map(d=>[d,Object.entries(selfKey).filter(([,k])=>k.d===d)]));
  const normalIds=Array.from({length:34},(_,i)=>'q'+String(i+1).padStart(2,'0'));
  for(let k=0;k<MC_N;k++){
    const y={};
    for(const id of normalIds)y[id]=sampleLikert(data.answers[id],SELF_SIGMA,z);
    const dimLikert={};
    for(const d of Object.keys(dimLabels)){
      const vals=dimItemDefs[d].map(([id,def])=>def.rev?8-y[id]:y[id]);
      dimLikert[d]=mean(vals);
      dims[d].push(to100Likert(dimLikert[d]));
    }
    const lv=lifeDefs.map(x=>y[x.id]);
    for(const x of lifeDefs)life[x.d].push(to100Likert(y[x.id]));
    lifeBalance.push(entropyFromLikert(lv));

    const pairComponents=[];
    let pairP=0;
    for(const [a,b] of pairDefs){
      const diff=Math.abs(y[a]-(8-y[b]));
      pairComponents.push(clamp(100-diff/6*100,0,100));
      if(diff>=4)pairP+=8;
    }
    consistency.push(mean(pairComponents));

    const attentionP=Number(data.answers.q35)===2?0:28;
    const impressionP=(y.q33>=5.5?10:0)+(y.q34>=5.5?10:0);
    const straightP=sd(normalIds.slice(0,34).map(id=>y[id]))<0.5?15:0;

    const scenBag={anx:[],avo:[],rel:[]};
    for(const [sid,opt] of Object.entries(data.scenarios)){
      const map=scenarioKey[sid][opt];
      for(const [d,v] of Object.entries(map))scenBag[d].push(sampleLikert(v,SELF_SIGMA,z));
    }
    let scenarioP=0;
    for(const d of ['anx','avo','rel']){
      const sv=mean(scenBag[d]);
      if(sv!=null&&Math.abs(sv-dimLikert[d])>=2.2)scenarioP+=7;
    }
    const q=clamp(100-attentionP-impressionP-pairP-straightP-timeP-scenarioP,0,100);
    quality.push(q);
    penalties.attention.push(attentionP);
    penalties.impression.push(impressionP);
    penalties.pairs.push(pairP);
    penalties.straight.push(straightP);
    penalties.time.push(timeP);
    penalties.scenario.push(scenarioP);
  }
  const summaries={dims:{},life:{},quality:summary(quality,{clamp01:true}),consistency:summary(consistency,{clamp01:true}),lifeBalance:summary(lifeBalance,{clamp01:true}),penalties:{}};
  for(const d of Object.keys(dimLabels))summaries.dims[d]=summary(dims[d],{clamp01:true});
  for(const x of lifeDefs)summaries.life[x.d]=summary(life[x.d],{clamp01:true});
  for(const [k,v] of Object.entries(penalties))summaries.penalties[k]=summary(v,{digits:1});
  const flags=[];
  if(Number(data.answers.q35)!==2)flags.push({level:'bad',text:'注意力检查未通过。'});
  else flags.push({level:'good',text:'注意力检查通过。'});
  if(summaries.penalties.impression.score>0)flags.push({level:'warn',text:'社会赞许性项目产生了模型化扣分；可解释性区间已反映该不确定性。'});
  if(summaries.penalties.pairs.score>0)flags.push({level:'warn',text:'部分反向题对存在较大差异；可解释性与一致性区间已同时反映。'});
  if(timeP>0){
    const mins=Number(data.durationSec)/60;
    flags.push({level:'warn',text:mins<6?`作答约 ${mins.toFixed(1)} 分钟，低于 6 分钟；按每少 1 分钟扣 3 分计入可解释性。`:`作答约 ${mins.toFixed(1)} 分钟，超过 15 分钟；固定扣 5 分计入可解释性。`});
  }else flags.push({level:'good',text:'作答时间位于 6–15 分钟区间，不扣分。'});
  return {N:MC_N,sim:{dims,life,quality,consistency,lifeBalance,penalties},summaries,flags,timePenalty:timeP};
}

function observerSigma(){
  const c=Number(observerState.confidence||0);
  const cf=({1:1.45,2:1.25,3:1.10,4:.95,5:.85})[c]||1.25;
  const df=({'少于 1 个月':1.35,'1–3 个月':1.20,'3–6 个月':1.08,'6–12 个月':1.00,'1 年以上':.90})[observerState.duration]||1.15;
  return .70*cf*df;
}
function analyzeObserver(){
  const sigma=observerSigma(),seed=hashString(JSON.stringify(observerState)),rng=mulberry32(seed),z=makeNormal(rng);
  const dims={},summaries={},counts={};
  for(const d of Object.keys(dimLabels)){
    const rows=observerItems.filter(x=>x.d===d).map(x=>observerState.answers[x.id]).filter(v=>typeof v==='number'&&Number.isFinite(v));
    counts[d]=rows.length;
    if(rows.length<2){dims[d]=null;summaries[d]={score:null,ci:null};continue}
    const arr=[];
    for(let k=0;k<MC_N;k++)arr.push(to100Likert(mean(rows.map(v=>sampleLikert(v,sigma,z)))));
    dims[d]=arr;summaries[d]=summary(arr,{clamp01:true});
  }
  return {N:MC_N,dims,summaries,counts,answered:Object.values(observerState.answers).filter(v=>typeof v==='number').length,confidence:Number(observerState.confidence||0),duration:observerState.duration||'',sigma};
}

function calcComposite(a){
  const N=a.N,total=[],rows=Object.fromEntries(scoreDefs.map(d=>[d.id,{adjusted:[],contribution:[]}]));
  let theoreticalMin=0,theoreticalMax=0;
  for(const d of scoreDefs){const w=Number(scoreWeights[d.id]??d.def);if(w>0)theoreticalMax+=w;if(w<0)theoreticalMin+=w}
  const span=theoreticalMax-theoreticalMin;
  if(span<=0)return {summary:{score:null,ci:null},rows:[],discount:{score:null,ci:null}};
  const discountSamples=[];
  for(let k=0;k<N;k++){
    const i=clamp(a.sim.quality[k]/100,0,1),discount=i*i;
    discountSamples.push(discount);
    let raw=0;
    for(const d of scoreDefs){
      const w=Number(scoreWeights[d.id]??d.def);
      const source=d.id==='lifeBalance'?a.sim.lifeBalance[k]:a.sim.dims[d.id][k];
      const s=clamp(source/100,0,1);
      const adjusted=d.direction==='positive'?s*discount:s;
      const contribution=w*adjusted;
      rows[d.id].adjusted.push(adjusted*100);
      rows[d.id].contribution.push(contribution);
      raw+=contribution;
    }
    total.push(clamp((raw-theoreticalMin)/span*100,0,100));
  }
  const rowOut=scoreDefs.map(d=>{
    const sourceSummary=d.id==='lifeBalance'?a.summaries.lifeBalance:a.summaries.dims[d.id];
    return {d,w:Number(scoreWeights[d.id]??d.def),source:sourceSummary,adjusted:summary(rows[d.id].adjusted,{clamp01:true,digits:1}),contribution:summary(rows[d.id].contribution,{digits:3})};
  });
  return {summary:summary(total,{clamp01:true}),rows:rowOut,discount:summary(discountSamples.map(x=>x*100),{clamp01:true,digits:1})};
}
function scheduleScoreRender(){if(scoreRenderFrame)cancelAnimationFrame(scoreRenderFrame);scoreRenderFrame=requestAnimationFrame(()=>{scoreRenderFrame=0;renderScorePanel()})}
function renderScorePanel(){
  const box=document.getElementById('scorePanel');if(!box||!selfAnalysis)return;
  const r=calcComposite(selfAnalysis),q=selfAnalysis.summaries.quality;
  let h=`<div class="card"><h2>可调权重综合评分</h2><div class="scoreHero"><div>${metricCard('综合参考分',r.summary.score,r.summary.ci,'点估计为模拟分布中位数；区间为同一批随机变量联合传播后的 2.5%–97.5% 分位数。')}</div><div class="sectionNote"><b>计算规则</b><div class="formula">正向贡献 = 正权重 × 指标 × i²；负向贡献 = 负权重 × 指标。i 为随机的可解释性变量。每次模拟都先计算该次 i，再计算该次所有贡献与总分，因此保留指标之间由共同题目和 i 引入的相关性。</div><p class="small">当前可解释性 i：${q.score}%（${formatCI(q.ci)}）；i² 折扣的模型中位数为 ${r.discount.score}%（${formatCI(r.discount.ci,1)}）。作答时间只通过 i 进入综合分，不再重复扣分。</p><p class="small">生活状态均衡度：对 8 个生活状态潜在分分别 +1 做拉普拉斯平滑，再计算标准化 Shannon 熵；名称中不再显示“熵”。</p></div></div>`;
  h+='<h3>权重</h3><div>';
  for(const d of scoreDefs){
    const w=Number(scoreWeights[d.id]??d.def);
    h+=`<div class="weightRow"><label for="w_${d.id}">${esc(d.label)}</label><input id="w_${d.id}" data-weight="${d.id}" type="range" min="${d.min}" max="${d.max}" step="0.05" value="${w}"><output>${w.toFixed(2)}</output></div>`;
  }
  h+='</div><div class="toolbar"><button id="resetWeights" class="secondary">恢复默认权重</button></div>';
  h+='<h3>分项贡献</h3><table class="scoreTable"><thead><tr><th>指标</th><th>原始分</th><th>权重</th><th>计分值</th><th>加权贡献</th></tr></thead><tbody>';
  for(const x of r.rows){
    h+=`<tr><td>${esc(x.d.label)}</td><td>${x.source.score}<br><span class="muted small">${formatCI(x.source.ci)}</span></td><td>${x.w.toFixed(2)}</td><td>${x.adjusted.score.toFixed(1)}<br><span class="muted small">${formatCI(x.adjusted.ci,1)}</span></td><td>${x.contribution.score.toFixed(3)}<br><span class="muted small">${formatCI(x.contribution.ci,3)}</span></td></tr>`;
  }
  h+='</tbody></table></div>';
  box.innerHTML=h;
  box.querySelectorAll('input[data-weight]').forEach(el=>el.addEventListener('input',e=>{const d=scoreDefs.find(x=>x.id===e.target.dataset.weight);scoreWeights[d.id]=clamp(Number(e.target.value),d.min,d.max);saveWeights();scheduleScoreRender()}));
  document.getElementById('resetWeights').onclick=()=>{scoreWeights={...defaultWeights};saveWeights();renderScorePanel()};
}
function methodologyHtml(){
  return `<div class="card"><h2>随机变量模型与 95% CI 计算</h2><p class="muted small">这些区间是“模型不确定性区间”，不是基于常模样本的心理测量学置信区间。模型假设在页面中完全公开，便于之后替换为有实证校准的数据模型。</p><ol class="methodList"><li><b>单个 1–7 题：</b>观察值为 r，潜在作答 Y = clip(r + ε, 1, 7)，其中 ε ~ N(0, 0.55²)。因此 Y 是两端带点质量的删失正态分布；1&lt;y&lt;7 时 F(y)=Φ((y-r)/0.55)，P(Y=1)=Φ((1-r)/0.55)，P(Y=7)=1-Φ((7-r)/0.55)。标准分 Z=100×(Y-1)/6。</li><li><b>人格/互动维度：</b>D = n⁻¹ΣZⱼ；反向题先用 Y′=8-Y。删失正态之和的卷积没有方便的闭式分位数，因此使用数值模拟。</li><li><b>作答一致性：</b>每组 Cₖ=100×[1-|Yₐ-(8-Yᵦ)|/6]，总一致性 C=mean(Cₖ)。</li><li><b>生活状态均衡度：</b>对 8 项潜在 Likert 值做 +1 平滑，pₖ=(Yₖ+1)/Σ(Yⱼ+1)，B=100×[-Σpₖln(pₖ)]/ln(8)。这是多个随机变量的非线性函数。</li><li><b>可解释性：</b>I=clip(100-P注意力-P社会赞许-P反向差异-P直线作答-P时间-P情境差异,0,100)。阈值型扣分由每次模拟的潜在题目决定；注意力检查与系统记录时间按退化随机变量处理。时间扣分：t&lt;6 时 P时间=3(6-t)，6≤t≤15 时为 0，t&gt;15 时固定为 5，t 单位为分钟。</li><li><b>总分：</b>正向项 Aⱼ=(Dⱼ/100)(I/100)²；负向项 Aⱼ=Dⱼ/100。原始加权和 R=ΣwⱼAⱼ，再用当前权重的理论最差/最好值线性映射到 0–100。由于 I²、阈值函数、均衡度以及共享题目造成相关性，总分无实用闭式分布。</li><li><b>数值区间：</b>使用固定种子的 ${MC_N.toLocaleString()} 次 Monte Carlo 联合抽样；每个显示分数取模拟分布中位数，95% CI 取经验 2.5% 与 97.5% 分位数。权重变化时沿用同一批潜在抽样，只重新组合贡献，避免区间因随机种子改变而跳动。</li></ol></div>`;
}

  const box=document.getElementById('observerItems');box.innerHTML='';
  observerItems.forEach((q,i)=>{
    const v=observerState.answers[q.id],d=document.createElement('div');d.className='obsItem';
    let scale='<div class="scale">';
    for(let n=1;n<=7;n++)scale+=`<label><input type="radio" name="${q.id}" value="${n}" ${Number(v)===n?'checked':''}><span>${n}</span></label>`;
    scale+=`<label><input type="radio" name="${q.id}" value="x" ${v==='x'?'checked':''}><span>无法判断</span></label></div>`;
    d.innerHTML=`<div class="small muted">${i+1} / ${observerItems.length}</div><div><b>${q.text}</b></div>${scale}`;box.appendChild(d);
  });
  box.querySelectorAll('input').forEach(x=>x.addEventListener('change',e=>{observerState.answers[e.target.name]=e.target.value==='x'?'x':Number(e.target.value);saveObserver()}));
  document.getElementById('obsDuration').onchange=saveObserver;document.getElementById('obsConfidence').onchange=saveObserver;
}
function renderObserverResult(){
  const o=document.getElementById('observerOutput');if(!observerAnalysis){o.innerHTML='';return}
  let h=`<div class="card"><h2>观察者评分</h2><p class="muted small">可评分行为项目 ${observerAnalysis.answered}/${observerItems.length}；接触时长：${esc(observerAnalysis.duration||'未填写')}；观察信心：${observerAnalysis.confidence||'未填写'}/5；当前观察误差 σ=${observerAnalysis.sigma.toFixed(2)} 个 Likert 点。</p><div class="metricGrid">`;
  for(const d of ['anx','avo','rel','con','neu','agr']){const s=observerAnalysis.summaries[d];h+=metricCard(dimLabels[d],s.score,s.ci,observerAnalysis.counts[d]<2?'有效观察不足':`${interp(s.score)} · 基于 ${observerAnalysis.counts[d]} 项行为`)}
  h+='</div><p class="muted small">观察者题同样使用删失正态潜在变量；基础 σ=0.70，再由接触时长和观察信心乘以预设不确定性系数。信心低、接触短会得到更宽的区间。</p></div>';
  o.innerHTML=h;
}
function renderCompare(){
  const o=document.getElementById('compareOutput');
  if(!selfAnalysis||!observerAnalysis){o.innerHTML='<h2>自评 × 他评</h2><p class="muted">需要先解析受测者结果，并完成观察者评估。</p>';return}
  let h='<h2>自评 × 他评</h2><p class="muted">绝对差异也作为随机变量：每次联合模拟计算 |自评−他评|，95% CI 取其经验分位数。</p><table class="scoreTable"><thead><tr><th>维度</th><th>自评</th><th>观察者</th><th>绝对差异</th><th>提示</th></tr></thead><tbody>';
  const big=[];
  for(const d of ['anx','avo','rel','con','neu','agr']){
    const ss=selfAnalysis.summaries.dims[d],os=observerAnalysis.summaries[d];
    let ds={score:null,ci:null};
    if(selfAnalysis.sim.dims[d]&&observerAnalysis.dims[d]){
      const n=Math.min(selfAnalysis.sim.dims[d].length,observerAnalysis.dims[d].length),arr=[];
      for(let k=0;k<n;k++)arr.push(Math.abs(selfAnalysis.sim.dims[d][k]-observerAnalysis.dims[d][k]));
      ds=summary(arr,{clamp01:true});
    }
    let tip='观察数据不足';
    if(ds.score!=null){if(ds.score>=30)tip='差异很大，优先核实具体行为实例';else if(ds.score>=18)tip='存在明显差异';else tip='大致一致';if(ds.score>=25)big.push(d)}
    h+=`<tr><td>${dimLabels[d]}</td><td>${ss.score}<br><span class="muted small">${formatCI(ss.ci)}</span></td><td>${os.score??'—'}<br><span class="muted small">${formatCI(os.ci)}</span></td><td class="compareDiff">${ds.score??'—'}<br><span class="muted small">${formatCI(ds.ci)}</span></td><td>${tip}</td></tr>`;
  }
  h+='</tbody></table>';
  if(big.length)h+=`<div class="flag">优先讨论：${big.map(d=>dimLabels[d]).join('、')}。建议双方各举 2–3 个近半年真实事件，而不是把分数当作事实判决。</div>`;
  else h+='<div class="flag good">当前模型下没有出现特别大的自评—他评分歧；仍需结合价值观、关键条件和真实互动判断。</div>';
  h+='<div class="sectionNote small">建议解释顺序：① 关键条件是否冲突；② 高重要性核心价值观；③ 沟通与修复；④ 焦虑/回避互动模式；⑤ 其他人格与生活状态指标。综合参考分只是显式化你设定的权重。</div>';
  o.innerHTML=h;
}
function switchTab(name){
  for(const [n,id] of [['self','selfSection'],['observer','observerSection'],['compare','compareSection']]){
    document.getElementById(id).classList.toggle('hidden',n!==name);
    document.getElementById('tab'+n[0].toUpperCase()+n.slice(1)).classList.toggle('active',n===name);
  }
  if(name==='compare')renderCompare();
}
document.getElementById('tabSelf').onclick=()=>switchTab('self');
document.getElementById('tabObserver').onclick=()=>switchTab('observer');
document.getElementById('tabCompare').onclick=()=>switchTab('compare');
document.getElementById('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;document.getElementById('pasteInput').value=await f.text()});
document.getElementById('parseBtn').onclick=()=>{try{selfData=parseEncoded(document.getElementById('pasteInput').value);selfAnalysis=analyzeSelf(selfData);renderSelf();renderCompare()}catch(e){alert('解析失败：'+e.message)}};
document.getElementById('clearSelf').onclick=()=>{selfData=selfAnalysis=null;document.getElementById('pasteInput').value='';document.getElementById('fileInput').value='';renderSelf();renderCompare()};
document.getElementById('scoreObserver').onclick=()=>{saveObserver();observerAnalysis=analyzeObserver();if(observerAnalysis.answered<10)alert('当前可评分的观察项目较少，区间会较宽。');renderObserverResult();renderCompare()};
document.getElementById('resetObserver').onclick=()=>{if(confirm('确定清空观察者问卷？')){observerState={duration:'',confidence:'',answers:{}};observerAnalysis=null;localStorage.removeItem(OBS_STORAGE);renderObserverForm();renderObserverResult();renderCompare()}};
loadWeights();loadObserver();renderObserverForm();
</script>
