<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长期生活契合度问卷</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#171717;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--soft:#f3f4f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:820px;margin:auto;padding:24px 14px 56px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}h1{font-size:27px;margin:0 0 8px}h2{font-size:21px;margin:0 0 10px}p{margin:7px 0}.muted{color:var(--muted)}.small{font-size:13px}.hidden{display:none!important}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:10px 15px;background:var(--accent);color:white;font-weight:650;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}button.ghost{background:white;color:#111827;border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}.progressWrap{position:sticky;top:0;z-index:4;background:rgba(246,247,249,.94);backdrop-filter:blur(8px);padding:8px 0}.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:#111827;width:0}.qnum{font-size:12px;color:var(--muted);margin-bottom:6px}.qtext{font-size:16px;font-weight:650;margin-bottom:14px}.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.scale label{cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 2px;background:#fff}.scale input{display:none}.scale input:checked+span{display:block;background:#111827;color:white;border-radius:7px;padding:5px 0;margin:-5px 0}.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}.scenario label{display:block;border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;cursor:pointer}.scenario input{margin-right:8px}.valueRow{display:grid;grid-template-columns:1fr 190px;gap:14px;align-items:start}.importance label{display:block;font-size:12px;margin:3px 0}.field{margin:14px 0}.field label{font-weight:650;display:block;margin-bottom:6px}input[type=text],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:white}.codeBox{word-break:break-all;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;max-height:120px;overflow:auto}@media(max-width:640px){.wrap{padding-top:12px}.scale{gap:4px}.scale label{padding:8px 1px}.valueRow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section id="intro" class="card">
  <h1>长期生活契合度问卷</h1>
  <h3>请按最近一年更接近真实行为的情况填写。</h3>
  <p class="muted small">预计约 8–12 分钟。</p>
  <div class="field"><label>称呼或代号（可选）</label><input id="alias" type="text" maxlength="40" placeholder="例如：A / 小王"></div>
  <div class="toolbar"><button id="startBtn">开始填写</button><button id="resumeBtn" class="secondary hidden">继续上次进度</button><button id="resetBtn" class="ghost hidden">清空重来</button></div>
</section>

<section id="mixed" class="hidden">
  <div class="progressWrap"><div id="progressText" class="small muted"></div><div class="progress"><div id="progressBar"></div></div></div>
  <div id="mixedPanel"></div>
  <div class="toolbar"><button id="prevPage" class="secondary">上一页</button><button id="nextPage">下一页</button></div>
</section>

<section id="scenarios" class="hidden">
  <div class="card"><h2>一些日常情境</h2><p class="muted">请选择你现实中最可能出现的反应。若两个都可能，请选择更常见的那个。</p></div>
  <div id="scenarioPanel"></div>
  <div class="toolbar"><button id="backMixed" class="secondary">返回</button><button id="toValues">继续</button></div>
</section>

<section id="values" class="hidden">
  <div class="card"><h2>长期生活规划</h2><h3>每题选择你的真实立场，并标记这件事对长期关系的重要程度。</h3></div>
  <div id="valuePanel"></div>
  <div class="toolbar"><button id="backScenarios" class="secondary">返回</button><button id="toHard">继续</button></div>
</section>

<section id="hard" class="hidden">
  <div class="card"><h2>关键条件</h2><h3 class="muted">这里没有必要含蓄。请按真实接受范围填写。</h3><div id="hardPanel"></div></div>
  <div class="toolbar"><button id="backValues" class="secondary">返回</button><button id="finishBtn">完成</button></div>
</section>

<section id="done" class="hidden">
  <div class="card">
    <h2>填写完成</h2>
    <p>导出的文件可以发送给对方哦。</p>
    <div class="toolbar"><button id="downloadBtn">下载结果</button><button id="copyBtn" class="secondary">复制结果</button></div>
    <div id="codeBox" class="codeBox hidden"></div>
  </div>
</section>
</div>
<script>
const VERSION='2.0.0';
const STORAGE='ltm-self-v2';
const PAGE_SIZE=7;

const items=[
{id:'q01',text:'当重要的人明显比平时少联系时，我容易开始推测关系是不是发生了变化。'},
{id:'q02',text:'即使几天联系频率下降，只要没有明确冲突，我通常仍能按自己的节奏生活。'},
{id:'q03',text:'关系中存在尚未解决的不确定性时，我会反复想它，很难完全把注意力移开。'},
{id:'q04',text:'当我很在意的人把大量注意力放在其他人身上时，我容易把这理解成自己被替代的信号。'},
{id:'q05',text:'遇到困难时，我更习惯先自己消化，不太愿意让亲近的人参与。'},
{id:'q06',text:'我可以自然地告诉伴侣“我现在需要你的支持”，而不会觉得这样削弱了独立性。'},
{id:'q07',text:'一段关系越来越稳定、越来越亲密后，我有时反而会想主动拉开一点距离。'},
{id:'q08',text:'别人持续需要我提供情绪安慰时，我容易感到被压住或被消耗。'},
{id:'q09',text:'有需要时，我通常能直接说出来，而不是主要依靠暗示、试探或让对方猜。'},
{id:'q10',text:'冲突激烈时，我通常能够先暂停，并约定之后继续的时间地点，而不是突然消失或用分手威胁。'},
{id:'q11',text:'我做错事后，通常能明确承认自己的部分，而不只是解释自己为什么会那样。'},
{id:'q12',text:'伴侣情绪很低时，我通常会先弄清楚对方现在更需要倾听、陪伴还是一起想办法。'},
{id:'q13',text:'答应别人的重要事情，我通常会按约定完成。'},
{id:'q14',text:'如果没有外部监督，我给自己定下的计划很容易自行失效。'},
{id:'q15',text:'对重要任务，我通常会提前留出时间，而不是总依赖最后冲刺。'},
{id:'q16',text:'我有时会因为临时改变安排，让已经和我约好的人比较被动。'},
{id:'q17',text:'面对还没有结果、但可能出问题的事情，我容易提前担心较久。'},
{id:'q18',text:'事情已经无法改变以后，我通常能比较快停止反复回想。'},
{id:'q19',text:'一件不顺利的小事，有时会明显影响我接下来几个小时的心情。'},
{id:'q20',text:'压力较大时，我的睡眠、注意力、胃口或身体状态容易明显受到影响。'},
{id:'q21',text:'即使我非常不同意一个人的观点，我通常也能避免故意羞辱或讽刺对方。'},
{id:'q22',text:'别人送我礼物时，我经常先怀疑背后是不是还有别的目的。'},
{id:'q23',text:'亲近的人难受时，即使我不能解决问题，我通常也愿意认真听。'},
{id:'q24',text:'意见冲突时，我更关心能否解决问题，而不是让对方承认自己输了。'},
{id:'q25',text:'最近三个月，我对自己的体能、精力和整体身体状态基本满意。'},
{id:'q26',text:'目前的学习或工作能给我一定价值感，并且我大致看得到下一步的发展空间。'},
{id:'q27',text:'我对自己的收入或可支配资金、储蓄、债务和消费节奏满意。'},
{id:'q28',text:'我身边至少有一两个人，在我状态很差时可以认真听我说话。'},
{id:'q29',text:'目前的亲密关系或单身状态总体上没有长期消耗我的基本安全感。'},
{id:'q30',text:'最近三个月，我仍有一些精力学习新东西、接触新事物或持续提升自己。'},
{id:'q31',text:'除了责任和任务外，我有至少一种能让我真实恢复精力的休闲方式。'},
{id:'q32',text:'我对目前居住空间以及所在城市/社区的安全、便利和舒适程度基本满意。'},
{id:'q33',text:'无论多么生气，我这一生从来没有对任何人产生过不友善的念头。'},
{id:'q34',text:'我从来没有为了省事，对重要的人隐瞒过任何哪怕很小的事实。'},
{id:'q35',text:'这是一道作答检查题。为了确认你正在阅读，请选择“2”。'}
];

const pairIds=[['q01','q02'],['q05','q06'],['q13','q14'],['q17','q18'],['q21','q22']];

const scenarios=[
{id:'s1',text:'你和一个正在新认识的人平时每天都会联系。某天对方从下午开始明显比平时回复得慢，你最可能：',opts:[
{id:'a',t:'先按原计划做自己的事情，等对方有空再联系。'},
{id:'b',t:'发一条简短消息确认是否在忙，之后继续自己的事情。'},
{id:'c',t:'反复回看之前的聊天，想是不是哪里让对方不高兴，并多次确认。'},
{id:'d',t:'自己也主动减少联系，看看对方会不会因此来找我。'}]},
{id:'s2',text:'你们发生了一次比较激烈的争执，但第二天双方都有重要安排。你更可能：',opts:[
{id:'a',t:'坚持当晚彻底谈清楚，否则我很难安心。'},
{id:'b',t:'约定一个明确时间再谈，各自先休息和处理第二天的事情。'},
{id:'c',t:'先不再提，等对方什么时候主动再说。'},
{id:'d',t:'几天内明显减少交流，让情绪自然过去。'}]},
{id:'s3',text:'伴侣工作受挫，告诉你“我现在很难受”。你第一反应更接近：',opts:[
{id:'a',t:'问对方此刻更想被听见、被陪着，还是一起想办法。'},
{id:'b',t:'先给一点空间，晚些时候再主动问状态。'},
{id:'c',t:'尽快分析问题并给出解决方案，希望对方不要一直沉浸在情绪里。'},
{id:'d',t:'我会明显觉得有压力，不太知道该怎么承接这类情绪。'}]},
{id:'s4',text:'一段关系从追求期进入稳定期，互动没有之前那么刺激。你更可能：',opts:[
{id:'a',t:'觉得这是正常变化，开始关注怎样把日常经营好。'},
{id:'b',t:'会想增加见面和确认，让彼此更紧密。'},
{id:'c',t:'开始怀疑是不是已经“不够喜欢了”。'},
{id:'d',t:'想重新拉开一些距离，找回完全自由的感觉。'}]},
{id:'s5',text:'伴侣最近经常和一个很有魅力的新朋友一起活动。你最可能：',opts:[
{id:'a',t:'有一点介意，但先观察事实，需要时讨论双方认可的边界。'},
{id:'b',t:'明显增加对对方行踪、聊天或社交动态的关注。'},
{id:'c',t:'故意让自己也表现得很受欢迎，看看对方会不会吃醋。'},
{id:'d',t:'反而觉得轻松，因为关系似乎没有那么强的唯一性要求。'}]}
];

const values=[
{id:'v1',name:'竞争与成功',text:'即使需要牺牲相当一部分舒适和闲暇，取得明显的事业或学业成就对我仍然非常重要。'},
{id:'v2',name:'金钱与消费',text:'相比提高当下消费水平，我更看重长期储蓄、应急资金和财务可预测性。'},
{id:'v3',name:'生育',text:'如果条件允许，我希望未来拥有孩子并投入相当时间参与养育。'},
{id:'v4',name:'父母边界',text:'建立长期伴侣关系后，重大决定应由伴侣双方共同决定，父母可以建议但不应拥有否决权。'},
{id:'v5',name:'工作与生活',text:'事业机会再重要，我也希望给健康、伴侣和私人生活保留明确底线。'},
{id:'v6',name:'社会责任',text:'即使会牺牲一点个人收益，我仍希望自己的工作和生活能对他人或社会产生积极价值。'},
{id:'v7',name:'居住城市',text:'为了更好的职业与生活机会，我愿意长期迁往大城市或离家较远的地区。'},
{id:'v8',name:'学术/事业追求',text:'如果机会值得，我可以接受读研、读博、创业或转行带来的几年不确定性。'},
{id:'v9',name:'平等与分工',text:'家务、照护和事业牺牲应根据双方时间与能力协商，而不应主要由性别或收入决定。'},
{id:'v10',name:'忠诚与承诺',text:'长期承诺意味着遇到困难时双方应优先尝试沟通和修复，而不是通过冷处理、暧昧或分手威胁解决问题。'}
];

const hardDefs=[
{id:'h1',label:'目前寻找的关系',opts:['以结婚为明确目标','长期稳定关系，未来可能结婚','长期关系，但暂不计划结婚','目前不确定']},
{id:'h2',label:'是否希望有孩子',opts:['明确希望','比较希望','不确定','比较不希望','明确不要']},
{id:'h3',label:'对关系排他性的要求',opts:['只接受双方排他的单偶关系','倾向单偶，但可以讨论边界','可以接受其他关系模式','不确定']},
{id:'h4',label:'为了伴侣或事业迁居',opts:['可以主动考虑迁居','根据双方机会协商','更希望对方迁来','原则上不愿迁居']},
{id:'h5',label:'与一方父母长期同住',opts:['可以接受','短期可以，长期不接受','原则上不接受','视照护需求和住房条件而定']},
{id:'h6',label:'伴侣吸烟',opts:['都可以','偶尔可以','希望基本不吸烟','必须不吸烟']},
{id:'h7',label:'较大的消费性债务',opts:['可以共同处理','需要了解原因和明确偿还计划','很难接受','无法接受']}
];

let state={startedAt:null,order:[],page:0,answers:{},scenarios:{},values:{},hard:{},alias:''};

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeOrder(){
  const ids=items.map(x=>x.id); let best=ids;
  for(let n=0;n<600;n++){
    const o=shuffle(ids); let ok=true;
    for(const [a,b] of pairIds){if(Math.abs(o.indexOf(a)-o.indexOf(b))<8){ok=false;break}}
    if(ok)return o; best=o;
  }
  return best;
}
function save(){state.alias=document.getElementById('alias').value.trim();localStorage.setItem(STORAGE,JSON.stringify(state))}
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE));if(x&&x.order?.length)state=x}catch(e){}}
function show(id){for(const s of ['intro','mixed','scenarios','values','hard','done'])document.getElementById(s).classList.add('hidden');document.getElementById(id).classList.remove('hidden');window.scrollTo({top:0,behavior:'instant'})}
function itemById(id){return items.find(x=>x.id===id)}
function scaleHtml(id,value){let h='<div class="scale">';for(let n=1;n<=7;n++)h+=`<label><input type="radio" name="${id}" value="${n}" ${Number(value)===n?'checked':''}><span>${n}</span></label>`;return h+'</div><div class="legend"><span>完全不符合</span><span>非常符合</span></div>'}
function bindScale(container,store){container.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',e=>{store[e.target.name]=Number(e.target.value);save()}))}
function renderMixed(){
  const start=state.page*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,state.order.length),panel=document.getElementById('mixedPanel');panel.innerHTML='';
  state.order.slice(start,end).forEach((id,i)=>{const q=itemById(id),c=document.createElement('div');c.className='card';c.innerHTML=`<div class="qnum">${start+i+1} / ${state.order.length}</div><div class="qtext">${q.text}</div>${scaleHtml(id,state.answers[id])}`;panel.appendChild(c)});
  bindScale(panel,state.answers); document.getElementById('prevPage').disabled=state.page===0;
  document.getElementById('nextPage').textContent=end===state.order.length?'进入情境题':'下一页';
  const pct=Math.round(end/state.order.length*70);document.getElementById('progressBar').style.width=pct+'%';document.getElementById('progressText').textContent=`第一部分 · ${start+1}–${end} / ${state.order.length}`;
}
function currentPageComplete(){const ids=state.order.slice(state.page*PAGE_SIZE,Math.min((state.page+1)*PAGE_SIZE,state.order.length));return ids.every(id=>state.answers[id]!=null)}
function renderScenarios(){const p=document.getElementById('scenarioPanel');p.innerHTML='';scenarios.forEach((s,i)=>{const c=document.createElement('div');c.className='card scenario';let h=`<div class="qnum">情境 ${i+1} / ${scenarios.length}</div><div class="qtext">${s.text}</div>`;for(const o of s.opts)h+=`<label><input type="radio" name="${s.id}" value="${o.id}" ${state.scenarios[s.id]===o.id?'checked':''}>${o.t}</label>`;c.innerHTML=h;p.appendChild(c)});p.querySelectorAll('input').forEach(x=>x.addEventListener('change',e=>{state.scenarios[e.target.name]=e.target.value;save()}))}
function renderValues(){const p=document.getElementById('valuePanel');p.innerHTML='';values.forEach((v,i)=>{const cur=state.values[v.id]||{};const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="qnum">${i+1} / ${values.length} · ${v.name}</div><div class="valueRow"><div><div class="qtext">${v.text}</div>${scaleHtml(v.id+'_stance',cur.stance)}</div><div><b>对长期关系的重要程度</b><div class="importance"><label><input type="radio" name="${v.id}_imp" value="0" ${cur.importance===0?'checked':''}>0 不重要</label><label><input type="radio" name="${v.id}_imp" value="1" ${cur.importance===1?'checked':''}>1 略重要</label><label><input type="radio" name="${v.id}_imp" value="2" ${cur.importance===2?'checked':''}>2 很重要</label><label><input type="radio" name="${v.id}_imp" value="3" ${cur.importance===3?'checked':''}>3 核心条件</label></div></div></div>`;p.appendChild(c)});
  p.querySelectorAll('input').forEach(x=>x.addEventListener('change',e=>{const m=e.target.name.match(/^(v\d+)_(stance|imp)$/);if(!m)return;state.values[m[1]]??={};if(m[2]==='stance')state.values[m[1]].stance=Number(e.target.value);else state.values[m[1]].importance=Number(e.target.value);save()}))
}
function renderHard(){const p=document.getElementById('hardPanel');p.innerHTML='';hardDefs.forEach(h=>{const d=document.createElement('div');d.className='field';d.innerHTML=`<label>${h.label}</label><select id="${h.id}"><option value="">请选择</option>${h.opts.map(o=>`<option ${state.hard[h.id]===o?'selected':''}>${o}</option>`).join('')}</select>`;p.appendChild(d)});p.querySelectorAll('select').forEach(x=>x.addEventListener('change',e=>{state.hard[e.target.id]=e.target.value;save()}))}
function allScenarios(){return scenarios.every(s=>state.scenarios[s.id])}
function allValues(){return values.every(v=>state.values[v.id]?.stance!=null&&state.values[v.id]?.importance!=null)}
function allHard(){return hardDefs.every(h=>state.hard[h.id])}
function utf8ToB64(str){const bytes=new TextEncoder().encode(str);let bin='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(bin)}
function buildPayload(){return {schema:'LTM_SELF_V2',version:VERSION,createdAt:new Date().toISOString(),startedAt:state.startedAt,completedAt:new Date().toISOString(),durationSec:Math.max(1,Math.round((Date.now()-new Date(state.startedAt).getTime())/1000)),alias:state.alias||'',order:state.order,answers:state.answers,scenarios:state.scenarios,values:state.values,hard:state.hard}}
function encodedResult(){return 'LTM1:'+utf8ToB64(JSON.stringify(buildPayload()))}
function downloadText(name,text){const b=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

load();
if(state.order.length){document.getElementById('resumeBtn').classList.remove('hidden');document.getElementById('resetBtn').classList.remove('hidden');document.getElementById('alias').value=state.alias||''}
document.getElementById('startBtn').onclick=()=>{state={startedAt:new Date().toISOString(),order:makeOrder(),page:0,answers:{},scenarios:{},values:{},hard:{},alias:document.getElementById('alias').value.trim()};save();renderMixed();show('mixed')};
document.getElementById('resumeBtn').onclick=()=>{document.getElementById('alias').value=state.alias||'';renderMixed();show('mixed')};
document.getElementById('resetBtn').onclick=()=>{if(confirm('确定清空本机上的当前进度？')){localStorage.removeItem(STORAGE);location.reload()}};
document.getElementById('prevPage').onclick=()=>{if(state.page>0){state.page--;save();renderMixed();window.scrollTo(0,0)}};
document.getElementById('nextPage').onclick=()=>{if(!currentPageComplete()){alert('请先完成本页全部题目。');return}if((state.page+1)*PAGE_SIZE>=state.order.length){renderScenarios();show('scenarios')}else{state.page++;save();renderMixed();window.scrollTo(0,0)}};
document.getElementById('backMixed').onclick=()=>{state.page=Math.floor((state.order.length-1)/PAGE_SIZE);renderMixed();show('mixed')};
document.getElementById('toValues').onclick=()=>{if(!allScenarios()){alert('请先完成全部情境题。');return}renderValues();show('values')};
document.getElementById('backScenarios').onclick=()=>{renderScenarios();show('scenarios')};
document.getElementById('toHard').onclick=()=>{if(!allValues()){alert('请完成每个价值观项目的立场与重要程度。');return}renderHard();show('hard')};
document.getElementById('backValues').onclick=()=>{renderValues();show('values')};
document.getElementById('finishBtn').onclick=()=>{if(!allHard()){alert('请完成全部关键条件。');return}state.alias=document.getElementById('alias').value.trim()||state.alias;save();const code=encodedResult();document.getElementById('codeBox').textContent=code;show('done')};
document.getElementById('downloadBtn').onclick=()=>{const code=encodedResult(),safe=(state.alias||'result').replace(/[^\w\u4e00-\u9fa5-]+/g,'_');downloadText(`长期相处问卷_${safe}_${new Date().toISOString().slice(0,10)}.ltmb64`,code)};
document.getElementById('copyBtn').onclick=async()=>{const code=encodedResult();document.getElementById('codeBox').classList.remove('hidden');try{await navigator.clipboard.writeText(code);alert('已复制 Base64 文本。')}catch(e){alert('浏览器未允许自动复制，请从下方文本框手动复制。')}};
</script>
</body>
</html>
