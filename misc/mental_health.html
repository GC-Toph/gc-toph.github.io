.method-steps{margin:13px 0 14px 19px;padding:0;display:grid;gap:10px;font-size:14px;line-height:1.65}
.method-steps li::marker{color:#277d6b;font-weight:750}
.method-example{background:white;border-left:3px solid #5fa18e;padding:11px 13px;border-radius:0 10px 10px 0;font-size:13px;line-height:1.7}
.method-example p{margin-top:5px}
.communication-choice{display:flex;flex-direction:column;gap:8px;min-height:315px}
.communication-choice>button{margin-top:auto;align-self:flex-start}
/* 28-day protocol */
.sleep-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 15px}
.sleep-tabs{flex-wrap:wrap}
.sleep-section{padding:19px;background:#f9fbfb;border:1px solid #e0e8e6;border-radius:14px;min-width:0}
.sleep-section h3{margin:0 0 17px;font-size:17px}
.sleep-editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sleep-check-grid{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}
.sleep-check{display:flex;align-items:flex-start;gap:11px;padding:10px 11px;background:white;border:1px solid #e0e7e4;border-radius:9px;cursor:pointer}
.sleep-check input{width:17px;height:17px;flex-shrink:0;margin-top:3px;accent-color:var(--main)}
.sleep-check span{display:grid;gap:3px}
.sleep-check small{font-size:12px;color:var(--muted);line-height:1.45}
.sleep-status{display:flex;align-items:center;min-height:42px;padding:10px 12px;background:#eaf4f0;border-radius:10px;color:#176456;font-weight:750}
.sleep-feedback{padding:12px;background:#f2f6ed;border-radius:9px;font-size:13px;color:#5a6e52;line-height:1.65;margin-top:12px}
.sleep-table-wrap{overflow:auto;border:1px solid #dce4e2;border-radius:12px;max-height:58vh;scrollbar-width:thin}
.sleep-table{border-collapse:separate;border-spacing:0;min-width:1390px;width:100%;font-size:12px}
.sleep-table th,.sleep-table td{padding:7px 5px;border-bottom:1px solid #e5ebea;border-right:1px solid #edf1ef;white-space:nowrap;text-align:center;background:white}
.sleep-table thead th{position:sticky;top:0;z-index:4;background:#ebf3f1;color:#37635c;font-weight:800;padding:12px 6px}
.sleep-table th:first-child{position:sticky;left:0;z-index:3;background:#f4f8f7;min-width:105px;text-align:left;padding-left:10px}
.sleep-table thead th:first-child{z-index:5;background:#e1eeea}
.sleep-table tbody tr:nth-child(even) td{background:#fbfcfc}
.sleep-table tbody th small{display:block;color:#879799;margin-top:3px;font-weight:400}
.sleep-day-link{border:0;background:transparent;color:var(--main);font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer;padding:1px}
.sleep-mini-input{width:83px;min-height:30px;border:1px solid #dce5e4;border-radius:7px;padding:4px 5px;font:inherit;background:white;color:var(--ink);text-align:center}
.sleep-mini-input[type=number]{width:63px}
.sleep-check-cell input{width:15px;height:15px;accent-color:var(--main);cursor:pointer}
.sleep-table-wrap :focus-visible,.breath-widget :focus-visible{outline:2px solid var(--main);outline-offset:2px}
/* Offline dual-tone physiological sigh guide (optional) */
.breath-widget{border:1px solid #cfe2df;border-radius:16px;background:linear-gradient(135deg,#f4faf7,#f4f7fc);padding:18px;margin:14px 0}
.breath-widget h3{margin:5px 0 0;font-size:17px}
.breath-body{display:flex;align-items:center;gap:25px;margin-top:16px}
.breath-circle{--breath-progress:0%;flex:0 0 168px;width:168px;height:168px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:50%;background:radial-gradient(closest-side,#f7fbfa 87%,transparent 89% 100%),conic-gradient(#55a69a var(--breath-progress),#d9e9e6 0);transition:background .14s}
.breath-circle[data-phase=exhale]{background:radial-gradient(closest-side,#f7fbfa 87%,transparent 89% 100%),conic-gradient(#7c9bbd var(--breath-progress),#d9e9e6 0)}
.breath-circle span{font-size:19px;font-weight:850;color:#246b61}
.breath-circle small{font-size:12px;color:#678184;margin-top:8px}
.breath-instructions{flex:1;min-width:0}
.breath-big-text{font-size:15px;font-weight:750;line-height:1.7;min-height:28px}
.breath-audio-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.breath-audio-controls label{display:flex;align-items:center;gap:8px}
.breath-audio-controls input{width:112px;accent-color:var(--main)}
@media(max-width:900px){.sleep-editor-grid{grid-template-columns:1fr}}
@media(max-width:520px){.breath-body{flex-direction:column;text-align:center}.breath-instructions{width:100%}.breath-audio-controls,.breath-body .btnrow{justify-content:center}.breath-circle{width:145px;height:145px;flex-basis:145px}.sleep-section{padding:12px}.sleep-head{align-items:flex-start}}

 guide('values',['回忆真正有意义、令人满足的时刻。','区分本身珍视的价值与仅用于达成其他目的的工具。','从候选价值中选出当前最重要的少数几项。','为一项价值安排最小的具体行动。'],'收入对某人重要，是因为它支持自由与照顾家人；因此“自由、联结”可能更接近深层价值。');

 guide('priorities',['列出健康、关系、工作、成长等当前生活领域。','评估这一阶段最需要投入哪几个领域。','明确必须暂时降低优先级的事项。','安排本周的一次对应行动。'],'最近睡眠不足时，健康可能暂时高于新兴趣项目。');
 guide('value-check',['确定两种或更多备选方案。','列出三项真正重要的价值。','分别判断每个选项对价值的实际满足程度。','解释取舍，不机械服从总分。'],'原书比较“学葡萄牙语”与“副业”时，按联结、冒险、掌握等价值给出不同评分。');
// CH3
 guide('vast',['V：解释目标如何服务自己的价值。','A：明确值得努力、同时现实可望的方向。','S：保留少数目标，减少同时追逐的项目。','T：定义能够检查的结果或下一步。'],'与其写“变得健康”，不如写“未来四周每周安排三次适合身体状况的运动”。');
 guide('habit',['挑选可以重复的最小行为。','选取一个稳定的外部触发条件。','写下“如果……那么……”承诺。','提前调整环境，减少阻力，并定期反思。'],'如果晚饭吃完，就先穿鞋出门走十分钟。');
 guide('toward',['注意今天面临的一个选择节点。','想起这次选择涉及的个人价值。','区分“趋向价值”与“远离价值”的可能动作。','选择此刻可做到的一小步。'],'价值是联结；冲突后可以选择认真倾听，而不是为了逃避不适立即冷处理。');
 guide('review',['回顾真实完成的行动。','找出哪项行动确实靠近价值。','识别受阻步骤，并区分现实困难与错误预估。','下周最多选择两项具体调整。'],'本周原计划跑三次，实际上两次；调查阻力后决定把一次运动改到周末。');
// CH4
 guide('rid',['R：列出使问题更可能发生的风险条件。','I：写出最早可识别的预警信号。','D：针对每个信号准备预防与应对策略。','写下“如果—那么”步骤，并注明何时联系支持。'],'若连续两晚睡少又开始取消社交：先调整作息，并联系可信任的人讨论。','一般的 RID 表单不能取代个性化自杀安全计划或危机干预。');
 guide('warning-signs',['回想上次问题升级前的最初迹象。','记录自己和他人能够观察到的变化。','选一项早期且低风险的干预动作。'],'情绪爆发前总会说话加快、反复打断对方，此时先暂停。');
 guide('stop',['S：先停止说话和动作。','T：暂时退一步，不立刻作决定。','O：注意事实、情绪、冲动和环境。','P：在更有觉察的状态下继续行动。'],'激烈争论时先停下并约定恢复时间，而不是继续解释到对方屈服。');
 guide('opposite',['识别情绪推动的行为冲动。','核对该冲动是否与真实风险及个人价值一致。','若不一致，选择安全、适度的反向行动。','记录后果，必要时重新评估。'],'面对没有真实危险的安全社交，因为尴尬想逃跑时，可以先留下并完成一句问候。','真实危险中不应因为“反向行动”而放弃自我保护。');
// CH5
 guide('fear-hierarchy',['选择现实中安全却被过度回避的情境。','列出从相对容易到较难的具体行动。','逐一对主观恐惧评分 0—10。','先从可承受的小挑战入手，按经验调整等级。'],'社交焦虑的阶梯可从询问店员、同事寒暄、会议发言逐步升级。','不建议对危险、创伤重现或严重症状自行开展高强度暴露。');
 guide('exposure',['确定安全条件与行动边界。','写出具体的灾难预测及预估概率。','在可承受范围内实施小规模面对练习。','记录实际发生的事，而不只记录是否不紧张。'],'担心给同事提问就会被嘲笑；实际提问后留意对方的具体反应。','暴露不是逼自己忍到情绪消失，若存在真实风险应优先安全。');
 guide('behavior-test',['把笼统担忧改写为可观察、可证伪的预测。','设计一个适当且低风险的试验。','完成试验并记录与预测相关的事实。','比较预测与观察，得出合理而不夸大的结论。'],'“邀请同事吃饭会被讽刺”可以通过一次礼貌邀请来检验。');
 guide('safety-behaviors',['列出自己在恐惧情境中的额外保护动作。','区分必要的现实安全措施与用于回避学习的动作。','选择一种可安全降低的过度保护行为。','观察减少它以后对预测的影响。'],'聚会上反复检查手机可能妨碍获得正常交流的真实经验。');
 guide('erp',['学习暴露与反应预防的基本结构。','了解为什么去除强迫行为需要专业风险判断。','如症状显著影响生活，寻求专业人员制定具体方案。'],'强迫症患者可能需要在治疗师指导下逐步面对触发情境并减少仪式化反应。','本模块不提供独立的高强度 ERP 操作指令。');
// CH6
 guide('sleep',['保持相对一致的就寝、起床时间；原书建议通常不超过约一小时浮动。','睡前减少过度刺激，留意包括绿茶在内的咖啡因来源。','白天尤其清晨接触户外亮光并适当运动。','记录 28 天睡眠协议；观察趋势，不把某一晚差睡看作失败。'],'原书中，一位来访者睡前喝绿茶却不知道其中含有咖啡因；识别这一习惯后才能调整。','本页面的 12:30、20:30、2000mL 等阈值来自用户的个人追踪模板，不是原书或统一医学标准。饮水目标需考虑个体需要与医生限制。','CH6 原文：Sleep / How to Optimize Your Sleep；清单中的具体时点按用户提供的协议扩充。');
 guide('pmr',['在舒适位置坐下或躺下，轻轻闭眼。','从脚趾开始绷紧约 5 秒，但不能疼痛。','放松约 10 秒，并注意紧绷与放松的差别。','继续到小腿、臀部、腹部、手臂、肩膀和面部。'],'原书建议逐渐从脚趾向上，最后轻柔地同时绷紧全身。','用户另提供 4 秒全身绷紧/缓慢松开的短版，可按身体耐受选择；若疼痛请跳过。');
 guide('breathing',['先坐稳、放松，不强行吸过量空气。','选择温和 4/8 引导：鼻吸约 3 秒、轻轻补吸约 1 秒。','嘴缓缓呼气约 8 秒，直到自然、舒适地结束。','若头晕、刺痛或胸闷，停止节律引导并恢复自然呼吸。'],'原书 SNAPE 提醒：慢、鼻、腹部、节律、呼气略长；“两次吸气 + 4/8”是本应用按用户要求提供的可选变体。','不要憋气、强力吸满或在驾驶时练习；它不是人人都适合的标准配方。','原书 CH6 Slow Breathing（SNAPE）；两段鼻吸、8 秒呼气为用户要求的个性化设计。');
 guide('exercise',['选择自己愿意长期重复、身体能够承受的活动。','从小幅增加开始，不追求一次性高强度。','记录时长及活动后心情。','在生活日程中为下一次活动留出时间。'],'原书强调“最好的运动，是你实际会去做的运动”。');
 guide('cold',['了解相关研究目前仍有较多限制。','检查心血管或呼吸系统等风险，避免强烈突然刺激。','更优先考虑证据更稳健的运动与睡眠。'],'冷刺激或快速呼吸可能使人短暂清醒，但不能视为已经充分证实的心理疾病治疗。');
// CH7
 guide('reframe',['写下诱发情绪的具体自动想法。','列出客观支持证据。','主动寻找反面证据与其他合理解释。','写出既不美化也不灾难化的平衡想法，再观察情绪变化。'],'“上司没有回复”并不能直接证明“我马上会被开除”；还可能是忙碌或尚未看到。','不是积极思考比赛。现实困难真实存在时，仍应采取必要行动。');
 guide('distortions',['写下一个确切想法，而不是先给自己贴标签。','看看是否存在读心、灾难化、过度概括等模式。','逐项检查是否有足够事实。','用更准确的表述重新组织该想法。'],'“这次做错，我做什么都不行”属于把单次结果过度推广。');
 guide('parts',['写下两种彼此冲突的内心倾向。','分别询问它们重视什么、担心什么。','用慈悲而非攻击的方式理解各自保护意图。','寻找兼顾不同需要的现实行动。'],'一部分渴望表达，另一部分担心被嘲笑；可在安全小组先练习发言。','心理部分是一种帮助理解动机的模型，并非独立人格；严重解离等情况应寻求专业帮助。');
 guide('postpone',['选一个固定、有限的担忧时间段。','无益担忧出现时先简短记下，提醒自己稍后考虑。','把注意力重新投入当前活动。','到规定时间再决定是否需要解决问题。'],'通勤时想起明天汇报会失败，可先记下“明天汇报准备”，在晚间指定时间处理。','真正紧急或危险的问题不应推迟。');
 guide('belief-log',['写下卡点信念并评分相信程度。','分析当时已知与事后才知道的信息。','记录新证据和不同解释。','隔天或隔周再次评分，观察变化。'],'“我当时应该预见一切”可和事件发生时真正掌握的信息作对照。','本工具是认知反思日志，不提供 PTSD 或道德损伤诊断。');
 guide('responsibility',['明确事件时点自己能知道的事实。','分开整理当时有能力控制与不能控制的因素。','找出事后新获得的信息，避免把后见之明当作当时可知。','写出考虑现实限制后的责任判断。'],'不能以“我现在知道结局”推断“那时我必定能够预见”。');
// CH8
 guide('top-task',['写出今天最重要且现实中可完成的一件事。','说明它服务什么长期价值或核心成果。','将行动细化到可以立即开始的步骤。','先推进这一项，再处理次要事务。'],'写论文的人可以先解决核心论证，而不是不断阅读无关文章。');
 guide('project-check',['列出项目选项及预期结果。','检查宏观层面的价值一致性。','听取受项目影响者的真实需要和反馈。','比较机会成本与更有价值的备选方案。'],'原书 PlayPump 案例提醒：受奖助和关注的产品不一定符合当地使用者的需求。');
 guide('premortem',['想象这个项目已经失败。','倒推可能造成失败的具体原因。','列出自己现在能检测的高风险假设。','为最重要的风险制定提前预防措施。'],'假设产品无人使用，可能是没有充分访谈真实用户。');
 guide('time-track',['记录具有代表性的一天实际活动与持续时间。','区分必要事务、真正有恢复价值的休息和后悔的浪费。','选出可以批量、减少或转移的内容。','下周再记录一次，检查调整是否有效。'],'原书一名来访者通过记录发现每天约两小时在手机上无意识滚动。');
 guide('daily-planner',['录入工作及生活任务和估计时长。','按重要/紧急四象限及难度排序。','优先保证重要工作连贯进行，再安排合理短休。','完成后标记状态并根据现实调整，不机械服从排程。'],'先安排重要不紧急的报告工作，避免整天被零碎消息吞没。','本 App 使用可解释的优先级排程，不复现原小工具的模拟退火算法。');
 guide('batch',['列出一周内反复出现的行政事务。','识别可集中处理、自动化、交换或外包的部分。','选择最简单的一项改善。','比较节省的时间与付出的成本。'],'一周统一采购、自动支付固定账单，都可能减少频繁切换。');
 guide('task-split',['找到大到令人无从开始的任务。','把它改成两分钟以内能启动的动作。','执行第一步，再列出下一步。','每一步都尽量是清楚的可操作动作。'],'原书例子：写博士论文太难开始时，先只打开 Word 并找到结果章节。');
 guide('solve',['明确当前究竟遇到什么具体问题。','不急于评价，先广泛列出几个可能解法。','比较可行性并选择一个。','安排何时尝试，随后复盘。'],'“邮件写不出来”可以拆分为：先确认目标、列关键点，再写第一段。');
// CH9
 guide('mood',['记录时间、当下情绪和精力。','写下当时正在进行的主要活动。','连续记录，寻找重复出现的模式。','避免根据单次评分推断心理疾病。'],'连续一周观察到“与朋友吃饭时通常比无意识刷手机更愉快”，可尝试调整活动。');
 guide('activity-list',['优先列出监测时情绪较好的活动。','回忆旧爱好、愉悦型与成就型活动。','加入长期回避任务、价值行动、运动和社交。','筛选一两项完成后可能会庆幸的活动。'],'原书将运动、社交单独列为值得特别考虑的活动类别。');
 guide('activity-schedule',['判断目前属于活动不足、平衡或过度活动。','从清单中挑选 2—3 项适合的行动，或恢复性休息。','给它们指定真实日期和时间。','执行后观察是否庆幸做过，不只凭事前动力决定。'],'如果忙碌到倦怠，计划中的“主动休息两小时”也可能属于事后庆幸型活动。');
 guide('before-after',['确定一项事后可能庆幸的活动。','活动前给心情评分。','实际完成活动。','完成后再评分，并记录是否值得重复。'],'原书建议对同一种活动反复记录，寻找规律；前后评分不等于证明因果。');
// CH10
 guide('conversation',['先提供完整、真诚、好奇的注意。','从兴趣逐步询问观点或近期重要经历。','关系安全时适当分享自己的真实经历。','对对方的感受进行认可，避免只顾给建议。'],'原书建议讨论一周的“高光与低谷”，但也强调尊重彼此界限。');
 guide('assertive',['写清可核对的具体行为。','用“我”陈述讲出感受和需要。','提出清楚、礼貌、可拒绝的请求。','若持续受到施压，平静重复边界或约定后果。'],'“你又迟到了”可改为“我们约好七点，你七点半到；我有些焦虑，希望以后提前通知”。');
 guide('nvc',['事实：避免读心与人格判断。','感受：命名自己的情绪，不给对方定性。','需求：说什么对自己重要，不规定对方唯一动作。','方案：提出可协商、可履行的未来请求。'],'事实：昨晚约 20:00 通话却 21:00 才接通；感受：我有些失落；需求：我需要可预测性；方案：临时变化时可否提前发一条消息？','四段式模板来自你提供的 NVC 工具，是本产品的练习协议，不是原书第十支点的唯一沟通模型。','用户提供的小工具 NVC_feedback.html、conflict_resolution_protocol.html；结合原书 CH10。');
 guide('conflict',['先评估当前情绪强度，必要时暂停并说明恢复时间。','事实→感受→需求→未来方案逐步填写。','将试行周期、核对方式、例外与修改规则说清楚。','用富勒八项规则检查质量，避免让协议成为单方面惩罚工具。'],'暂停 20 分钟后，用四段式表达；协商“遇到加班提前给出预计回复时间”，试行 14 天。','如存在威胁、控制、暴力风险，不建议用协商表格代替现实安全支持。','用户上传的冲突处理流程 + 朗·富勒规则的沟通场景应用改写。');
 guide('communication-quiz',['选择单选、多选或排序题进行训练。','在查看反馈前独立作答。','核对被误认的事实/推测、需要/方案区别。','在真实沟通中尝试结构化表达。'],'“你根本不在乎我”不是可核对事实；“昨天 21:00 发消息，今早收到回复”才是具体事实。','八项规则的“普遍/对等”是人际协议的类比，不是法律学原文等价论述。');
// CH11
 guide('optimism',['记录一次挫折以及最自动的解释。','找出其中可能的永久化、泛化、过度个人归因。','用暂时、具体且考虑现实多因素的表达重写。','继续处理现实中需要承担的责任。'],'“这次面试失败”不等于“我永远做不好任何工作”。');
 guide('growth',['写出一句固定能力判断。','区分当前水平与可能通过练习改善的部分。','把目标变成具体学习活动。','观察下一次能力表现。'],'“我不会演讲”→“我还不熟练，可以在小组里试练一次”。');
 guide('best-self',['给自己 15—20 分钟写作时间。','设想符合个人价值的未来目标进展良好。','写清关系、生活、能力等具体场景。','从愿景中提取近期行动，不把想象当作承诺结果。'],'未来能够与亲近的人稳定相处、学习并保持健康时，一天会怎样度过？');
 guide('begin-again',['注意自己已经偏离希望的方向。','停止额外的自责或反复分析。','在心中说“重新开始”。','执行下一项最小的价值行动。'],'本来想写作却刷了很久手机，可以从打开文档和写一句话重新开始。');
 guide('acceptance',['写清楚已经发生、无法取消的事实。','识别反复出现的“它本来不应该发生”式抵抗。','允许相关自然情绪存在。','将努力转向仍然可以影响的下一步。'],'过去考试失败无法撤销，但可以复盘、寻求帮助和制定新计划。','接纳不等于赞成伤害，也不等于停止保护自己。');

 <div class="method-example"><strong>例子</strong><p class="mb0">${esc(g.example)}</p></div>
 ${g.note?`<p class="small muted mt2 mb0"><strong>使用提醒：</strong>${esc(g.note)}</p>`:''}
 ${full?`<p class="small muted mt2 mb0"><strong>来源与改编：</strong>${esc(g.origin)}</p>`:''}
 </details>`;
}
const SLEEP_FLAGS=[

function sleepDayIndex(day){return daysBetween(state.sleepProtocol.cycleStart,day)+1;}
function sleepFirstDate(){return addDays(state.sleepProtocol.cycleStart,(ui.sleepCycle||0)*28);}
function sleepStatus(log){return !log?'未填':log.wakeTime&&log.energy?'已记录':'部分记录';}
function sleepTextField(day,key,label,kind='text',placeholder='',min='',max=''){
 const value=state.sleepLogs[day]?.[key]??'';
 return `<div class="field"><label>${esc(label)}</label><input class="input sleep-control" type="${kind}" data-sleep-date="${day}" data-sleep-field="${key}" value="${esc(value)}" ${placeholder?`placeholder="${esc(placeholder)}"`:''} ${min!==''?`min="${min}"`:''} ${max!==''?`max="${max}"`:''}></div>`;
}
function sleepCheck(day,key,label,explanation){
 const yes=Boolean(state.sleepLogs[day]?.[key]);
 return `<label class="sleep-check"><input type="checkbox" data-sleep-date="${day}" data-sleep-field="${key}" ${yes?'checked':''}><span><strong>${esc(label)}</strong>${explanation?`<small>${esc(explanation)}</small>`:''}</span></label>`;
}
function sleepFields(){
 const c=state.sleepProtocol,d=ui.sleepDate||localDate(),log=state.sleepLogs[d]||{},start=sleepFirstDate();

 const count=Array.from({length:28},(_,i)=>state.sleepLogs[addDays(start,i)]).filter(x=>x&&(x.wakeTime||x.bedtime||x.energy)).length;

 <div class="segmented sleep-tabs mb2">${tabs.map(([id,title])=>`<button type="button" data-act="sleep-tab" data-tab="${id}" class="${ui.sleepTab===id?'active':''}">${title}</button>`).join('')}</div>`;
 if(ui.sleepTab==='today'){
  const flags=SLEEP_FLAGS.map(x=>sleepCheck(d,x[0],x[0]==='noLateEating'?c.lastMealCutoff+'后避免大餐':x[0]==='dimLight'?c.dimLightFrom+'后调暗灯光':x[1],x[2])).join('');
  return tabsHtml+`<div class="field-grid mb2"><div class="field"><label>记录日期（以当天起床日为准）</label><input id="sleep-selected-date" class="input" type="date" min="${start}" max="${addDays(start,27)}" value="${esc(d)}"></div><div class="field"><label>当前记录状态</label><div class="sleep-status">${sleepStatus(log)}</div></div></div>
  <div class="sleep-editor-grid">
   <div class="sleep-section"><h3>醒来与白天状态</h3><div class="field-grid">${sleepTextField(d,'wakeTime','起床时间','time')}${sleepTextField(d,'energy','白天精力 1—5 分','number','例如 3','1','5')}</div>
    <div class="field-grid">${sleepTextField(d,'caffeineLast','最后一次摄入咖啡因时间','time')}${sleepTextField(d,'napMinutes','午睡分钟数（可提前设闹钟）','number','例如 20','0','600')}</div>
    <div class="field-grid">${sleepTextField(d,'morningLightMinutes','晨光户外分钟数','number','例如 10','0','600')}${sleepTextField(d,'eveningLightMinutes','傍晚户外分钟数','number','例如 10','0','600')}</div>
    ${sleepTextField(d,'waterMl','18:00 前饮水量（毫升）','number','例如 1800','0','10000')}
    <div id="sleep-feedback" class="sleep-feedback">${sleepLiveHints(log)}</div>
   </div>
   <div class="sleep-section"><h3>睡前与夜间</h3><div class="field-grid">${sleepTextField(d,'bedtime','当天上床时间（大约）','time')}${sleepTextField(d,'nightAwakenings','夜间醒来次数','number','少量夜醒很正常','0','40')}</div>
    <div class="sleep-check-grid">${flags}</div>
    <div class="field"><label>睡眠备注（可选）</label><textarea class="textarea sleep-control" data-sleep-date="${d}" data-sleep-field="note" rows="3" placeholder="例如：今天起床较晚，晚上灯光过亮；不必要求每天完美">${esc(log.note||'')}</textarea></div>
   </div>
  </div><div class="hintbox mt2">记录修改立即保存。你可以先填写早晨信息，晚上回来补充上床时间和环境；点击页面底部“完成并保存”会把当前睡眠记录关联到训练计划。</div>`;
 }

function shuffle(xs){const a=xs.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

 ui.commTab='quiz';go('communication');

function openModal(title,body,{wide=false}={}){ui.activeModal=title;$('overlay-root').innerHTML=`<div class="modal-wrap" data-act="close-overlay-backdrop"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="modal-close" aria-label="关闭" data-act="close-modal">×</button></div>${body}</div></div>`;const focus=$('overlay-root').querySelector('.input,.textarea,.select,.modal-close');if(focus)focus.focus({preventScroll:true});}
function closeModal(){ui.activeModal=null;$('overlay-root').innerHTML='';ui.practice=null;stopTimer();stopBreath(true);}
function stopTimer(){if(ui.timer.interval)clearInterval(ui.timer.interval);ui.timer.interval=null;ui.timer.running=false;}
function simpleField(id,label,value='',type='textarea',extra=''){return `<div class="field"><label for="${esc(id)}">${esc(label)}</label>${type==='textarea'?`<textarea class="textarea" id="${esc(id)}" name="${esc(id)}" ${extra}>${esc(value)}</textarea>`:`<input class="input" type="${type}" id="${esc(id)}" name="${esc(id)}" value="${esc(value)}" ${extra}>`}</div>`;}
function editorKey(form){
 if(!form)return '';
 return 'editor:'+form.id+':'+['planId','taskId','stageId','goalId','noteId','occKey'].map(x=>form.querySelector(`[name="${x}"]`)?.value||'').join(':');
}
function storeEditorDraft(form){
 if(!form||!form.id||form.id==='practice-form')return;
 const rows=[...form.querySelectorAll('[name]')].map(el=>({name:el.name,type:el.type,value:el.value,checked:el.checked}));
 state.editorDrafts[editorKey(form)]=rows;persist();
}
function restoreEditorDraft(form){
 const rows=state.editorDrafts[editorKey(form)];if(!Array.isArray(rows))return;
 if(form.id==='task-form'){
  const type=rows.find(x=>x.name==='scheduleType')?.value;
  const p=state.plans.find(x=>x.id===form.querySelector('[name="planId"]')?.value);
  if(type&&p){
   const select=form.querySelector('#task-schedule-type');if(select)select.value=type;
   const target=form.querySelector('#schedule-fields');
   if(target)target.innerHTML=renderScheduleFields({type,start:p.startDate,end:p.endDate,dates:[p.startDate],date:p.startDate,weekdays:[1,3,5]},p);
  }
 }
 for(const el of form.querySelectorAll('[name]')){
  const line=rows.find(x=>x.name===el.name&&(el.type!=='checkbox'||x.value===el.value));
  if(line){if(el.type==='checkbox')el.checked=Boolean(line.checked);else el.value=line.value;}
 }
}
function clearEditorDraft(form){if(form)delete state.editorDrafts[editorKey(form)];}
function modalForm(title,inner,formId,submit='保存',wide=false){
 openModal(title,`<form id="${formId}">${inner}<div class="form-actions"><button type="button" class="btn secondary" data-act="close-modal">取消</button><button type="submit" class="btn">${submit}</button></div></form>`,{wide});
 restoreEditorDraft($(formId));
}
function openPlanModal(p){const editing=!!p;modalForm(editing?'编辑计划':'创建自定义计划',`${simpleField('planName','计划名称',p?.name||'我的训练计划','text','required maxlength="80"')}
 <div class="field-grid">${simpleField('planStart','开始日期',p?.startDate||localDate(),'date','required')}${simpleField('planEnd','结束日期',p?.endDate||addDays(localDate(),29),'date','required')}</div>
 ${simpleField('planDesc','简要说明（可选）',p?.description||'')}
 ${p?`<input type="hidden" name="planId" value="${esc(p.id)}">`:''}<div class="hintbox">新计划先包含一个空阶段。你可以添加其他阶段、工具任务、指定日期及依赖关系。</div>`, 'plan-form', editing?'保存修改':'创建计划',true);}

function openGoalModal(goal){const existing=!!goal;modalForm(existing?'编辑价值目标':'创建价值目标',

 `<div class="field-grid"><div class="field"><label>关联内在价值</label><select class="select" name="goalValue">${option('','暂未选择',goal?.value)}${VALUES.map(v=>option(v,v,goal?.value)).join('')}</select></div>${simpleField('goalTarget','目标次数',goal?.target||4,'number','min="1" max="100000" required')}</div>`+
 simpleField('goalUnit','单位',goal?.unit||'次','text','maxlength="30"')+

function openNoteModal(record){modalForm(record?'编辑笔记':'新建笔记',

function openRescheduleModal(key){const found=findOcc(key);if(!found){notify('找不到该任务',true);return;}const {plan,occ}=found;modalForm('调整训练日期',`<p class="small muted">${esc(pickLabel(occ.task.toolId))} · 原日期 ${prettyDate(occ.originalDate)}</p><div class="field"><label>新训练日期</label><input class="input" name="newDate" type="date" value="${occ.date}" min="${plan.startDate}" max="${plan.endDate}" required></div><input type="hidden" name="occKey" value="${esc(key)}"><p class="small muted">只能顺延到当前计划日期范围内。如需延长，先编辑计划结束日期。</p>`, 'reschedule-form','保存日期');}
function findOcc(key){for(const p of state.plans){const occ=occurrences(p).find(x=>x.key===key);if(occ)return {plan:p,occ};}return null;}
function openTaskModal(p,t=null,preferredTool=''){const isEdit=!!t;let schedule=t?.schedule||{type:'daily',start:p.startDate,end:p.endDate,weekdays:[1,3,5],dates:[localDate()]};
 const type=schedule.type||'daily';const deps=new Set(t?.dependsOn||[]);
 const body=`<div class="field-grid"><div class="field"><label>训练工具</label><select class="select" name="toolId" required>${toolOptions(t?.toolId||preferredTool||'mood')}</select></div><div class="field"><label>所属阶段</label><select class="select" name="stageId">${p.stages.map(s=>option(s.id,s.name,t?.stageId||p.stages[0]?.id)).join('')}</select></div></div>
 <div class="field-grid"><div class="field"><label>单次时长（分钟）</label><input class="input" type="number" name="duration" min="1" max="180" value="${t?.duration||TOOL_INDEX[preferredTool]?.duration||5}" required></div><div class="field"><label>重复类型</label><select class="select" name="scheduleType" id="task-schedule-type">${[['once','指定单日'],['dates','指定多个日期'],['daily','每天'],['weekly','指定星期']].map(x=>option(x[0],x[1],type)).join('')}</select></div></div>
 <div id="schedule-fields">${renderScheduleFields(schedule,p)}</div>
 <div class="field"><label>前置任务（可多选，完成任意一次该任务后解锁）</label><div class="choice-chips">${p.tasks.filter(x=>x.id!==t?.id).map(x=>`<label class="choice-chip" style="cursor:pointer"><input type="checkbox" class="input" style="min-height:auto;width:auto" name="dep" value="${esc(x.id)}" ${deps.has(x.id)?'checked':''}>${esc(pickLabel(x.toolId))}</label>`).join('')||'<span class="small muted">暂无其他任务</span>'}</div></div>
 <div class="field"><label>关联价值目标</label><select class="select" name="goalId">${goalOptions(t?.goalId||'')}</select></div><label class="checkbox-line"><input type="checkbox" name="required" ${t?.required!==false?'checked':''}><span>必做训练（计入计划完成率与连续打卡）</span></label>
 <input type="hidden" name="planId" value="${p.id}"><input type="hidden" name="taskId" value="${t?.id||''}"><div class="hintbox">到达预定日期但前置任务尚未完成时，会显示“待解锁”，不会自动判定失败。依赖不允许形成循环。</div>`;
 modalForm(isEdit?'编辑训练任务':'添加训练任务',body,'task-form',isEdit?'保存任务':'添加任务',true);
}
function renderScheduleFields(s,p){let body='';const type=s.type||'daily';
 if(type==='once')body=`${simpleField('dateOnce','执行日期',s.date||p.startDate,'date',`min="${p.startDate}" max="${p.endDate}" required`)}`;
 if(type==='dates')body=`<div class="field"><label>指定多个日期（每行一个 YYYY-MM-DD，或英文逗号分隔）</label><textarea class="textarea" name="dates" id="dates" placeholder="${p.startDate}\n${addDays(p.startDate,2)}">${esc((s.dates||[p.startDate]).join('\n'))}</textarea></div>`;
 if(type==='daily'||type==='weekly')body=`<div class="field-grid">${simpleField('scheduleStart','起始日期',s.start||p.startDate,'date',`min="${p.startDate}" max="${p.endDate}" required`)}${simpleField('scheduleEnd','结束日期',s.end||p.endDate,'date',`min="${p.startDate}" max="${p.endDate}" required`)}</div>`;
 if(type==='weekly')body+=`<div class="field"><label>每周哪几天？</label><div class="day-switch">${['日','一','二','三','四','五','六'].map((d,i)=>`<label><input type="checkbox" name="weekday" value="${i}" ${(s.weekdays||[1,3,5]).includes(i)?'checked':''}>周${d}</label>`).join('')}</div></div>`;
 return body;
}
function openToolInfo(tool){openModal(tool.name,`<div class="pills mb2">${pill('CH'+tool.chapter,'green')}${pill(FREQ_LABEL[tool.freq])}${evidencePill(tool)}${pill('约 '+tool.duration+' 分钟')}</div>
 <p>${esc(tool.description)}</p>${renderGuide(tool.id,true)}<h3>什么情况下值得使用</h3><p class="muted small">${esc(tool.tags.join('、')||'与当前目标相关的情境')}。按自身情况选择，不必因为工具排序靠前就强迫每天使用。</p>
 <h3>交互练习方式</h3><p class="muted small">${tool.prompts.length?esc(tool.prompts.map(x=>'· '+x).join('\n')):'在引导式界面中完成练习，并保存个人记录。'}</p>
 <div class="warningbox mt1">研究证据等级为供界面排序的概括性元数据，可能反映治疗类别而不是单项工具的独立临床效果。${tool.safety==='restricted'?' 这一模块仅提供教育性说明，不开放高强度自助练习。':tool.safety==='caution'?' 如练习使不适明显加重，请停止并考虑合适的专业指导。':''}</div>

function openRecord(id){const r=state.practiceSessions.find(s=>s.id===id);if(!r)return;const items=Object.entries(r.data||{}).filter(([k,v])=>v!==''&&v!==null&&(!(Array.isArray(v))||v.length));openModal('练习历史 · '+pickLabel(r.toolId),`<div class="pills mb2">${pill(fmtDT(r.completedAt),'green')}${pill((r.duration||0)+' 分钟')}${r.planId?pill('训练计划内') :pill('自由练习')}</div><div class="col">${items.map(([key,value])=>`<div class="rule-tile"><strong>${esc(key)}</strong><p class="pre-line" style="white-space:pre-wrap">${esc(Array.isArray(value)?value.join('、'):typeof value==='object'?JSON.stringify(value,null,2):value)}</p></div>`).join('')||'<div class="muted">本次只有完成状态，没有填写文本。</div>'}</div><div class="form-actions"><button class="btn secondary" data-act="close-modal">关闭</button></div>`,{wide:true});}
function practiceKey(toolId,key=''){return key||'quick:'+toolId;}
function openPractice(toolId,occurrenceKey=''){
 const t=TOOL_INDEX[toolId];if(!t)return notify('工具不存在',true);
 if(t.mode==='quiz'){closeModal();startQuiz('all',occurrenceKey);return;}
 if(t.safety==='restricted'){openToolInfo(t);return;}
 ui.practice={toolId,occurrenceKey,draftKey:practiceKey(toolId,occurrenceKey),startedAt:dateTime(),step:0};
 if(t.mode==='sleep'){
  ui.sleepDate=occurrenceKey?findOcc(occurrenceKey)?.occ.date||localDate():localDate();
  const first=state.sleepProtocol.cycleStart;
  ui.sleepCycle=Math.max(0,Math.floor(daysBetween(first,ui.sleepDate)/28));
  ui.sleepTab='today';
 }
 if(t.mode==='guided'){stopTimer();stopBreath(true);ui.timer.remaining=(occurrenceKey?findOcc(occurrenceKey)?.occ.task.duration||t.duration:t.duration||5)*60;}
 showPractice();
}
function fieldT(name,label,d,placeholder='',rows=3){return `<div class="field"><label>${esc(label)}</label><textarea name="${esc(name)}" class="textarea" rows="${rows}" placeholder="${esc(placeholder)}">${esc(d?.[name]||'')}</textarea></div>`;}
function fieldI(name,label,d,placeholder='',type='text'){return `<div class="field"><label>${esc(label)}</label><input name="${esc(name)}" class="input" type="${type}" placeholder="${esc(placeholder)}" value="${esc(d?.[name]||'')}"></div>`;}
function sliderField(name,label,d,defaultVal=5,max=10){const val=d?.[name]??defaultVal;return `<div class="field"><label>${esc(label)}</label><div class="range-line"><input class="input" type="range" min="0" max="${max}" step="1" name="${name}" value="${clamp(val,0,max)}" data-slider="${name}"><span class="score-large" id="slider-${name}">${clamp(val,0,max)}/${max}</span></div></div>`;}
function checkChips(name,values,selected=[]){return `<div class="choice-chips">${values.map(x=>`<label class="choice-chip ${selected.includes(x)?'selected':''}"><input type="checkbox" name="${name}" value="${esc(x)}" ${selected.includes(x)?'checked':''} style="position:absolute;opacity:0;pointer-events:none"><span>${selected.includes(x)?'✓ ':''}${esc(x)}</span></label>`).join('')}</div>`;}
function practiceFields(t,d){switch(t.mode){
 case 'sleep':return sleepFields(d);
 case 'abc':return `<div class="hintbox mb2">A 是可观察的事件，B 是解释或信念，C 是情绪和行为。避免把“他就是不尊重我”直接写成事实。</div>${fieldT('A · 触发事实','A · 发生了什么（事实）',d,'具体时间、行为、原话')}${fieldT('B · 想法或信念','B · 我当时怎样解释？',d,'例如：他一定对我很失望')}${fieldT('C · 情绪与行为','C · 随后发生了什么？',d,'情绪、身体变化、实际行动')}${fieldT('背景易感因素','哪些背景可能放大反应？',d,'疲劳、睡眠、其他压力…')}`;

 case 'mood':return `${sliderField('mood','现在的心情（0 非常糟糕，10 非常好）',d,5)}${sliderField('energy','现在的精力',d,5)}${fieldI('activity','刚才在做什么？',d,'例如：散步、午餐、工作')}${fieldT('note','可选备注',d,'无须解释全部原因；只记录当下体验',2)}`;
 case 'toward':return `${fieldT('value','今天想践行的价值',d,'例如：联结、健康、成长')}${fieldT('action','今天可以采取的最小价值行动',d,'具体到何时做什么')}${fieldT('obstacle','可能遇到的阻力与应对',d,'如果……那么……',2)}`;
 case 'top-task':return `${fieldT('main','今天最值得完成的一件事',d,'应当具体、可完成，并与长期价值有关')}${fieldT('micro','能在两分钟内开始的第一步',d)}${fieldT('why','它为什么比其他事情更重要？',d,'价值与影响，而非只有紧急程度',2)}`;
 case 'vast':return `${fieldT('valuable','V · 为什么有价值？',d)}${fieldT('aspirational','A · 想努力达到什么？',d)}${fieldT('streamlined','S · 哪些目标需要暂时放下？',d)}${fieldT('targeted','T · 可以怎样判断进展？',d)}`;
 case 'rid':return `${fieldT('risk','R · 风险与触发因素',d)}${fieldT('signs','I · 最早出现的预警信号',d)}${fieldT('prevention','D · 预防行动',d)}${fieldT('coping','困难真的出现后，我的应对步骤',d)}<div class="dangerbox">如果当前存在立即的自伤危险或无法维持安全，请优先寻求当地紧急支持，本记录不是替代性危机计划。</div>`;
 case 'hierarchy':return `<div class="warningbox mb2">只为现实中安全、适合逐步接触的情境制定等级。复杂恐惧、创伤或强迫问题应考虑专业支持。</div>${Array.from({length:5},(_,i)=>`<div class="field-grid"><div>${fieldI('challenge'+i,`挑战 ${i+1}`,d,'从低难度到高难度')}</div><div>${sliderField('fear'+i,`预计恐惧程度 ${i+1}`,d,(i+1)*2)}</div></div>`).join('')}`;
 case 'review':return `${fieldT('worked','这段时间哪些行动确实有帮助？',d)}${fieldT('block','哪些安排遇到阻碍？',d)}${fieldT('learned','我观察到了什么？',d)}${fieldT('next','下一周最值得调整的一步',d)}`;

 if(a==='timer-toggle'){if(ui.timer.running){stopTimer();}else{if(ui.timer.remaining<=0)ui.timer.remaining=TOOL_INDEX[ui.practice?.toolId]?.duration*60||300;ui.timer.running=true;ui.timer.interval=setInterval(()=>{ui.timer.remaining=Math.max(0,ui.timer.remaining-1);const el=$('timer-value');if(el)el.textContent=formatTimer(ui.timer.remaining);if(ui.timer.remaining<=0){stopTimer();notify('计时完成；可以保存本次练习。');}},1000);}return;}
 if(a==='timer-reset'){stopTimer();ui.timer.remaining=(TOOL_INDEX[ui.practice?.toolId]?.duration||5)*60;if($('timer-value'))$('timer-value').textContent=formatTimer(ui.timer.remaining);return;}
 if(a==='nvc-next'){const d=updateDraftFromForm()||{};const step=ui.practice?.step||0;if(step===0&&!d.fact?.trim())return notify('请先写下可观察的事实。',true);if(step===1&&!(d.feelings?.length||d.emotionNote?.trim()))return notify('请先记录一种感受。',true);if(step===2&&!(d.needs?.length||d.need?.trim()))return notify('请先说明一种需要。',true);ui.practice.step=Math.min(3,step+1);showPractice();return;}
 if(a==='nvc-prev'){updateDraftFromForm();ui.practice.step=Math.max(0,ui.practice.step-1);showPractice();return;}
 if(a==='planner-add'||a==='planner-toggle'||a==='planner-delete')return managePlanner(a.replace('planner-',''),el.dataset.id||'');
 if(a==='planner-generate'){updateDraftFromForm();$('planner-output').innerHTML=renderPlannerOutput(state.plannerTasks[ui.plannerDate]||[],$('planner-start')?.value||'09:00');return;}
}
function formHandler(e){const form=e.target;if(!(form instanceof HTMLFormElement))return;e.preventDefault();
 try{if(form.id==='practice-form')return completePractice();if(form.id==='plan-form')return savePlanForm(form);if(form.id==='task-form')return saveTaskForm(form);if(form.id==='stage-form')return saveStageForm(form);if(form.id==='goal-form')return saveGoalForm(form);if(form.id==='note-form')return saveNoteForm(form);if(form.id==='rule-form')return saveRuleForm(form);if(form.id==='reschedule-form'){const fd=new FormData(form),key=String(fd.get('occKey')||''),date=String(fd.get('newDate')||'');const f=findOcc(key);if(!f||!within(date,f.plan.startDate,f.plan.endDate))throw Error('日期超出计划范围。');if(date===f.occ.originalDate)delete state.reschedules[key];else state.reschedules[key]=date;clearEditorDraft(form);persist(true);closeModal();render();notify('任务日期已调整');return;}}
 catch(err){notify('请检查输入：'+err.message,true);console.error(err);}
}
function onInput(e){const t=e.target;
 if(t.dataset.sleepField){writeSleepInput(t);return;}
 if(t.dataset.sleepConfig){const k=t.dataset.sleepConfig;state.sleepProtocol[k]=t.type==='number'?Number(t.value):t.value;persist();return;}
 if(t.id==='breath-volume'){ui.breath.volume=Number(t.value)/100;if(ui.breath.running&&ui.breath.sound)breathPhaseTone(ui.breath.phase);return;}
 if(t.id==='tool-search'){ui.toolSearch=t.value;const cursor=t.selectionStart;render();const input=$('tool-search');if(input){input.focus();input.setSelectionRange(cursor,cursor);}return;}
 if(t.id==='principles'){state.guidingFoundations.principles=t.value;persist();return;}
 if(t.id==='planner-date'&&ui.practice?.toolId==='daily-planner'){updateDraftFromForm();ui.plannerDate=t.value||localDate();showPractice();return;}
 if(t.id==='planner-start'&&ui.practice?.toolId==='daily-planner'){updateDraftFromForm();const d=state.drafts[ui.practice.draftKey]||{};d.startTime=t.value;state.drafts[ui.practice.draftKey]=d;persist();return;}
 if(t.matches('[data-slider]')){const label=$('slider-'+t.dataset.slider);if(label)label.textContent=t.value+'/'+t.max;if(t.name==='intensity'&&ui.practice?.toolId==='conflict'){const msg=$('conflict-pause-hint');if(msg)msg.innerHTML=Number(t.value)>=7?'<div class="warningbox">情绪强度较高。建议暂时停止争辩，并明确双方可接受的恢复时间与空间边界。</div>':'';}}
 if(ui.practice&&$('practice-form')?.contains(t))updateDraftFromForm();
 const editor=t.closest('form');if(editor&&editor.id!=='practice-form')storeEditorDraft(editor);
}
function onChange(e){const t=e.target;
 if(t.id==='sleep-selected-date'){ui.sleepDate=t.value;showPractice();return;}
 if(t.dataset.sleepField){writeSleepInput(t);return;}
 if(t.dataset.sleepConfig){state.sleepProtocol[t.dataset.sleepConfig]=t.type==='number'?Number(t.value):t.value;persist();return;}if(t.id==='plan-select'){ui.planId=t.value;render();return;}
 if(t.id==='chapter-filter'){ui.chapter=t.value;render();return;}
 if(t.id==='sort-tools'){ui.toolSort=t.value;render();return;}
 if(t.id==='task-schedule-type'){
  const planId=$('task-form')?.querySelector('[name="planId"]')?.value,p=state.plans.find(x=>x.id===planId);if(p){const type=t.value;$('schedule-fields').innerHTML=renderScheduleFields({type,start:p.startDate,end:p.endDate,dates:[p.startDate],date:p.startDate,weekdays:[1,3,5]},p);storeEditorDraft($('task-form'));}return;
 }
 if(t.type==='checkbox'&&t.closest('.choice-chip')){const box=t.closest('.choice-chip');box.classList.toggle('selected',t.checked);const label=box.querySelector('span');if(label){const name=t.value;label.textContent=(t.checked?'✓ ':'')+name;}}
 if(ui.practice&&$('practice-form')?.contains(t))updateDraftFromForm();
 const editor=t.closest('form');if(editor&&editor.id!=='practice-form')storeEditorDraft(editor);
}
function bindEvents(){document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();if(ui.activeModal)closeModal();go(nav.dataset.nav);return;}
 const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='BUTTON'||el.tagName==='A')e.preventDefault();
 try{handleAction(el,e);}catch(err){console.error(err);notify('操作未能完成：'+err.message,true);}
 });document.addEventListener('submit',formHandler);document.addEventListener('input',onInput);document.addEventListener('change',onChange);
 $('import-file').addEventListener('change',e=>importFile(e.target.files?.[0]));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.activeModal)closeModal();});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)breathPause();});
 window.addEventListener('beforeunload',()=>{stopBreath(true);if(saveTimer)writeSave();});
}
function init(){bindEvents();if(!loadError){try{if(!localStorage.getItem(STORAGE_KEY))writeSave();}catch(e){notify('无法启用本地保存：'+e.message,true);}}render();if(loadError)notify(loadError,true);if(state.quizDraft){ui.quiz=state.quizDraft;ui.commTab='quiz';}document.title='十二支点 · 成长工作台';}
init();

</script>
</body>
</html>
